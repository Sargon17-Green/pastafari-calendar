<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>לוח שנה פסטפרי מקומי</title>
  <style>
    :root { font-family: Arial, "Noto Sans Hebrew", sans-serif; color-scheme: light; }
    body { margin: 0; background: #f5f2e8; color: #27291f; }
    main { width: min(68rem, calc(100% - 2rem)); margin: 1.5rem auto 4rem; }
    section { margin-block: 1.5rem 2.5rem; }
    h1, h2 { margin-block: 0 .65rem; }
    p { line-height: 1.6; }
    output { display: block; min-height: 1.5rem; margin-block: .6rem; padding: .7rem; border-radius: 8px; background: #fffdf5; }
  </style>
</head>
<body>
<main>
  <h1>רכיב פסטפרי מתוך קובץ HTML מקומי</h1>
  <p>הדף הזה מיועד לפתיחה ישירה בלחיצה כפולה. אין צורך בשרת או בחיבור לרשת.</p>

  <section>
    <h2>תאריך ברירת המחדל</h2>
    <pastafari-date></pastafari-date>
  </section>

  <section>
    <h2>תאריך יעד ויום מעשה מפורשים</h2>
    <output id="change-output" aria-live="polite">ממתין לתוצאה…</output>
    <pastafari-date
      id="fixed-calendar"
      date="2026-08-06"
      calculation-date="2026-08-06">
    </pastafari-date>
  </section>
</main>

<script>
  const fixedCalendar = document.querySelector("#fixed-calendar");
  const changeOutput = document.querySelector("#change-output");
  fixedCalendar.addEventListener("pastafari-change", (event) => {
    const value = event.detail;
    changeOutput.textContent = [
      `שנה ${value.year}`,
      `קציצה ${value.cutletName}, יום ${value.dayInCutlet}`,
      `חודש ${value.monthName}, יום ${value.dayInMonth}`,
    ].join(" · ");
  });
</script>
<script src="./pastafari-date.js"></script>
</body>
</html>
