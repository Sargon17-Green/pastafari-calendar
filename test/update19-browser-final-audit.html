<!doctype html>
<meta charset="utf-8">
<title>Update 19 independent browser/worker/standalone audit</title>
<pre id="result">RUNNING</pre>
<script src="../browser/standalone/pastafari-date.js"></script>
<script type="module">
const node = document.getElementById("result");
const SEED = 0x19f17a5d;
function canonical(value) {
  const s = typeof value?.toJSON === "function" ? value.toJSON() : value;
  return { year:String(s.year), cutletName:String(s.cutletName), dayInCutlet:Number(s.dayInCutlet), monthName:String(s.monthName), dayInMonth:Number(s.dayInMonth) };
}
function stable(v){return JSON.stringify(v);}
function same(a,b){return stable(a)===stable(b);}
function finish(payload){globalThis.__PASTAFARI_UPDATE19_BROWSER_AUDIT__={...payload,complete:true};node.textContent=JSON.stringify(globalThis.__PASTAFARI_UPDATE19_BROWSER_AUDIT__,null,2);}
function workerConvert(url,c,t){return new Promise((resolve,reject)=>{const w=new Worker(url,{type:"module"});const id=190019;const timer=setTimeout(()=>{w.terminate();reject(new Error(`worker timeout ${url}`));},300000);w.onmessage=e=>{const m=e.data;if(m?.kind==="ready"){w.postMessage({id,operation:"convert",payload:{calculationJdn:String(c),targetJdn:String(t)}});return;}if(m?.id!==id)return;clearTimeout(timer);w.terminate();m.ok?resolve(m.result):reject(new Error(m.error?.message||"worker error"));};w.onerror=e=>{clearTimeout(timer);w.terminate();reject(new Error(e.message||"worker failure"));};});}
try{
  const [reference,kokiRef,core,fast,api]=await Promise.all([
    import("../verification/reference-oracle/reference.mjs"),
    import("../verification/update12/reference-koki.mjs"),
    import("../browser/pastafari-calendar-core.js"),
    import("../browser/pastafari-calendar-fast.js"),
    import("../src/public-api.js"),
  ]);
  const cases=[
    {id:"fresh-foundation-offset",c:reference.FOUNDATION_JDN+37n,t:reference.FOUNDATION_JDN-19n},
    {id:"fresh-cross-foundation",c:reference.FOUNDATION_JDN-11n,t:reference.FOUNDATION_JDN+13n},
    {id:"fresh-tablets-local",c:1442903n+17n,t:1442903n-23n},
  ];
  const rows=[];
  for(const x of cases){
    const expected=canonical(new reference.ReferenceCalendar(x.c).convertJdn(x.t));
    const ac=new core.PastafariCalendar({todayProvider:()=>new core.GregorianDate(2000n,1,1)});
    const fc=new fast.PastafariCalendar({todayProvider:()=>new fast.GregorianDate(2000n,1,1)});
    const browserAuth=canonical(ac.convertJdn(x.t,{calculationJdn:x.c}));
    const browserFast=canonical(fc.convertJdn(x.t,{calculationJdn:x.c}));
    let authWorker=null,fastWorker=null,workerError=null;
    try{authWorker=canonical(await workerConvert("../browser/pastafari-authoritative-worker.js",x.c,x.t));fastWorker=canonical(await workerConvert("../browser/pastafari-fast-worker.js",x.c,x.t));}catch(e){workerError={name:e.name,message:e.message};}
    rows.push({id:x.id,input:{calculationJdn:String(x.c),targetJdn:String(x.t)},reference:expected,browserAuth,browserFast,authWorker,fastWorker,workerError,matches:{browserAuth:same(expected,browserAuth),browserFast:same(expected,browserFast),authWorker:!workerError&&same(expected,authWorker),fastWorker:!workerError&&same(expected,fastWorker)}});
  }
  // Hostile Intl must not change structured Chinese semantics.
  const chineseJdns=[reference.FOUNDATION_JDN,reference.FOUNDATION_JDN+1n,1442903n,2461259n];
  const chineseBaseline=chineseJdns.map(jdn=>({jdn:String(jdn),value:api.jdnToChinese(jdn)}));
  const Real=Intl.DateTimeFormat;
  const intlProfiles=[];
  for(const profile of ["throws","plausible-wrong"]){
    let error=null,values=[];
    try{
      Intl.DateTimeFormat=profile==="throws"?function(){throw new Error("U19 Intl blocked");}:function(){return {format:()=>"1/1/9999",formatToParts:()=>[{type:"year",value:"9999"},{type:"month",value:"13"},{type:"day",value:"99"}],resolvedOptions:()=>({locale:"en-US",timeZone:"UTC"})};};
      values=chineseJdns.map(jdn=>({jdn:String(jdn),value:api.jdnToChinese(jdn)}));
    }catch(e){error={name:e.name,message:e.message};}finally{Intl.DateTimeFormat=Real;}
    intlProfiles.push({profile,error,values,match:!error&&stable(values)===stable(chineseBaseline)});
  }
  // Standalone is tested against the independent browser reference, not against core.
  const standaloneC=2461259n,standaloneT=2461261n;
  const standaloneExpected=canonical(new reference.ReferenceCalendar(standaloneC).convertJdn(standaloneT));
  let standaloneActual=null,standaloneError=null;
  try{
    // Do not borrow Gregorian conversion from production. The standalone accepts
    // Gregorian strings, so derive those strings with the independent Kōki/Gregorian
    // reference helper and then require a real standalone result.
    const gC=kokiRef.referenceJdnToGregorian(standaloneC);
    const gT=kokiRef.referenceJdnToGregorian(standaloneT);
    const fmt=g=>`${String(g.year).padStart(4,"0")}-${String(g.month).padStart(2,"0")}-${String(g.day).padStart(2,"0")}`;
    if(!globalThis.PastafariCalendarStandalone?.getPastafariDateAsync) throw new Error("standalone global/API missing");
    standaloneActual=canonical(await globalThis.PastafariCalendarStandalone.getPastafariDateAsync(fmt(gT),fmt(gC)));
  }catch(e){standaloneError={name:e.name,message:e.message};}
  const failures=[];
  for(const r of rows)for(const [k,v] of Object.entries(r.matches))if(!v)failures.push(`${r.id}:${k}`);
  if(!intlProfiles.every(p=>p.match))failures.push("intl-host-independence");
  if(standaloneError||!standaloneActual||!same(standaloneExpected,standaloneActual))failures.push("standalone-reference-parity");
  finish({schema:"pastafari.update19.browser-worker-standalone.v1",status:failures.length?"FAIL":"PASS",seed:SEED,failures,rows,intl:{baseline:chineseBaseline,profiles:intlProfiles},standalone:{input:{calculationJdn:String(standaloneC),targetJdn:String(standaloneT)},reference:standaloneExpected,actual:standaloneActual,error:standaloneError,match:standaloneActual?same(standaloneExpected,standaloneActual):null}});
}catch(e){finish({schema:"pastafari.update19.browser-worker-standalone.v1",status:"ERROR",error:{name:e.name,message:e.message,stack:e.stack||""}});}
</script>
