name: Icelandic Gemma4 reviewer qualification

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-is-gemma4-smoke.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/is-gemma/llama
          curl -fL --retry 3             https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz             -o /tmp/is-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/is-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/is-gemma/llama.tar.gz -C /tmp/is-gemma/llama

      - name: Qualify base Gemma 4 reviewer on hidden controls
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/is-gemma/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER"             -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0             --reasoning auto --chat-template-kwargs '{"enable_thinking":false}'             -c 4096 -t 4 --host 127.0.0.1 --port 8080             > /tmp/is-gemma/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 240); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases = [
              ("g1", "Velkomin á vefinn.", "EÐLILEGT"),
              ("g2", "Veldu dagsetningu og reyndu aftur.", "EÐLILEGT"),
              ("g3", "Þessar dagsetningar eru réttar og birtast hér.", "EÐLILEGT"),
              ("b1", "Þessar dagsetningar er rétt og birtist hér.", "LAGFÆRA"),
              ("b2", "Veldu dagsetning og reyna aftur.", "LAGFÆRA"),
              ("b3", "This text is in English.", "LAGFÆRA"),
          ]
          base = (
              "Þú ert strangur íslenskur málfarsrýnir. "
              "Metið aðeins textabrotið sem fylgir. "
              "Athugaðu eðlilega nútímaíslensku, málfræði, beygingu, setningagerð og hvort textinn sé á íslensku. "
              "Ekki bæta við efni sem ekki er í textabrotinu. "
              "Fyrsta línan verður að vera nákvæmlega annaðhvort „DÓMUR: EÐLILEGT“ eða „DÓMUR: LAGFÆRA“. "
              "Á annarri línu skaltu gefa mjög stutta ástæðu á íslensku. "
              "Ef dómurinn er LAGFÆRA skaltu á þriðju línu gefa eina eðlilega leiðréttingu."
          )
          results = []
          for case_id, fragment, expected in cases:
              payload = {
                  "messages": [{"role": "user", "content": base + "\n\nTEXTABROT: „" + fragment + "“"}],
                  "temperature": 0.0,
                  "max_tokens": 140,
                  "reasoning_effort": "none",
                  "chat_template_kwargs": {"enable_thinking": False},
                  "stream": False,
              }
              req = urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=900) as resp:
                  data = json.load(resp)
              answer = data["choices"][0]["message"]["content"].strip()
              first = answer.splitlines()[0].strip() if answer else ""
              actual = "EÐLILEGT" if first == "DÓMUR: EÐLILEGT" else "LAGFÆRA" if first == "DÓMUR: LAGFÆRA" else "ÓGILT"
              passed = actual == expected
              results.append({"id": case_id, "fragment": fragment, "expected": expected, "actual": actual, "passed": passed, "answer": answer})
              print(f"{case_id}: expected={expected} actual={actual} passed={passed}")
              print(answer)
              print()
          Path("/tmp/is-gemma/qualification.json").write_text(json.dumps(results, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("/tmp/is-gemma/qualification.md").write_text(
              "\n\n".join(
                  f"## {r['id']}\n\nTexti: „{r['fragment']}“\n\nVænt: {r['expected']}\n\nRaun: {r['actual']}\n\n{r['answer']}"
                  for r in results
              ) + "\n",
              encoding="utf-8",
          )
          failed = [r["id"] for r in results if not r["passed"]]
          if failed:
              raise SystemExit("Icelandic reviewer qualification failed: " + ", ".join(failed))
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icelandic-gemma4-reviewer-qualification
          path: |
            /tmp/is-gemma/qualification.json
            /tmp/is-gemma/qualification.md
            /tmp/is-gemma/server.log
          if-no-files-found: warn
          retention-days: 30
