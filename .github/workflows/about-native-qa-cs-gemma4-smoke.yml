name: Czech Gemma4 reviewer qualification

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-cs-gemma4-smoke.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cs-gemma/llama
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/cs-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/cs-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cs-gemma/llama.tar.gz -C /tmp/cs-gemma/llama

      - name: Qualify Czech reviewer on hidden controls
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/cs-gemma/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 \
            --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' \
            -c 4096 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/cs-gemma/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases = [
              ("g1", "Vyberte datum a zkuste to znovu.", "PŘIROZENÉ"),
              ("g2", "Den činnosti je výchozím bodem výpočtu.", "PŘIROZENÉ"),
              ("g3", "Předchozí řízek", "PŘIROZENÉ"),
              ("g4", "Měsíce se mohou během roku vzájemně proplétat.", "PŘIROZENÉ"),
              ("b1", "Zmeňte deň činnosti.", "OPRAVIT"),
              ("b2", "Click here a pokračujte.", "OPRAVIT"),
              ("b3", "W tym roku jest kilka miesięcy.", "OPRAVIT"),
              ("b4", "Jak пользоваться tímto webem?", "OPRAVIT"),
          ]
          prompt=(
              "Jsi přísný jazykový editor současné standardní češtiny na úrovni rodilého mluvčího. "
              "Posuď každý fragment samostatně. Kontroluj přirozenost, gramatiku, shodu, syntaxi, pravopis a zda text "
              "není nechtěně slovensky, polsky, rusky, anglicky nebo jazykově smíšený. "
              "V tomto projektu jsou výrazy ‘den činnosti’, ‘dotazovaný den’, ‘řízek’ a myšlenka, že se měsíce mohou proplétat, "
              "záměrné kanonické doménové termíny/konstrukce; neodmítej je jen proto, že jsou neobvyklé. "
              "První řádek musí být přesně ‘VERDIKT: PŘIROZENÉ’ nebo ‘VERDIKT: OPRAVIT’. "
              "Ve druhém řádku stručně zdůvodni česky."
          )
          results=[]
          for case_id,fragment,expected in cases:
              payload={
                  "messages":[{"role":"user","content":prompt+"\n\nFragment: "+json.dumps(fragment,ensure_ascii=False)}],
                  "temperature":0.0,"max_tokens":120,"reasoning_effort":"none",
                  "chat_template_kwargs":{"enable_thinking":False},"stream":False,
              }
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=900) as resp:
                  data=json.load(resp)
              answer=data["choices"][0]["message"]["content"].strip()
              first=answer.splitlines()[0].strip() if answer else ""
              actual="PŘIROZENÉ" if first=="VERDIKT: PŘIROZENÉ" else "OPRAVIT" if first=="VERDIKT: OPRAVIT" else "NEPLATNÉ"
              passed=actual==expected
              results.append({"id":case_id,"fragment":fragment,"expected":expected,"actual":actual,"passed":passed,"answer":answer})
              print(case_id,results[-1])
          Path("/tmp/cs-gemma/qualification.json").write_text(
              json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          failed=[r["id"] for r in results if not r["passed"]]
          if failed:
              raise SystemExit("Czech reviewer qualification failed: "+", ".join(failed))
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: czech-gemma4-reviewer-qualification
          path: |
            /tmp/cs-gemma/qualification.json
            /tmp/cs-gemma/server.log
          if-no-files-found: warn
          retention-days: 30
