name: Ukrainian Gemma4 reviewer qualification

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-uk-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/uk-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/uk-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/uk-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uk-gemma/llama.tar.gz -C /tmp/uk-gemma/llama
      - name: Qualify Ukrainian reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/uk-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' -c 4096 -t 4 --host 127.0.0.1 --port 8080 > /tmp/uk-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"Цю дату не вдалося розпізнати. Перевірте, чи заповнені всі поля і чи існує дата у вибраному календарі.","expected":"ПРИРОДНО"},{"id":"g2","text":"День дії — вихідна точка обчислення.","expected":"ПРИРОДНО"},{"id":"g3","text":"Попередня котлета","expected":"ПРИРОДНО"},{"id":"g4","text":"Як користуватися цим сайтом?","expected":"ПРИРОДНО"},{"id":"b1","text":"Click here, щоб продовжити.","expected":"ВИПРАВИТИ"},{"id":"b2","text":"Change the working day.","expected":"ВИПРАВИТИ"},{"id":"b3","text":"Измените день дії.","expected":"ВИПРАВИТИ"},{"id":"b4","text":"Zmień день дії.","expected":"ВИПРАВИТИ"}]
          ids=[x["id"] for x in cases]
          prompt="Ви суворий редактор-носій сучасної стандартної української мови. Оцініть кожен із восьми уривків окремо. Перевірте природність, граматику та ненавмисні англійські, російські, польські або змішані мовні залишки. «день дії», «запитуваний день», «котлета» та переплетені місяці є навмисними термінами домену. Return only JSON; verdict must be exactly ПРИРОДНО or ВИПРАВИТИ."+"\n\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["ПРИРОДНО","ВИПРАВИТИ"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"uk_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/uk-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/uk-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-gemma4-reviewer-qualification
          path: |
            /tmp/uk-gemma/qualification.json
            /tmp/uk-gemma/qualification-raw.json
            /tmp/uk-gemma/server.log
          retention-days: 30
