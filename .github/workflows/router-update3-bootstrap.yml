      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Supply-chain preflight
        run: npm run security:supply-chain

      - name: Install locked dependencies
        run: npm ci

      - name: Documentation and i18n checks
        run: |
          npm run docs:check
          npm run check:reverse-i18n
          npm run check:i18n

      - name: Install Chromium and Firefox
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox

      - name: Build and verify standalone artifacts
        run: |
          npm run build:standalone
          node scripts/build-standalone.mjs --verify

      - name: Fast test suite
        run: npm run test:fast

      - name: Compatibility suite
        run: npm run test:compatibility

      - name: Deep suite
        run: npm run test:deep

      - name: Node memory smoke
        run: npm run test:memory:node

      - name: Browser and Worker standalone smoke
        run: npm run test:file-protocol

      - name: Package API verification
        run: npm run package:verify

      - name: Remove bootstrap workflow, transient artifacts, and stage final tracked file set
        run: |
          rm -- .github/workflows/router-update3-bootstrap.yml
          rm -rf -- artifacts
          git add -- \
            browser/pastafari-calendar-router-core.js \
            browser/README.md \
            browser/standalone/pastafari-date.js \
            browser/standalone/pastafari-date.min.js \
            benchmarks/memory-scenario.mjs \
            docs/MEMORY-TESTING.md \
            package.json \
            test/router-cache-lifecycle.test.js \
            test/router-memory-bounds.test.js
          git add -u -- .github/workflows/router-update3-bootstrap.yml

      - name: Generate and verify final checksum manifests
        run: |
          npm run checksums:generate
          npm run checksums:verify
          node scripts/check-sha-manifest-completeness.mjs
          git add -- docs/SHA256SUMS.txt SHA256SUMS.txt

      - name: Verify final tree changed only in Update 3 scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/router-update3-bootstrap\.yml|browser/pastafari-calendar-router-core\.js|browser/README\.md|browser/standalone/pastafari-date\.js|browser/standalone/pastafari-date\.min\.js|benchmarks/memory-scenario\.mjs|docs/MEMORY-TESTING\.md|docs/SHA256SUMS\.txt|package\.json|test/router-cache-lifecycle\.test\.js|test/router-memory-bounds\.test\.js|SHA256SUMS\.txt)$'
          unexpected="$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected files were modified during finalization:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Create final delta ZIP and report
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir='artifacts/router-update3-final'
          staging="$artifact_dir/staging"
          rm -rf "$artifact_dir"
          mkdir -p "$staging"

          files=(
            browser/pastafari-calendar-router-core.js
            browser/README.md
            browser/standalone/pastafari-date.js
            browser/standalone/pastafari-date.min.js
            benchmarks/memory-scenario.mjs
            docs/MEMORY-TESTING.md
            docs/SHA256SUMS.txt
            package.json
            test/router-cache-lifecycle.test.js
            test/router-memory-bounds.test.js
            SHA256SUMS.txt
          )

          for file in "${files[@]}"; do
            mkdir -p "$staging/$(dirname "$file")"
            cp -- "$file" "$staging/$file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('artifacts/router-update3-final/staging')
          target = Path('artifacts/router-update3-final/router-update3-delta-FINAL.zip')
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  zf.write(path, path.relative_to(root).as_posix())
          PY

          sha256sum "$artifact_dir/router-update3-delta-FINAL.zip" > "$artifact_dir/router-update3-delta-FINAL.zip.sha256"
          {
            echo 'Router Update 3 finalization'
            echo "bootstrap_commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "final_delta_sha256=$(cut -d' ' -f1 "$artifact_dir/router-update3-delta-FINAL.zip.sha256")"
            echo "standalone_js_sha256=$(sha256sum browser/standalone/pastafari-date.js | cut -d' ' -f1)"
            echo "standalone_min_js_sha256=$(sha256sum browser/standalone/pastafari-date.min.js | cut -d' ' -f1)"
          } > "$artifact_dir/finalization-report.txt"

      - name: Upload validated final delta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-update3-final-${{ github.sha }}
          path: |
            artifacts/router-update3-final/router-update3-delta-FINAL.zip
            artifacts/router-update3-final/router-update3-delta-FINAL.zip.sha256
            artifacts/router-update3-final/finalization-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit complete Update 3 back to this branch
        id: commit_back
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            browser/pastafari-calendar-router-core.js \
            browser/README.md \
            browser/standalone/pastafari-date.js \
            browser/standalone/pastafari-date.min.js \
            benchmarks/memory-scenario.mjs \
            docs/MEMORY-TESTING.md \
            docs/SHA256SUMS.txt \
            package.json \
            test/router-cache-lifecycle.test.js \
            test/router-memory-bounds.test.js \
            SHA256SUMS.txt
          git commit -m 'Bound router calculation-day state cache'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report branch finalization status
        shell: bash
        run: |
          if [[ '${{ steps.commit_back.outcome }}' == 'success' ]]; then
            echo 'Update 3 was committed back to this branch; the bootstrap workflow removed itself.'
          else
            echo 'Automatic push was not permitted. The validated final delta remains available in this run as an artifact.'
          fi
