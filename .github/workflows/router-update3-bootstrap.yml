name: Router Update 3 Bootstrap

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: router-update3-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    name: apply, build, verify, and finalize router update 3
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify safe bootstrap base
        shell: bash
        run: |
          set -euo pipefail
          expected_base='be2a145bbe22c586771e94d7f1b9f4064ca44a3e'
          if ! git merge-base --is-ancestor "$expected_base" HEAD; then
            echo "Refusing to apply Update 3: expected base $expected_base is not an ancestor of HEAD." >&2
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only "$expected_base" HEAD)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != '.github/workflows/router-update3-bootstrap.yml' ]]; then
            echo 'Refusing to apply Update 3: since the expected base, the branch contains changes other than this workflow.' >&2
            printf 'Changed: %s\n' "${changed[@]}" >&2
            exit 1
          fi
          echo "Safe bootstrap base verified; bootstrap-only commits since $expected_base: $(git rev-list --count "$expected_base"..HEAD)"

      - name: Apply Router Update 3 source delta
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/router-update3.patch <<'PASTAFARI_ROUTER_UPDATE3_PATCH'
          diff --git a/benchmarks/memory-scenario.mjs b/benchmarks/memory-scenario.mjs
