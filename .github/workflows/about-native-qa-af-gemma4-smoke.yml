name: Afrikaans Gemma4 reviewer qualification

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-af-gemma4-smoke.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/af-gemma/llama
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/af-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/af-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/af-gemma/llama.tar.gz -C /tmp/af-gemma/llama

      - name: Qualify Afrikaans reviewer on hidden controls
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/af-gemma/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 \
            --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' \
            -c 4096 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/af-gemma/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 240); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases = [
              ("g1", "Kies ’n datum en probeer weer.", "NATUURLIK"),
              ("g2", "Die volgende dag van die maand is nie noodwendig môre nie.", "NATUURLIK"),
              ("g3", "Die aksiedag is die uitgangspunt van die berekening.", "NATUURLIK"),
              ("g4", "Die kalender gebruik verweefde maande wat nie chronologies aaneenlopend hoef te wees nie.", "NATUURLIK"),
              ("b1", "Ga naar datum soek.", "REGSTEL"),
              ("b2", "Die jaar het verskeie Koteletten.", "REGSTEL"),
              ("b3", "Hierdie datum is geldige.", "REGSTEL"),
              ("b4", "Deze site gebruiken.", "REGSTEL"),
          ]
          prompt=(
              "Jy is ’n streng moedertaal-Afrikaanse taalresensent. Beoordeel slegs die gegewe teksfragment. "
              "Kontroleer natuurlike moderne Afrikaans, grammatika, kongruensie, sintaksis, idiomatiese formulering "
              "en of die teks werklik Afrikaans is eerder as Nederlands of ’n mengsel. "
              "Die projek gebruik domeinterme soos ‘aksiedag’, ‘gevraagde dag’, ‘kotelet’ en ‘verweefde maande’; "
              "moenie ’n grammatiese sin bloot weens dié terme afkeur nie. "
              "Die eerste reël moet presies ‘OORDEEL: NATUURLIK’ of ‘OORDEEL: REGSTEL’ wees. "
              "Gee op die tweede reël een kort rede in Afrikaans."
          )
          results=[]
          for case_id,fragment,expected in cases:
              payload={
                  "messages":[{"role":"user","content":prompt+"\n\nFRAGMENT: "+json.dumps(fragment,ensure_ascii=False)}],
                  "temperature":0.0,"max_tokens":120,"reasoning_effort":"none",
                  "chat_template_kwargs":{"enable_thinking":False},"stream":False,
              }
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=900) as resp:
                  data=json.load(resp)
              answer=data["choices"][0]["message"]["content"].strip()
              first=answer.splitlines()[0].strip() if answer else ""
              actual="NATUURLIK" if first=="OORDEEL: NATUURLIK" else "REGSTEL" if first=="OORDEEL: REGSTEL" else "ONGELDIG"
              passed=actual==expected
              results.append({"id":case_id,"fragment":fragment,"expected":expected,"actual":actual,"passed":passed,"answer":answer})
              print(case_id,results[-1])
          Path("/tmp/af-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          failed=[r["id"] for r in results if not r["passed"]]
          if failed:
              raise SystemExit("Afrikaans reviewer qualification failed: "+", ".join(failed))
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afrikaans-gemma4-reviewer-qualification
          path: |
            /tmp/af-gemma/qualification.json
            /tmp/af-gemma/server.log
          if-no-files-found: warn
          retention-days: 30
