name: Serbian confirmed-residue repair

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-sr-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sr-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/sr-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/sr-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sr-gemma/llama.tar.gz -C /tmp/sr-gemma/llama
      - name: Qualify Serbian reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/sr-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' -c 16384 -t 4 --host 127.0.0.1 --port 8080 > /tmp/sr-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"Taj datum nije moguće prepoznati. Proverite da li su sva polja popunjena i da li datum postoji u izabranom kalendaru.","expected":"OK"},{"id":"g2","text":"Dan radnje je polazna tačka izračunavanja.","expected":"OK"},{"id":"g3","text":"Prethodni kotlet","expected":"OK"},{"id":"g4","text":"Kako se koristi ova stranica?","expected":"OK"},{"id":"b1","text":"Click here i nastavite.","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"Promijeni dan djelovanja.","expected":"FIX"},{"id":"b4","text":"Ovo je polazišna točka izračuna.","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="Vi ste strogi maternji urednik savremenog standardnog srpskog jezika na latinici. Ocenite svaki od sledećih osam odlomaka zasebno. Proverite prirodnost, gramatiku i nenamerne ostatke engleskog, hrvatskog, bosanskog ili mešanog jezika. Izrazi „dan radnje“, „upitani dan“, „kotlet“ i međusobno isprepleteni meseci namerno su korišćeni domenski termini. Return only JSON; verdict must be exactly OK or FIX."+"\\n\\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"sr_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/sr-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/sr-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          repair_cases=[{"id":"r1","location":"docs/about/content/sr.html#anniversaries","text":"Za (ime kotleta, dan u kotletu) medijana je bila 3 godine; 88.89% pronađeno je u roku od 10 godina, ali distribution ima veoma težak težak rep, a posmatrani maksimum dostigao je 51,954 pastafarijanske godine.","markers":["distribution"]},{"id":"r2","location":"docs/about/content/sr.html#anniversaries","text":"To su empirijski rezultati proveravanog korpus; ne dokazuju da će se svaka moguća godišnjica nužno vratiti i ne daju guarantee za maksimalno vreme čekanja.","markers":["guarantee"]},{"id":"r3","location":"docs/about/content/sr.html#short-and-wide-choice","text":"Za veoma velike space koristi se Wide Choice. Ne treba mu pripisivati osobine koje specifikacija ne garantuje.","markers":["space"]},{"id":"r4","location":"docs/about/content/sr.html#short-and-wide-choice","text":"Wide Choice nije isto što i generisanje nezavisnih, ravnomerno raspoređenih base-Q cifara sve dok se ne dobije index. Zato ne sledi da svaki valid choice nužno ima istu pozitivnu verovatnoću. U dovoljno velikim space mogu postojati valid choice do kojih ovaj mechanism nikada ne stiže.","markers":["space","valid choice","mechanism"]},{"id":"r5","location":"docs/about/content/sr.html#sauce-history","text":"Sos izgleda kao veoma agresivan mixing mechanism, ali algebarsko istraživanje pokazuje da čuva znatno više informacija nego što izgled sugeriše. To je rezultat istraživanja izveden iz specifikacija, a ne novo pravilo kalendara.","markers":["mechanism","mixing mechanism"]},{"id":"r6","location":"docs/about/content/sr.html#travel-and-all-day","text":"Zato slepi export pastafarijanskog događaja kao građanskog „celodnevnog“ događaja može promeniti njegovo značenje. Za precizno očuvanje treba sačuvati chronological anchor i odgovarajući kontekst lokacije/granice dana, a ne samo all-day flag.","markers":["chronological anchor","flag"]}]
          repair_ids=[x["id"] for x in repair_cases]
          repair_prompt="Ovi odlomci sadrže potvrđene ostatke stranog jezika u srpskoj prozi. Prepišite svaki ceo tekst u prirodnom savremenom standardnom srpskom na latinici. Sačuvajte sve značenje, brojeve, termine Pastafari, matematičke oznake i stvarne literale kao što su Choice, Wide Choice, Short Choice, all-day, API/HTTP/CLI/OpenAPI/SIMD/SLA. Uklonite potvrđene markere i ispravite gramatiku koliko je potrebno da ceo odlomak bude prirodan. Ne skraćujte i ne gubite informacije. Vratite samo JSON."+"\\n\\n"+json.dumps(repair_cases,ensure_ascii=False)
          repair_schema={"type":"object","properties":{"repairs":{"type":"array","minItems":6,"maxItems":6,"items":{"type":"object","properties":{"id":{"type":"string","enum":repair_ids},"replacement":{"type":"string","minLength":1,"maxLength":1800}},"required":["id","replacement"],"additionalProperties":False}}},"required":["repairs"],"additionalProperties":False}
          repair_payload={"messages":[{"role":"user","content":repair_prompt}],"temperature":0.15,"top_p":0.9,"max_tokens":4200,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"sr_confirmed_residue_repair","strict":True,"schema":repair_schema}}}
          repair_req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(repair_payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(repair_req,timeout=2400) as resp: repair_data=json.load(resp)
          repair_raw=repair_data["choices"][0]["message"]["content"].strip()
          Path("/tmp/sr-gemma/repair-raw.json").write_text(repair_raw+"\\n",encoding="utf-8")
          repairs=json.loads(repair_raw).get("repairs",[])
          by_id={r.get("id"):r for r in repairs}; output=[]; bad=[]
          for x in repair_cases:
            r=by_id.get(x["id"],{}); repl=str(r.get("replacement","")).strip()
            ok=bool(repl) and repl!=x["text"] and not any(m.casefold() in repl.casefold() for m in x["markers"])
            if "{index}" in x["text"] and "{index}" not in repl: ok=False
            output.append({**x,"replacement":repl,"passed":ok})
            if not ok: bad.append(x["id"])
          Path("/tmp/sr-gemma/repair.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          if len(repairs)!=len(repair_cases) or len(by_id)!=len(repair_cases) or bad: raise SystemExit("repair validation failed: "+",".join(bad))
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sr-confirmed-residue-repair
          path: |
            /tmp/sr-gemma/qualification.json
            /tmp/sr-gemma/qualification-raw.json
            /tmp/sr-gemma/repair.json
            /tmp/sr-gemma/repair-raw.json
            /tmp/sr-gemma/server.log
          retention-days: 30
