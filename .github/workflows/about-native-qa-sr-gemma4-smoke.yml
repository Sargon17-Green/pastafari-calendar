# repair workflow trigger v1
name: Serbian phrase-only residue repair

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-sr-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sr-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/sr-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/sr-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sr-gemma/llama.tar.gz -C /tmp/sr-gemma/llama
      - name: Qualify Serbian reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/sr-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-3-12b-it-GGUF:Q4_K_M -c 32768 -t 4 --host 127.0.0.1 --port 8080 > /tmp/sr-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 900); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"Taj datum nije moguće prepoznati. Proverite da li su sva polja popunjena i da li datum postoji u izabranom kalendaru.","expected":"OK"},{"id":"g2","text":"Dan radnje je polazna tačka izračunavanja.","expected":"OK"},{"id":"g3","text":"Prethodni kotlet","expected":"OK"},{"id":"g4","text":"Kako se koristi ova stranica?","expected":"OK"},{"id":"b1","text":"Click here i nastavite.","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"Promijeni dan djelovanja.","expected":"FIX"},{"id":"b4","text":"Ovo je polazišna točka izračuna.","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="Vi ste strogi maternji urednik savremenog standardnog srpskog jezika na latinici. Ocenite svaki od sledećih osam odlomaka zasebno. Proverite prirodnost, gramatiku i nenamerne ostatke engleskog, hrvatskog, bosanskog ili mešanog jezika. Izrazi „dan radnje“, „upitani dan“, „kotlet“ i međusobno isprepleteni meseci namerno su korišćeni domenski termini. Return only JSON; verdict must be exactly OK or FIX."+"\\n\\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"sr_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/sr-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/sr-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          phrase_cases=[{"id":"p1","source_phrase":"guarantee","context":"ne dokazuju ... i ne daju guarantee za maksimalno vreme čekanja","meaning":"a guarantee; accusative singular after 'ne daju'","forbidden":["guarantee"]},{"id":"p2","source_phrase":"valid choice","context":"Zato ne sledi da svaki valid choice nužno ima istu pozitivnu verovatnoću.","meaning":"a valid/legal choice; nominative singular after 'svaki'","forbidden":["valid choice"]},{"id":"p3","source_phrase":"valid choice","context":"U dovoljno velikim space mogu postojati valid choice do kojih ovaj mechanism nikada ne stiže.","meaning":"valid/legal choices; nominative plural after 'mogu postojati'","forbidden":["valid choice"]},{"id":"p4","source_phrase":"space","context":"U dovoljno velikim space mogu postojati ...","meaning":"spaces; locative plural after 'u dovoljno velikim'","forbidden":["space"]},{"id":"p5","source_phrase":"mechanism","context":"... do kojih ovaj mechanism nikada ne stiže.","meaning":"mechanism; nominative singular after 'ovaj'","forbidden":["mechanism"]},{"id":"p6","source_phrase":"chronological anchor","context":"treba sačuvati chronological anchor i odgovarajući kontekst lokacije/granice dana","meaning":"chronological anchor; stable chronological reference/anchor, accusative object of 'sačuvati'","forbidden":["chronological anchor"]},{"id":"p7","source_phrase":"flag","context":"a ne samo all-day flag","meaning":"flag/indicator/checkbox; return only a Serbian noun in the form that can directly follow the unchanged literal 'all-day'","forbidden":["flag"]}]
          phrase_ids=[x["id"] for x in phrase_cases]
          phrase_prompt="Vi ste strogi maternji urednik savremenog standardnog srpskog na latinici. Svaki slučaj sadrži SAMO stranu frazu koju treba zameniti unutar već postojećeg srpskog konteksta. Vratite isključivo kratku srpsku zamensku frazu koja gramatički tačno odgovara datom mestu i precizno čuva navedeno englesko značenje. Ne prepisujte celu rečenicu, ne objašnjavajte i ne dodajte zagrade. Literali Choice, Wide Choice, Short Choice i all-day ostaju kada nisu deo source_phrase."+"\\n\\n"+json.dumps(phrase_cases,ensure_ascii=False)
          phrase_schema={"type":"object","properties":{"repairs":{"type":"array","minItems":7,"maxItems":7,"items":{"type":"object","properties":{"id":{"type":"string","enum":phrase_ids},"replacement":{"type":"string","minLength":1,"maxLength":160}},"required":["id","replacement"],"additionalProperties":False}}},"required":["repairs"],"additionalProperties":False}
          phrase_payload={"messages":[{"role":"user","content":phrase_prompt}],"temperature":0.0,"max_tokens":1200,"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"sr_phrase_residue_repair","strict":True,"schema":phrase_schema}}}
          phrase_req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(phrase_payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(phrase_req,timeout=2400) as resp: phrase_data=json.load(resp)
          phrase_raw=phrase_data["choices"][0]["message"]["content"].strip()
          Path("/tmp/sr-gemma/repair-raw.json").write_text(phrase_raw+"\n",encoding="utf-8")
          repairs=json.loads(phrase_raw).get("repairs",[])
          by_id={r.get("id"):r for r in repairs}; output=[]; bad=[]
          for x in phrase_cases:
            r=by_id.get(x["id"],{}); repl=str(r.get("replacement","")).strip()
            ok=bool(repl) and repl.casefold()!=x["source_phrase"].casefold() and "\n" not in repl and len(repl)<=160
            if any(term.casefold() in repl.casefold() for term in x["forbidden"]): ok=False
            output.append({**x,"replacement":repl,"passed":ok})
            if not ok: bad.append(x["id"])
          Path("/tmp/sr-gemma/repair.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(repairs)!=len(phrase_cases) or len(by_id)!=len(phrase_cases) or bad: raise SystemExit("phrase repair validation failed: "+",".join(bad))
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sr-confirmed-residue-repair
          path: |
            /tmp/sr-gemma/qualification.json
            /tmp/sr-gemma/qualification-raw.json
            /tmp/sr-gemma/repair.json
            /tmp/sr-gemma/repair-raw.json
            /tmp/sr-gemma/server.log
          retention-days: 30
