name: Hungarian Gemma4 reviewer qualification

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-hu-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hu-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/hu-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/hu-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hu-gemma/llama.tar.gz -C /tmp/hu-gemma/llama
      - name: Qualify Hungarian reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/hu-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' -c 4096 -t 4 --host 127.0.0.1 --port 8080 > /tmp/hu-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"Válasszon egy dátumot, és próbálja újra.","expected":"TERMÉSZETES"},{"id":"g2","text":"A műveleti nap a számítás kiindulópontja.","expected":"TERMÉSZETES"},{"id":"g3","text":"Előző szelet","expected":"TERMÉSZETES"},{"id":"g4","text":"A hónapok az év során összefonódhatnak egymással.","expected":"TERMÉSZETES"},{"id":"b1","text":"Click here a folytatáshoz.","expected":"JAVÍTANDÓ"},{"id":"b2","text":"Change the working day.","expected":"JAVÍTANDÓ"},{"id":"b3","text":"Promenite radni dan.","expected":"JAVÍTANDÓ"},{"id":"b4","text":"Как használjam ezt az oldalt?","expected":"JAVÍTANDÓ"}]
          ids=[x["id"] for x in cases]
          prompt="Ön a mai standard magyar nyelv szigorú anyanyelvi szerkesztője. A nyolc részletet külön-külön értékelje. Ellenőrizze a természetességet, a nyelvtant, valamint az angol, szerb, orosz vagy kevert nyelvi maradványokat. A „műveleti nap”, „lekérdezett nap”, „szelet” és az összefonódó hónapok szándékos szakterminusok. Return only JSON; verdict must be exactly TERMÉSZETES or JAVÍTANDÓ."+"\n\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["TERMÉSZETES","JAVÍTANDÓ"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"hu_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/hu-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/hu-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hu-gemma4-reviewer-qualification
          path: |
            /tmp/hu-gemma/qualification.json
            /tmp/hu-gemma/qualification-raw.json
            /tmp/hu-gemma/server.log
          retention-days: 30
