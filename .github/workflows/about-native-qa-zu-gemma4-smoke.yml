# repair workflow trigger v1
name: Zulu confirmed-residue repair

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-zu-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zu-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/zu-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/zu-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zu-gemma/llama.tar.gz -C /tmp/zu-gemma/llama
      - name: Qualify Zulu reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/zu-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-3-12b-it-GGUF:Q4_K_M -c 16384 -t 4 --host 127.0.0.1 --port 8080 > /tmp/zu-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 900); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"Lolo suku alukwazanga ukubonwa. Hlola ukuthi zonke izinkambu zigcwele nokuthi usuku lukhona ekhalendeni elikhethiwe.","expected":"OK"},{"id":"g2","text":"Usuku lokusebenza luyisiqalo sokubala.","expected":"OK"},{"id":"g3","text":"Buyela namuhla","expected":"OK"},{"id":"g4","text":"Isetshenziswa kanjani le sayithi?","expected":"OK"},{"id":"b1","text":"Click here bese uqhubeka.","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"Nceda ukhethe lo mhla.","expected":"FIX"},{"id":"b4","text":"Verander die werkdag.","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="Ungumhleli oqinile wolimi lwesiZulu olujwayelekile lwanamuhla. Hlola izingcezu eziyisishiyagalombili ezilandelayo ngayinye ngokwehlukana. Bheka ubunjalo bolimi, uhlelo lolimi, kanye nezinsalela ezingahlosiwe zesiNgisi, isiXhosa, isiBhunu noma ulimi oluxubile. Amagama athi “usuku lokusebenza”, “usuku olubuzwayo”, “ikhothlethi” kanye nezinyanga ezilukene ayimigomo yesizinda esetshenziswa ngenhloso. Return only JSON; verdict must be exactly OK or FIX."+"\\n\\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"zu_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/zu-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/zu-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          repair_cases=[{"id":"r1","location":"docs/about/content/zu.html#short-and-wide-choice","text":"Ikhalenda uqobo lihlala lideterministiki ngokuphelele. “Choice” igama lesigaba se-algorithm, akusikho ukubheja okwenziwa ngesikhathi sokusebenzisa.","markers":["algorithm"]},{"id":"r2","location":"docs/about/content/zu.html#anniversaries","text":"Ku-(igama lekhothlethi, usuku ekhothlethini), imidiyeni yayiyiminyaka 3; 88.89% yatholakala phakathi kweminyaka 10, kodwa ukusabalala kune-heavy tail enzima kakhulu, futhi inani elikhulu elabonwa lafika eminyakeni 51,954 ye-Pastafari.","markers":["heavy tail"]},{"id":"r3","location":"docs/about/content/zu.html#structural-atlas","text":"Lezi zinombolo zichaza leyo corpus, hhayi imithetho yekanonikhi.","markers":["corpus"]},{"id":"r4","location":"docs/about/content/zu.html#anniversaries","text":"Lena imiphumela yokuhlola ye-corpus eyahlolwa, hhayi ubufakazi bokuthi zonke izikhumbuzo ezingaba khona nakanjani ziyobuya, futhi akusona isiqinisekiso sesikhathi sokulinda esiphezulu.","markers":["corpus"]}]
          repair_ids=[x["id"] for x in repair_cases]
          repair_prompt="Umbhalo ngamunye ongezansi unezinsalela zesiNgisi eziqinisekisiwe ezisemkhakheni markers. Shintsha KUPHELA lezo zingxenye zibe isiZulu semvelo esilingana nencazelo. Gcina wonke amanye amagama, izinombolo, amagama e-Pastafari, ‘Choice’, nomqondo wokuqala njengoba unjalo; yenza kuphela ushintsho oluncane lohlelo lolimi oludingekayo ukuze ukufakwa okusha kulunge. Ungangezi isiNgisi njengencazelo noma phakathi kwabakhonkwane. Buyisa i-JSON kuphela."+"\\n\\n"+json.dumps(repair_cases,ensure_ascii=False)
          repair_schema={"type":"object","properties":{"repairs":{"type":"array","minItems":4,"maxItems":4,"items":{"type":"object","properties":{"id":{"type":"string","enum":repair_ids},"replacement":{"type":"string","minLength":1,"maxLength":1600}},"required":["id","replacement"],"additionalProperties":False}}},"required":["repairs"],"additionalProperties":False}
          repair_payload={"messages":[{"role":"user","content":repair_prompt}],"temperature":0.15,"top_p":0.9,"max_tokens":3500,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"zu_confirmed_residue_repair","strict":True,"schema":repair_schema}}}
          repair_req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(repair_payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(repair_req,timeout=2400) as resp: repair_data=json.load(resp)
          repair_raw=repair_data["choices"][0]["message"]["content"].strip()
          Path("/tmp/zu-gemma/repair-raw.json").write_text(repair_raw+"\\n",encoding="utf-8")
          repairs=json.loads(repair_raw).get("repairs",[])
          by_id={r.get("id"):r for r in repairs}; output=[]; bad=[]
          for x in repair_cases:
            r=by_id.get(x["id"],{}); repl=str(r.get("replacement","")).strip()
            ok=bool(repl) and repl!=x["text"] and not any(m.casefold() in repl.casefold() for m in x["markers"])
            if "{index}" in x["text"] and "{index}" not in repl: ok=False
            output.append({**x,"replacement":repl,"passed":ok})
            if not ok: bad.append(x["id"])
          Path("/tmp/zu-gemma/repair.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          if len(repairs)!=len(repair_cases) or len(by_id)!=len(repair_cases) or bad: raise SystemExit("repair validation failed: "+",".join(bad))
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zu-confirmed-residue-repair
          path: |
            /tmp/zu-gemma/qualification.json
            /tmp/zu-gemma/qualification-raw.json
            /tmp/zu-gemma/repair.json
            /tmp/zu-gemma/repair-raw.json
            /tmp/zu-gemma/server.log
          retention-days: 30
