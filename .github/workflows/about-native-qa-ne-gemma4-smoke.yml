name: Nepali Gemma4 reviewer qualification

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-ne-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ne-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/ne-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/ne-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ne-gemma/llama.tar.gz -C /tmp/ne-gemma/llama
      - name: Qualify Nepali reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/ne-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' -c 4096 -t 4 --host 127.0.0.1 --port 8080 > /tmp/ne-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"यो मिति चिन्न सकिएन। सबै फिल्ड पूरा छन् र छानिएको पात्रोमा मिति अस्तित्वमा छ कि छैन जाँच्नुहोस्।","expected":"OK"},{"id":"g2","text":"कार्य-दिन गणनाको प्रारम्भ बिन्दु हो।","expected":"OK"},{"id":"g3","text":"अघिल्लो कटलेट","expected":"OK"},{"id":"g4","text":"यो साइट कसरी प्रयोग गर्ने?","expected":"OK"},{"id":"b1","text":"Click here गरेर अगाडि बढ्नुहोस्।","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"यह तारीख छान्नुहोस्।","expected":"FIX"},{"id":"b4","text":"Как यो साइट प्रयोग गर्ने?","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="तपाईं आधुनिक मानक नेपालीका कडा मातृभाषी सम्पादक हुनुहुन्छ। तलका आठ अंशमध्ये प्रत्येकलाई छुट्टाछुट्टै मूल्याङ्कन गर्नुहोस्। स्वाभाविकता, व्याकरण र अनिच्छित अंग्रेजी, हिन्दी, रूसी वा मिश्रित भाषाका अवशेष जाँच्नुहोस्। «कार्य-दिन», «सोधिएको दिन», «कटलेट» र आपसमा गाँसिएका महिनाहरू जानाजानी प्रयोग गरिएका क्षेत्रगत शब्द हुन्। Faqat JSON qaytaring / Return only JSON; verdict must be exactly OK or FIX."+"\n\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"ne_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/ne-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/ne-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ne-gemma4-reviewer-qualification
          path: |
            /tmp/ne-gemma/qualification.json
            /tmp/ne-gemma/qualification-raw.json
            /tmp/ne-gemma/server.log
          retention-days: 30
