# repair workflow trigger v1
name: Somali phrase-only residue repair

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-so-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/so-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/so-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/so-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/so-gemma/llama.tar.gz -C /tmp/so-gemma/llama
      - name: Qualify Somali reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/so-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-3-12b-it-GGUF:Q4_K_M -c 32768 -t 4 --host 127.0.0.1 --port 8080 > /tmp/so-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 900); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"Taariikhdaas lama aqoonsan karin. Hubi in dhammaan meelaha la buuxiyey oo taariikhdu ka jirto kalandarka la doortay.","expected":"OK"},{"id":"g2","text":"Maalinta hawshu waa barta bilowga xisaabinta.","expected":"OK"},{"id":"g3","text":"Kotlet-kii hore","expected":"OK"},{"id":"g4","text":"Sidee loo isticmaalaa boggan?","expected":"OK"},{"id":"b1","text":"Click here oo sii wad.","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"Tafadhali chagua tarehe hii.","expected":"FIX"},{"id":"b4","text":"كيفية استخدام هذا الموقع؟","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="Waxaad tahay tifaftire adag oo af-Soomaali casri ah oo heer ah. Mid kasta oo ka mid ah siddeedda qaybood ee hoose si gooni ah u qiimee. Hubi dabiicinnimada, naxwaha, iyo hadhaaga aan ula kac ahayn ee Ingiriisiga, Sawaaxiliga, Carabiga ama luqad isku dhafan. Erayada «maalinta hawsha», «maalinta la weydiiyey», «kotlet» iyo bilaha is dhexgala waa erayo domain oo si ula kac ah loo adeegsaday. Return only JSON; verdict must be exactly OK or FIX."+"\\n\\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"so_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/so-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/so-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          phrase_cases=[{"id":"p1","source_phrase":"tallaabo algorithm ah","context":"“Choice” waa magaca tallaabo algorithm ah, ma aha bakhtiyaa-nasiib marka la isticmaalayo.","meaning":"a stage of the algorithm; replace the algorithm concept with the Somali term hab-raac in the grammatically correct form","forbidden":["algorithm"],"must_include_any":["habraac","hab-raac"]}]
          phrase_ids=[x["id"] for x in phrase_cases]
          phrase_prompt="Waxaad tahay tifaftire af-Soomaali ah. Kiiskan source_phrase-ku wuxuu ka dhigan yahay “a stage of the algorithm”. Erayga algorithm halkan ku beddel erayga af-Soomaaliga ah hab-raac (ama qaabkiisa naxwe ahaan saxda ah), adigoo soo celinaya KELIYA weedha gaaban ee si toos ah ugu beddeli karta source_phrase. Waa in macnaha “stage of the algorithm” si buuxda u sii jiraa. Ha dib u qorin jumladda oo dhan, ha sharxin, hana ku darin qawsyo ama Ingiriisi. “Choice” waa literal domain oo bannaanka source_phrase ah."+"\\n\\n"+json.dumps(phrase_cases,ensure_ascii=False)
          phrase_schema={"type":"object","properties":{"repairs":{"type":"array","minItems":1,"maxItems":1,"items":{"type":"object","properties":{"id":{"type":"string","enum":phrase_ids},"replacement":{"type":"string","minLength":1,"maxLength":160}},"required":["id","replacement"],"additionalProperties":False}}},"required":["repairs"],"additionalProperties":False}
          phrase_payload={"messages":[{"role":"user","content":phrase_prompt}],"temperature":0.0,"max_tokens":1200,"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"so_phrase_residue_repair","strict":True,"schema":phrase_schema}}}
          phrase_req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(phrase_payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(phrase_req,timeout=2400) as resp: phrase_data=json.load(resp)
          phrase_raw=phrase_data["choices"][0]["message"]["content"].strip()
          Path("/tmp/so-gemma/repair-raw.json").write_text(phrase_raw+"\n",encoding="utf-8")
          repairs=json.loads(phrase_raw).get("repairs",[])
          by_id={r.get("id"):r for r in repairs}; output=[]; bad=[]
          for x in phrase_cases:
            r=by_id.get(x["id"],{}); repl=str(r.get("replacement","")).strip()
            ok=bool(repl) and repl.casefold()!=x["source_phrase"].casefold() and "\n" not in repl and len(repl)<=160
            if any(term.casefold() in repl.casefold() for term in x["forbidden"]): ok=False
            if x.get("must_include_any") and not any(term.casefold() in repl.casefold() for term in x["must_include_any"]): ok=False
            output.append({**x,"replacement":repl,"passed":ok})
            if not ok: bad.append(x["id"])
          Path("/tmp/so-gemma/repair.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(repairs)!=len(phrase_cases) or len(by_id)!=len(phrase_cases) or bad: raise SystemExit("phrase repair validation failed: "+",".join(bad))
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: so-confirmed-residue-repair
          path: |
            /tmp/so-gemma/qualification.json
            /tmp/so-gemma/qualification-raw.json
            /tmp/so-gemma/repair.json
            /tmp/so-gemma/repair-raw.json
            /tmp/so-gemma/server.log
          retention-days: 30
