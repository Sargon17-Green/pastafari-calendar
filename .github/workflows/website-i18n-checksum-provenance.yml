name: Website i18n checksum provenance (read-only)
on:
  push:
    branches:
      - work/pc-website-i18n-reverse-race-20261027
    paths:
      - .github/workflows/website-i18n-checksum-provenance.yml
permissions:
  contents: read
jobs:
  audit:
    name: Record SHA256 provenance from pinned checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audited immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e539192edcde98e1f8361ae314a11df052a0607e
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Audit without rewriting manifest
        id: provenance
        shell: bash
        run: |
          set -uo pipefail
          audit_exit=0
          node scripts/audit-checksum-drift.mjs > sha256-audit.json || audit_exit=$?
          echo "Auditor exit code (0=match, 1=mismatch, 2=invalid/missing): $audit_exit"
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("sha256-audit.json","utf8"));
            if (r.mode !== "read-only" || r.head !== "e539192edcde98e1f8361ae314a11df052a0607e" ||
                !Array.isArray(r.mismatches) || !Array.isArray(r.missing) ||
                !Array.isArray(r.invalid) || (typeof r.categories !== "object" || r.categories === null || Array.isArray(r.categories))) {
              throw new Error("Unexpected provenance report schema/head");
            }
            console.log(JSON.stringify({head:r.head,checked:r.checked,matched:r.matched,mismatches:r.mismatchCount,missing:r.missingCount,invalid:r.invalidCount,categories:r.categories}));
          '
          validate_exit=$?
          if [ "$validate_exit" -ne 0 ] || [ "$audit_exit" -eq 2 ]; then
            exit 2
          fi
          if [ "$audit_exit" -ne 0 ] && [ "$audit_exit" -ne 1 ]; then
            exit "$audit_exit"
          fi
      - name: Upload read-only provenance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-i18n-sha256-provenance-e539192edcde98e1f8361ae314a11df052a0607e
          path: sha256-audit.json
          if-no-files-found: error
          retention-days: 14
