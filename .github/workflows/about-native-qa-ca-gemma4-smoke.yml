name: Catalan Gemma4 reviewer qualification

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-ca-gemma4-smoke.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ca-gemma/llama
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/ca-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/ca-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ca-gemma/llama.tar.gz -C /tmp/ca-gemma/llama

      - name: Qualify Catalan reviewer on hidden controls
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/ca-gemma/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 \
            --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' \
            -c 4096 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/ca-gemma/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases = [
              ("g1", "Tria una data i torna-ho a provar.", "NATURAL"),
              ("g2", "El dia d'acció és el punt de partida del càlcul.", "NATURAL"),
              ("g3", "Croqueta anterior", "NATURAL"),
              ("g4", "Els mesos es poden entreteixir al llarg de l'any.", "NATURAL"),
              ("b1", "Cambiar el dia de trabajo.", "CORREGEIX"),
              ("b2", "Click here per continuar.", "CORREGEIX"),
              ("b3", "En este any hi ha diversos meses.", "CORREGEIX"),
              ("b4", "Cómo usar este lloc?", "CORREGEIX"),
          ]
          prompt=(
              "Ets un editor lingüístic estricte de català estàndard contemporani, de nivell nadiu. "
              "Avalua cada fragment per separat. Comprova naturalitat, gramàtica, concordança, sintaxi, ortografia "
              "i que el text no sigui accidentalment castellà, anglès o una barreja de llengües. "
              "En aquest projecte, els termes ‘dia d'acció’, ‘dia consultat’, ‘croqueta’ i la idea que els mesos "
              "es poden entreteixir són construccions/termes canònics intencionats; no els rebutgis només perquè "
              "siguin inusuals. La primera línia ha de ser exactament ‘VEREDICTE: NATURAL’ o "
              "‘VEREDICTE: CORREGEIX’. A la segona línia justifica-ho breument en català."
          )
          results=[]
          for case_id,fragment,expected in cases:
              payload={
                  "messages":[{"role":"user","content":prompt+"\n\nFragment: "+json.dumps(fragment,ensure_ascii=False)}],
                  "temperature":0.0,"max_tokens":120,"reasoning_effort":"none",
                  "chat_template_kwargs":{"enable_thinking":False},"stream":False,
              }
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=900) as resp:
                  data=json.load(resp)
              answer=data["choices"][0]["message"]["content"].strip()
              first=answer.splitlines()[0].strip() if answer else ""
              actual="NATURAL" if first=="VEREDICTE: NATURAL" else "CORREGEIX" if first=="VEREDICTE: CORREGEIX" else "INVALID"
              passed=actual==expected
              results.append({"id":case_id,"fragment":fragment,"expected":expected,"actual":actual,"passed":passed,"answer":answer})
              print(case_id,results[-1])
          Path("/tmp/ca-gemma/qualification.json").write_text(
              json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          failed=[r["id"] for r in results if not r["passed"]]
          if failed:
              raise SystemExit("Catalan reviewer qualification failed: "+", ".join(failed))
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalan-gemma4-reviewer-qualification
          path: |
            /tmp/ca-gemma/qualification.json
            /tmp/ca-gemma/server.log
          if-no-files-found: warn
          retention-days: 30
