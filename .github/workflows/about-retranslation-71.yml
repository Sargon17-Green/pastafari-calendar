name: About retranslation 71 locales

on:
  push:
    branches:
      - feature/about-retranslation-71-locales
    paths:
      - artifacts/about-retranslation-2026-10-04/trigger.json

concurrency:
  group: about-retranslation-71
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      codes: ${{ steps.matrix.outputs.codes }}
      count: ${{ steps.matrix.outputs.count }}
      batch: ${{ steps.matrix.outputs.batch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path('artifacts/about-retranslation-2026-10-04/locales.json').read_text(encoding='utf-8'))
          trigger=json.loads(Path('artifacts/about-retranslation-2026-10-04/trigger.json').read_text(encoding='utf-8'))
          all_rows=manifest['locales']; by={x['code']:x for x in all_rows}
          req=trigger.get('locales','ALL')
          if req=='ALL': rows=all_rows
          else:
              if not isinstance(req,list) or not req: raise SystemExit('trigger.locales must be ALL or a non-empty list')
              unknown=[x for x in req if x not in by]
              if unknown: raise SystemExit(f'unknown locales: {unknown}')
              rows=[by[x] for x in req]
          codes=[x['code'] for x in rows]
          out=Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a',encoding='utf-8') as f:
              f.write('matrix='+json.dumps({'include':rows},ensure_ascii=False,separators=(',',':'))+'\n')
              f.write('codes='+json.dumps(codes,separators=(',',':'))+'\n')
              f.write('count='+str(len(rows))+'\n')
              f.write('batch='+str(trigger.get('batch','manual')).replace(' ','_')+'\n')
          print('Locales:', ', '.join(codes))
          PY

  translate-and-review:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install pinned Copilot CLI
        run: |
          npm install -g @github/copilot@1.0.88
          copilot --version
      - name: Validate worker
        run: python -m py_compile scripts/about-retranslation-worker.py
      - name: Translate from Hebrew and run both QA gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/about-retranslation-worker.py \
            --code '${{ matrix.code }}' \
            --tag '${{ matrix.tag }}' \
            --dir '${{ matrix.dir }}' \
            --max-cycles 3
          cat 'artifacts/about-retranslation-2026-10-04/staging/${{ matrix.code }}/status.json'
      - name: Upload locale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retranslation-${{ matrix.code }}
          path: artifacts/about-retranslation-2026-10-04/staging/${{ matrix.code }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, translate-and-review]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      all_pass: ${{ steps.gate.outputs.all_pass }}
      complete71: ${{ steps.gate.outputs.complete71 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/about-retranslation-71-locales
          fetch-depth: 0
      - name: Download this run's locale evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: retranslation-*
          path: /tmp/retranslation
          merge-multiple: false
      - name: Install evidence into staging folder
        shell: bash
        run: |
          shopt -s nullglob
          for d in /tmp/retranslation/retranslation-*; do
            code="${d##*/retranslation-}"
            dest="artifacts/about-retranslation-2026-10-04/staging/$code"
            rm -rf "$dest"
            mkdir -p "$dest"
            cp -a "$d/." "$dest/"
          done
      - id: gate
        name: Compute exact batch gate
        env:
          CODES_JSON: ${{ needs.prepare.outputs.codes }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('artifacts/about-retranslation-2026-10-04/staging')
          codes=json.loads(os.environ['CODES_JSON'])
          rows=[]; ok=True
          for code in codes:
              p=root/code/'status.json'
              if not p.exists():
                  rows.append({'code':code,'final':'MISSING'}); ok=False; continue
              d=json.loads(p.read_text(encoding='utf-8'))
              rows.append(d)
              if d.get('final')!='PASS': ok=False
          summary={'batch':os.environ.get('GITHUB_RUN_ID'),'requested':codes,'count':len(codes),'all_pass':ok,'results':rows}
          Path('artifacts/about-retranslation-2026-10-04/latest-batch.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          complete71=(len(codes)==71 and set(codes)=={x['code'] for x in json.loads(Path('artifacts/about-retranslation-2026-10-04/locales.json').read_text())['locales']})
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:
              f.write('all_pass='+('true' if ok else 'false')+'\n')
              f.write('complete71='+('true' if complete71 else 'false')+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Commit immutable batch evidence to feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/about-retranslation-2026-10-04/staging artifacts/about-retranslation-2026-10-04/latest-batch.json
          if git diff --cached --quiet; then
            echo 'No evidence changes.'
            exit 0
          fi
          git commit -m 'qa(about-i18n): record ${{ needs.prepare.outputs.batch }} retranslation batch'
          git pull --rebase origin feature/about-retranslation-71-locales
          git push origin HEAD:feature/about-retranslation-71-locales
