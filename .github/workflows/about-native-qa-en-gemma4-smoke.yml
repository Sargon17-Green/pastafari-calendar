name: English Gemma4 reviewer qualification

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-en-gemma4-smoke.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/en-gemma/llama
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/en-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/en-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/en-gemma/llama.tar.gz -C /tmp/en-gemma/llama

      - name: Qualify English reviewer on hidden controls
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/en-gemma/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 \
            --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' \
            -c 4096 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/en-gemma/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 240); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases = [
              ("g1", "Select a date and try again.", "NATURAL"),
              ("g2", "The next day in the month is not necessarily tomorrow.", "NATURAL"),
              ("g3", "Changing the day of working changes the displayed representation, not the day itself.", "NATURAL"),
              ("b1", "These date is valid.", "FIX"),
              ("b2", "Select a date and tries again.", "FIX"),
              ("b3", "Este texto está en español.", "FIX"),
          ]
          prompt = (
              "You are a strict native-English language reviewer. Judge only the supplied fragment. "
              "Check natural modern English, grammar, agreement, syntax, idiom, and whether the text is actually English. "
              "Do not object to domain terminology merely because it is unusual. "
              "The first line must be exactly either 'VERDICT: NATURAL' or 'VERDICT: FIX'. "
              "On the second line give one brief English reason."
          )
          results=[]
          for case_id, fragment, expected in cases:
              payload={
                  "messages":[{"role":"user","content":prompt+"\n\nFRAGMENT: "+json.dumps(fragment)}],
                  "temperature":0.0,
                  "max_tokens":120,
                  "reasoning_effort":"none",
                  "chat_template_kwargs":{"enable_thinking":False},
                  "stream":False,
              }
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=900) as resp:
                  data=json.load(resp)
              answer=data["choices"][0]["message"]["content"].strip()
              first=answer.splitlines()[0].strip() if answer else ""
              actual="NATURAL" if first=="VERDICT: NATURAL" else "FIX" if first=="VERDICT: FIX" else "INVALID"
              passed=actual==expected
              results.append({"id":case_id,"fragment":fragment,"expected":expected,"actual":actual,"passed":passed,"answer":answer})
              print(case_id, results[-1])
          Path("/tmp/en-gemma/qualification.json").write_text(json.dumps(results,indent=2)+"\n")
          failed=[r["id"] for r in results if not r["passed"]]
          if failed:
              raise SystemExit("English reviewer qualification failed: "+", ".join(failed))
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: english-gemma4-reviewer-qualification
          path: |
            /tmp/en-gemma/qualification.json
            /tmp/en-gemma/server.log
          if-no-files-found: warn
          retention-days: 30
