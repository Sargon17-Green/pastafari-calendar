name: Website i18n About 60-file structural QA (read-only)

on:
  push:
    branches:
      - audit/website-i18n-sha256-provenance-20261030
    paths:
      - scripts/qa-about-semantic-delta-provenance.mjs
      - docs/about/content/ka.html
      - test/website-about-ka-semantic.test.mjs
      - .github/workflows/website-i18n-about-structural-qa.yml

permissions:
  contents: read

jobs:
  about-structural:
    name: Check 60 About deltas, lineage and idempotent passes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch with complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Execute scoped read-only structural audit
        run: node scripts/qa-about-semantic-delta-provenance.mjs
      - name: Verify Georgian semantic contract independently of structural audit
        if: always()
        run: node --test test/website-about-ka-semantic.test.mjs
      - name: Preserve the per-locale report on failure or success
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-i18n-about-60-structural-qa
          path: artifacts/website-i18n-provenance-audit/about-60-structural-qa.json
          if-no-files-found: warn
          retention-days: 30
