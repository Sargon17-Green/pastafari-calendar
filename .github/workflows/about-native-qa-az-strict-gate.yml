name: Azerbaijani strict native-language whole-site gate

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-az-strict-gate.yml

permissions:
  contents: read

concurrency:
  group: azerbaijani-strict-native-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-az:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/az-strict/llama /tmp/az-strict/evidence
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/az-strict/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/az-strict/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/az-strict/llama.tar.gz -C /tmp/az-strict/llama
          git rev-parse HEAD > /tmp/az-strict/evidence/reviewed-head.txt

      - name: Extract grounded Azerbaijani website corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import html, json, re

          items=[]

          locale=Path("docs/i18n/locales/az.js").read_text(encoding="utf-8")
          for key, raw in re.findall(r'"([^"]+)"\s*:\s*("(?:\\.|[^"\\])*")', locale):
              try:
                  value=json.loads(raw)
              except Exception:
                  continue
              if not isinstance(value,str) or not value.strip():
                  continue
              if key in {"code","dir","intlLocale"}:
                  continue
              items.append({"location":f"docs/i18n/locales/az.js#{key}","text":value.strip()})

          class Parser(HTMLParser):
              wanted={"p","li","h1","h2","h3","h4","h5","h6","th","td","caption","blockquote"}
              attrs_wanted={"aria-label","aria-description","title","alt"}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.sections=[]
                  self.current=None
                  self.attr_counter=0
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=="br" and self.current is not None:
                      self.current["parts"].append(". ")
                  if tag=="section":
                      self.sections.append(attrs.get("id",""))
                  section=next((x for x in reversed(self.sections) if x),"")
                  ident=attrs.get("id") or section or tag
                  for name in self.attrs_wanted:
                      value=attrs.get(name)
                      if value and value.strip():
                          items.append({
                              "location":f"docs/about/content/az.html#{ident}@{name}-{self.attr_counter}",
                              "text":value.strip()
                          })
                          self.attr_counter+=1
                  if tag in self.wanted:
                      self.current={"tag":tag,"id":attrs.get("id",""),"section":section,"parts":[]}
              def handle_endtag(self,tag):
                  if self.current is not None and self.current["tag"]==tag:
                      text=re.sub(r"\s+"," ","".join(self.current["parts"])).strip()
                      if text:
                          ident=self.current["id"] or self.current["section"] or self.current["tag"]
                          items.append({"location":f"docs/about/content/az.html#{ident}","text":text})
                      self.current=None
                  if tag=="section" and self.sections:
                      self.sections.pop()
              def handle_data(self,data):
                  if self.current is not None:
                      self.current["parts"].append(data)

          parser=Parser()
          parser.feed(Path("docs/about/content/az.html").read_text(encoding="utf-8"))

          manifest=json.loads(Path("docs/manifest.webmanifest").read_text(encoding="utf-8"))
          for field in ("name_localized","short_name_localized","description_localized"):
              value=manifest.get(field,{}).get("az",{}).get("value")
              if isinstance(value,str) and value.strip():
                  items.append({"location":f"docs/manifest.webmanifest#{field}.az.value","text":value.strip()})

          registry=Path("docs/i18n/registry.js").read_text(encoding="utf-8")
          m=re.search(r'defineLocale\("az",\s*"([^"]+)"',registry)
          if m:
              items.append({"location":"docs/i18n/registry.js#locale-az-display-name","text":m.group(1)})

          # No static-English bootstrap prose is included: all normal shell strings for az
          # are represented by locale values above. Noscript is intentionally locale-neutral.
          seen=set(); out=[]
          for item in items:
              pair=(item["location"],item["text"])
              if pair in seen: continue
              seen.add(pair)
              item["id"]=f"AZ{len(out):04d}"
              out.append(item)

          Path("/tmp/az-strict/evidence/items.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          compact=json.dumps(out,ensure_ascii=False,separators=(",",":"))
          Path("/tmp/az-strict/corpus.json").write_text(compact,encoding="utf-8")
          print(f"items={len(out)} chars={len(compact)}")
          if len(compact)>100000:
              raise SystemExit("Azerbaijani corpus unexpectedly exceeds one-shot review budget")
          PY

      - name: Start isolated Gemma 3 12B reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/az-strict/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-3-12b-it-GGUF:Q4_K_M \
            -c 32768 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/az-strict/evidence/server.log 2>&1 &
          echo "$!" > /tmp/az-strict/server.pid
          for _ in $(seq 1 900); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

      - name: Batched hidden reviewer qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases=[
              {"id":"g1","text":"Təqvim seçin, tarix daxil edin və “Tarixi göstər” düyməsinə basın.","expected":"TƏBİİ"},
              {"id":"g2","text":"Əməl günü hesablamanın başlanğıc nöqtəsidir.","expected":"TƏBİİ"},
              {"id":"g3","text":"“Əvvəlki kotlet” düyməsi əvvəlki kotletə keçir.","expected":"TƏBİİ"},
              {"id":"g4","text":"Aylar il boyu bir-birinə hörülə bilər.","expected":"TƏBİİ"},
              {"id":"g5","text":"Soruşulan gün dəyişmir; yalnız göstərilən Pastafari tarixi əməl günündən asılıdır.","expected":"TƏBİİ"},
              {"id":"b1","text":"İşlem gününü değiştir.","expected":"DÜZƏLT"},
              {"id":"b2","text":"Bu site nasıl kullanılır?","expected":"DÜZƏLT"},
              {"id":"b3","text":"Tarix arama ve müqayisə özellikli bir təqvim.","expected":"DÜZƏLT"},
              {"id":"b4","text":"Bu tarix etibarlıdılar.","expected":"DÜZƏLT"},
              {"id":"b5","text":"Hesablama nəticələri gösterilir.","expected":"DÜZƏLT"},
          ]
          ids=[c["id"] for c in cases]
          prompt=(
              "Sən ciddi, ana dili Azərbaycan dili olan dil redaktorusan. Aşağıdakı 10 fraqmentin hər birini ayrıca qiymətləndir. "
              "Müasir təbii Azərbaycan dili, qrammatika, uzlaşma, sintaksis, idiomatiklik və dilin həqiqətən Azərbaycan dili "
              "olub-olmadığını yoxla; Türkiyə türkcəsini Azərbaycan dili kimi qəbul etmə. "
              "Bu layihədə 'əməl günü', 'soruşulan gün', 'kotlet' və 'bir-birinə hörülmüş aylar' kanonik domen terminləridir. "
              "'kotlet' qəsdən istifadə olunan kanonik termindir və sırf bu səbəbdən problem deyil. "
              "Yalnız JSON qaytar. Hər id üçün verdict yalnız TƏBİİ və ya DÜZƏLT ola bilər.\n\n"
              + json.dumps(cases,ensure_ascii=False)
          )
          schema={
              "type":"object",
              "properties":{
                  "decisions":{
                      "type":"array","minItems":10,"maxItems":10,
                      "items":{
                          "type":"object",
                          "properties":{
                              "id":{"type":"string","enum":ids},
                              "verdict":{"type":"string","enum":["TƏBİİ","DÜZƏLT"]}
                          },
                          "required":["id","verdict"],"additionalProperties":False
                      }
                  }
              },
              "required":["decisions"],"additionalProperties":False
          }
          payload={
              "messages":[{"role":"user","content":prompt}],
              "temperature":0.0,"max_tokens":500,"stream":False,
              "response_format":{"type":"json_schema","json_schema":{"name":"az_qualification","strict":True,"schema":schema}}
          }
          req=urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp:
              data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip()
          Path("/tmp/az-strict/evidence/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          parsed=json.loads(raw)
          decisions=parsed.get("decisions",[])
          if len(decisions)!=10 or len({d.get("id") for d in decisions})!=10:
              raise SystemExit("Azerbaijani qualification returned incomplete/duplicate decisions")
          actual={d["id"]:d["verdict"] for d in decisions}
          results=[]
          failed=[]
          for c in cases:
              passed=actual.get(c["id"])==c["expected"]
              results.append({**c,"actual":actual.get(c["id"]),"passed":passed})
              if not passed: failed.append(c["id"])
          Path("/tmp/az-strict/evidence/qualification.json").write_text(
              json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps(results,ensure_ascii=False,indent=2))
          if failed:
              raise SystemExit("Azerbaijani reviewer qualification failed: "+", ".join(failed))
          PY

      - name: Strict whole-site Azerbaijani review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          ev=Path("/tmp/az-strict/evidence")
          items=json.loads(ev.joinpath("items.json").read_text(encoding="utf-8"))
          by_location={}
          for item in items:
              by_location.setdefault(item["location"],[]).append(item["text"])

          prompt=(
              "Sən Pastafari təqviminin Azərbaycan dili versiyası üçün müstəqil və sərt ana-dil redaktorusan. "
              "Bütün təqdim edilmiş görünən və əlçatanlıq yönümlü mətn korpusunu vahid whole-site təcrübəsi kimi yoxla. "
              "Türkiyə türkcəsi və ya ingilis dilinin qəsdsiz sızmasını, tərcümə qoxusunu, qeyri-təbii Azərbaycan dilini, "
              "qrammatika, uzlaşma, sintaksis, orfoqrafiya, durğu, tipografiya və termin ardıcıllığı problemlərini fəal axtar. "
              "Metadata, manifest və accessibility mətnini də yoxla. "
              "Bu layihədə 'əməl günü', 'soruşulan gün', 'kotlet', 'bir-birinə hörülmüş aylar', 'Short Choice' və 'Wide Choice' "
              "kanonik domen/adlandırılmış alqoritm terminləridir; sırf qeyri-adi olduqları üçün onları dəyişmə. "
              "Formullar, API endpoint adları, code literals, hash-lər, HTTP, CLI, OpenAPI, SIMD, SLA, all-day və həqiqi xüsusi adlar "
              "dəyişdirilməz texniki mətn ola bilər. "
              "Hər finding-in location-u təqdim edilmiş location-lardan biri olmalıdır və current_text həmin location-un mətnində "
              "dəqiq ardıcıl substring olmalıdır. Kod və ya reviewer təlimatını sayt mətni kimi təqdim etmə. "
              "Correction current_text ilə eyni ola bilməz. Yalnız real və düzəliş tələb edən problemləri bildir. "
              "Heç bir real problem qalmayıbsa CLEAN və boş findings qaytar. Yalnız schema-ya uyğun JSON qaytar.\n\n"
              "WEBSITE_TEXT_ITEMS_JSON:\n"
              + Path("/tmp/az-strict/corpus.json").read_text(encoding="utf-8")
          )
          schema={
              "type":"object",
              "properties":{
                  "result":{"type":"string","enum":["CLEAN","FINDINGS"]},
                  "findings":{
                      "type":"array","maxItems":14,
                      "items":{
                          "type":"object",
                          "properties":{
                              "severity":{"type":"string","enum":["critical","high","medium","low"]},
                              "location":{"type":"string"},
                              "current_text":{"type":"string","minLength":1,"maxLength":280},
                              "issue":{"type":"string","minLength":15,"maxLength":420},
                              "correction":{"type":"string","minLength":2,"maxLength":420}
                          },
                          "required":["severity","location","current_text","issue","correction"],
                          "additionalProperties":False
                      }
                  }
              },
              "required":["result","findings"],"additionalProperties":False
          }
          payload={
              "messages":[{"role":"user","content":prompt}],
              "temperature":0.05,"top_p":0.85,"max_tokens":1900,"stream":False,
              "response_format":{"type":"json_schema","json_schema":{"name":"az_whole_site_review","strict":True,"schema":schema}}
          }

          last_error=""
          accepted=None
          for attempt in (1,2):
              msg=prompt if attempt==1 else prompt+"\n\nMEXANİKİ_TƏKRAR=TRUE\nSƏBƏB="+last_error+"\nTAM_JSON_QAYTAR=TRUE"
              payload["messages"]=[{"role":"user","content":msg}]
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=3600) as resp:
                  data=json.load(resp)
              raw=data["choices"][0]["message"]["content"].strip()
              ev.joinpath(f"raw-review-attempt-{attempt}.json").write_text(raw+"\n",encoding="utf-8")
              try:
                  parsed=json.loads(raw)
              except Exception:
                  last_error="ETİBARSIZ_JSON"; continue
              result=parsed.get("result"); findings=parsed.get("findings")
              if result not in {"CLEAN","FINDINGS"} or not isinstance(findings,list):
                  last_error="ETİBARSIZ_STRUKTUR"; continue
              if result=="CLEAN" and findings:
                  last_error="CLEAN_FINDINGS"; continue
              if result=="FINDINGS" and not findings:
                  last_error="FINDINGS_BOŞ"; continue

              seen=set(); good=True
              for f in findings:
                  loc=str(f.get("location","")).strip()
                  cur=str(f.get("current_text","")).strip()
                  corr=str(f.get("correction","")).strip()
                  pair=(loc,cur)
                  if loc not in by_location:
                      last_error="NAMƏLUM_LOCATION"; good=False; break
                  if not cur or not any(cur in text for text in by_location[loc]):
                      last_error="CURRENT_TEXT_LOCATION_DA_YOXDUR"; good=False; break
                  if cur==corr:
                      last_error="NO_OP_CORRECTION"; good=False; break
                  if pair in seen:
                      last_error="DUBLİKAT"; good=False; break
                  seen.add(pair)
              if not good: continue
              accepted=parsed; break

          if accepted is None:
              raise SystemExit("Azerbaijani whole-site review invalid after retries: "+last_error)

          final_result="PASS" if accepted["result"]=="CLEAN" else "FAIL"
          final={
              "result":final_result,
              "reviewed_head":ev.joinpath("reviewed-head.txt").read_text().strip(),
              "findings":accepted["findings"]
          }
          ev.joinpath("final.json").write_text(json.dumps(final,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          lines=[f"NATIVE_QA_RESULT: {final_result}",""]
          if final_result=="PASS":
              lines+=["Azərbaycan dili üzrə sərt whole-site dil yoxlamasında düzəliş tələb edən təsdiqlənmiş problem qalmadı.",""]
          else:
              lines+=["Azərbaycan dili üzrə sərt whole-site dil yoxlaması düzəliş tələb edən təsdiqlənmiş problemlər tapdı.",""]
              for i,f in enumerate(accepted["findings"],1):
                  lines += [
                      f"### {i}. {f['severity']}","",f["location"],"",
                      f"> {f['current_text']}","",f["issue"],"",
                      "Tövsiyə olunan düzəliş: "+f["correction"],""
                  ]
          ev.joinpath("review.md").write_text("\n".join(lines).rstrip()+"\n",encoding="utf-8")
          print(final_result)
          PY

      - name: Verify verdict
        shell: bash
        run: |
          set -euo pipefail
          head -n 1 /tmp/az-strict/evidence/review.md | grep -Eq '^NATIVE_QA_RESULT: (PASS|FAIL)$'

      - name: Stop reviewer
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/az-strict/server.pid ]; then
            kill "$(cat /tmp/az-strict/server.pid)" 2>/dev/null || true
          fi

      - name: Upload strict Azerbaijani evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azerbaijani-strict-native-whole-site
          path: /tmp/az-strict/evidence/
          if-no-files-found: warn
          retention-days: 90
