name: Cancel stale about native-QA runs

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - artifacts/about-i18n-native-qa-cancel.json

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cancel listed workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          control = json.loads(Path("artifacts/about-i18n-native-qa-cancel.json").read_text(encoding="utf-8"))
          run_ids = control.get("run_ids", [])
          if not run_ids:
              raise SystemExit("no run_ids supplied")

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          for run_id in run_ids:
              url = f"https://api.github.com/repos/{repo}/actions/runs/{int(run_id)}/cancel"
              req = urllib.request.Request(
                  url,
                  data=b"",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "about-i18n-native-qa-cleanup",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(run_id, resp.status)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  if exc.code in (409, 422):
                      print(run_id, exc.code, body)
                      continue
                  raise
          PY
