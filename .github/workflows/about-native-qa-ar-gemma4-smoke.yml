name: Arabic Gemma4 reviewer qualification

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-ar-gemma4-smoke.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ar-gemma/llama
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/ar-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/ar-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ar-gemma/llama.tar.gz -C /tmp/ar-gemma/llama

      - name: Qualify Arabic reviewer on hidden controls
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/ar-gemma/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 \
            --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' \
            -c 4096 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/ar-gemma/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases = [
              ("g1", "اختر تاريخًا وحاول مرة أخرى.", "سليم"),
              ("g2", "يوم العمل هو نقطة انطلاق الحساب.", "سليم"),
              ("g3", "القطعة السابقة", "سليم"),
              ("g4", "إذا رمزنا إلى يوم العمل بـ c وإلى اليوم المستعلَم عنه بـ t، فالتاريخ هو:", "سليم"),
              ("b1", "هذه التاريخ صحيح.", "تصحيح"),
              ("b2", "الأشهر متشابك على مدار السنة.", "تصحيح"),
              ("b3", "Click هنا للمتابعة.", "تصحيح"),
              ("b4", "اليوم المستعلم عنها نفسه.", "تصحيح"),
          ]
          prompt=(
              "أنت مراجع لغوي عربي صارم. قيّم المقطع المعطى فقط. "
              "تحقق من العربية الفصحى الحديثة الطبيعية، والنحو والصرف والمطابقة والتركيب، "
              "ومن عدم وجود خلط غير مقصود بلغة أخرى. المتغيرات اللاتينية القصيرة مثل c وt مسموحة "
              "داخل الصيغ والجمل التقنية ولا تعد خطأ بذاتها. "
              "يجب أن يكون السطر الأول بالضبط إما «الحكم: سليم» أو «الحكم: تصحيح». "
              "وفي السطر الثاني اذكر سببًا عربيًا قصيرًا."
          )
          results=[]
          for case_id,fragment,expected in cases:
              payload={
                  "messages":[{"role":"user","content":prompt+"\n\nالمقطع: "+json.dumps(fragment,ensure_ascii=False)}],
                  "temperature":0.0,"max_tokens":120,"reasoning_effort":"none",
                  "chat_template_kwargs":{"enable_thinking":False},"stream":False,
              }
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=900) as resp:
                  data=json.load(resp)
              answer=data["choices"][0]["message"]["content"].strip()
              first=answer.splitlines()[0].strip() if answer else ""
              actual="سليم" if first=="الحكم: سليم" else "تصحيح" if first=="الحكم: تصحيح" else "غير صالح"
              passed=actual==expected
              results.append({"id":case_id,"fragment":fragment,"expected":expected,"actual":actual,"passed":passed,"answer":answer})
              print(case_id,results[-1])
          Path("/tmp/ar-gemma/qualification.json").write_text(
              json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          failed=[r["id"] for r in results if not r["passed"]]
          if failed:
              raise SystemExit("Arabic reviewer qualification failed: "+", ".join(failed))
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arabic-gemma4-reviewer-qualification
          path: |
            /tmp/ar-gemma/qualification.json
            /tmp/ar-gemma/server.log
          if-no-files-found: warn
          retention-days: 30
