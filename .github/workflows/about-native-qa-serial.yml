name: About i18n serial native-language QA

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - artifacts/about-i18n-native-qa-control.json

permissions:
  contents: write

jobs:
  native-review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Read and validate serial QA control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json, re
          from pathlib import Path

          control = json.loads(Path("artifacts/about-i18n-native-qa-control.json").read_text(encoding="utf-8"))
          code = control["locale_code"]
          tag = control["locale_tag"]
          prompt_path = control["prompt_path"]
          sequence = str(control["sequence"])

          if not re.fullmatch(r"[a-z]{2,3}", code):
              raise SystemExit(f"unsafe locale_code: {code!r}")
          if not re.fullmatch(r"[A-Za-z0-9-]+", tag):
              raise SystemExit(f"unsafe locale_tag: {tag!r}")
          if prompt_path != f"artifacts/about-i18n-native-prompts/{code}.md":
              raise SystemExit(f"unexpected prompt_path: {prompt_path!r}")
          if not Path(prompt_path).is_file():
              raise SystemExit(f"missing target-language prompt: {prompt_path}")
          if not Path(f"docs/i18n/locales/{code}.js").is_file():
              raise SystemExit(f"missing locale module: {code}")
          if not Path(f"docs/about/content/{code}.html").is_file():
              raise SystemExit(f"missing about article: {code}")

          print(f"QA_LOCALE_CODE={code}")
          print(f"QA_LOCALE_TAG={tag}")
          print(f"QA_PROMPT_PATH={prompt_path}")
          print(f"QA_SEQUENCE={sequence}")
          PY

      - name: Prepare compact whole-site review source
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/about-i18n-native-sessions/$QA_LOCALE_CODE/staged-$QA_SEQUENCE"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/reviewed-head.txt"
          cp "$QA_PROMPT_PATH" "$OUT/prompt.md"

          python - <<'PY'
          from pathlib import Path
          import os, re

          code = os.environ["QA_LOCALE_CODE"]
          tag = os.environ["QA_LOCALE_TAG"]
          seq = os.environ["QA_SEQUENCE"]
          out = Path("artifacts/about-i18n-native-sessions") / code / f"staged-{seq}"

          def text(path):
              return Path(path).read_text(encoding="utf-8")

          def excerpt(path, patterns, radius=0, first_lines=0):
              lines = text(path).splitlines()
              regexes = [re.compile(p, re.I) for p in patterns]
              keep = set(range(min(first_lines, len(lines))))
              for i, line in enumerate(lines):
                  if any(rx.search(line) for rx in regexes):
                      for j in range(max(0, i-radius), min(len(lines), i+radius+1)):
                          keep.add(j)
              result, last = [], None
              for i in sorted(keep):
                  if last is not None and i != last + 1:
                      result.append("…")
                  result.append(f"{i+1}: {lines[i]}")
                  last = i
              return "\n".join(result)

          def function_block(path, function_name):
              lines = text(path).splitlines()
              start = next((i for i, line in enumerate(lines)
                            if re.search(rf"\b(?:async\s+)?function\s+{re.escape(function_name)}\b", line)), None)
              if start is None:
                  return ""
              depth = 0
              seen = False
              block = []
              for i in range(start, len(lines)):
                  line = lines[i]
                  block.append(f"{i+1}: {line}")
                  depth += line.count("{") - line.count("}")
                  seen = seen or "{" in line
                  if seen and depth <= 0:
                      break
              return "\n".join(block)

          def key_inventory(paths):
              keys = set()
              patterns = [
                  re.compile(r"""(?:\bt\b|i18n\.t|translate)\(\s*['"]([^'"]+)['"]"""),
                  re.compile(r"""data-i18n(?:-[a-z-]+)?=['"]([^'"]+)['"]"""),
              ]
              for path in paths:
                  data = text(path)
                  for rx in patterns:
                      keys.update(rx.findall(data))
              return "\n".join(sorted(keys))

          locale_path = f"docs/i18n/locales/{code}.js"
          about_path = f"docs/about/content/{code}.html"

          sections = [
              f"===== {locale_path} — FULL TARGET LOCALE =====\n" + text(locale_path),
              f"===== {about_path} — FULL TARGET ABOUT ARTICLE =====\n" + text(about_path),
              "===== docs/index.html — DISPLAYED/I18N/A11Y SURFACES =====\n" +
                  excerpt("docs/index.html", [r"data-i18n", r"aria-", r"placeholder", r"<title", r"<meta", r"<noscript", r"lang=", r"dir="]),
              "===== docs/about/index.html — DISPLAYED/I18N/A11Y SURFACES =====\n" +
                  excerpt("docs/about/index.html", [r"data-i18n", r"aria-", r"placeholder", r"<title", r"<meta", r"<noscript", r"lang=", r"dir="]),
              "===== docs/manifest.webmanifest — FALLBACK + TARGET LOCALE =====\n" +
                  excerpt("docs/manifest.webmanifest",
                          [rf'"{re.escape(code)}"\s*:', re.escape(tag)],
                          radius=5, first_lines=12),
              "===== docs/i18n/runtime.js — FULL LOCALIZATION RUNTIME =====\n" + text("docs/i18n/runtime.js"),
              "===== docs/i18n/registry.js — TARGET REGISTRATION =====\n" +
                  excerpt("docs/i18n/registry.js",
                          [rf'defineLocale\("{re.escape(code)}"', re.escape(tag), r"DEFAULT_LOCALE"],
                          radius=2),
              "===== docs/i18n/registry.js — LOCALE LOAD/FALLBACK FUNCTIONS =====\n" +
                  "\n\n".join(filter(None, [
                      function_block("docs/i18n/registry.js", "loadLocaleSource"),
                      function_block("docs/i18n/registry.js", "materializeLocaleResources"),
                      function_block("docs/i18n/registry.js", "loadLocale"),
                  ])),
              "===== docs/about/about.js — FULL ARTICLE LOCALIZATION FLOW =====\n" + text("docs/about/about.js"),
              "===== docs/app.js — HARD-CODED DISPLAY + LOCALE-LOAD TOUCHPOINTS =====\n" +
                  excerpt("docs/app.js",
                          [r"textContent\s*=\s*[\'\"]", r"innerHTML\s*=\s*[\'\"]",
                           r"setAttribute\s*\(\s*[\'\"](aria-label|title|placeholder)[\'\"]",
                           r"placeholder\s*=\s*[\'\"]", r"title\s*=\s*[\'\"]",
                           r"loadLocale\s*\(", r"applyDocumentLocale", r"visibleError"],
                          radius=1),
              "===== docs/reverse-ui.js — HARD-CODED DISPLAY TOUCHPOINTS =====\n" +
                  excerpt("docs/reverse-ui.js",
                          [r"textContent\s*=\s*[\'\"]", r"innerHTML\s*=\s*[\'\"]",
                           r"setAttribute\s*\(\s*[\'\"](aria-label|title|placeholder)[\'\"]",
                           r"placeholder\s*=\s*[\'\"]", r"title\s*=\s*[\'\"]"],
                          radius=1),

          ]

          source = "\n\n".join(sections)
          if len(source) > 90000:
              raise SystemExit(f"compact review source too large: {len(source)} chars")
          (out / "source.txt").write_text(source, encoding="utf-8")
          print(f"compact review source: {len(source)} chars")
          PY

      - name: Download pinned llama.cpp and Qwen3-4B reviewer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-qa/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/native-qa/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/native-qa/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/native-qa/llama.tar.gz -C /tmp/native-qa/llama
          curl -fL --retry 3 'https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true' -o /tmp/native-qa/qwen3-4b-q4_k_m.gguf
          echo "7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5  /tmp/native-qa/qwen3-4b-q4_k_m.gguf" | sha256sum -c -

      - name: Run isolated compact target-language review
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/about-i18n-native-sessions/$QA_LOCALE_CODE/staged-$QA_SEQUENCE"
          SERVER="$(find /tmp/native-qa/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" -m /tmp/native-qa/qwen3-4b-q4_k_m.gguf -c 32768 -t 4 --host 127.0.0.1 --port 8080 > /tmp/native-qa/llama-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

          python - <<'PY'
          from pathlib import Path
          import json, os, urllib.request, urllib.error

          code = os.environ["QA_LOCALE_CODE"]
          tag = os.environ["QA_LOCALE_TAG"]
          seq = os.environ["QA_SEQUENCE"]
          out = Path("artifacts/about-i18n-native-sessions") / code / f"staged-{seq}"
          base = (out / "prompt.md").read_text(encoding="utf-8").strip()
          source = (out / "source.txt").read_text(encoding="utf-8")
          message = base + "\n\nMODE=FINAL\nSOURCE_PART=WHOLE_SITE_COMPACT\n\n" + source

          with urllib.request.urlopen("http://127.0.0.1:8080/v1/models", timeout=30) as resp:
              model_id = json.load(resp)["data"][0]["id"]

          payload = {
              "model": model_id,
              "messages": [{"role": "user", "content": message}],
              "temperature": 0.15,
              "top_p": 0.8,
              "max_tokens": 1600,
              "stream": False,
          }
          req = urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=5400) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as exc:
              print("HTTP error body:")
              print(exc.read().decode("utf-8", errors="replace"))
              raise

          review = data["choices"][0]["message"]["content"].strip() + "\n"
          (out / "review.md").write_text(review, encoding="utf-8")

          reviewed_head = (out / "reviewed-head.txt").read_text(encoding="utf-8").strip()
          session = (
              "# LLM_SESSION_EVIDENCE\n"
              f"locale_code: {code}\n"
              f"locale_tag: {tag}\n"
              f"sequence: {seq}\n"
              f"reviewed_head: {reviewed_head}\n"
              "reviewer_model: Qwen3-4B Q4_K_M\n"
              "model_sha256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5\n"
              "llama_cpp_release: b10982\n"
              "llama_cpp_asset_sha256: b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789\n"
              "\n===== USER =====\n" + message +
              "\n===== ASSISTANT =====\n" + review
          )
          (out / "session.md").write_text(session, encoding="utf-8")
          PY

      - name: Verify evidence and preserve attempt
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/about-i18n-native-sessions/$QA_LOCALE_CODE/staged-$QA_SEQUENCE"
          test -s "$OUT/prompt.md"
          test -s "$OUT/review.md"
          test -s "$OUT/session.md"
          test -s "$OUT/reviewed-head.txt"
          test -s "$OUT/source.txt"
          head -n 1 "$OUT/review.md" | grep -Eq '^NATIVE_QA_RESULT: (PASS|FAIL)$'
          HEAD_SHA="$(cat "$OUT/reviewed-head.txt")"
          ATTEMPT="artifacts/about-i18n-native-sessions/$QA_LOCALE_CODE/attempts/${QA_SEQUENCE}-${HEAD_SHA}"
          mkdir -p "$ATTEMPT"
          cp "$OUT/prompt.md" "$ATTEMPT/prompt.md"
          cp "$OUT/review.md" "$ATTEMPT/review.md"
          cp "$OUT/session.md" "$ATTEMPT/session.md"
          cp "$OUT/reviewed-head.txt" "$ATTEMPT/reviewed-head.txt"
          cp "$OUT/source.txt" "$ATTEMPT/source.txt"
          head -n 1 "$OUT/review.md"
          cat "$OUT/review.md"

      - name: Upload native-session evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: about-native-qa-${{ env.QA_LOCALE_CODE }}-${{ env.QA_SEQUENCE }}
          path: artifacts/about-i18n-native-sessions/${{ env.QA_LOCALE_CODE }}/
          if-no-files-found: error

      - name: Commit review evidence back to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "artifacts/about-i18n-native-sessions/$QA_LOCALE_CODE/"
          git commit -m "qa($QA_LOCALE_CODE): record isolated native-language session $QA_SEQUENCE"
          git pull --rebase origin feature/about-i18n-72-locales
          git push origin HEAD:feature/about-i18n-72-locales
