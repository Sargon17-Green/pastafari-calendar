name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - run: git diff --exit-code -- browser/standalone/pastafari-date.js browser/standalone/pastafari-date.min.js
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:file-protocol
      - run: sha256sum -c SHA256SUMS.txt
