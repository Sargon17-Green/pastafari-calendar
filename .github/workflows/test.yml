name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node_compatibility: ${{ steps.classify.outputs.node_compatibility }}
      node_deep: ${{ steps.classify.outputs.node_deep }}
      browser_smoke: ${{ steps.classify.outputs.browser_smoke }}
      accessibility: ${{ steps.classify.outputs.accessibility }}
      checkpoint_test: ${{ steps.classify.outputs.checkpoint_test }}
      pwa_offline: ${{ steps.classify.outputs.pwa_offline }}
      day_boundary_job: ${{ steps.classify.outputs.day_boundary_job }}
      node_minimum: ${{ steps.classify.outputs.node_minimum }}
      performance_regression: ${{ steps.classify.outputs.performance_regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-classifier.mjs --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - run: npm run gate-data:check
      - name: Verify specification-derived gate artifacts are committed
        shell: bash
        run: |
          set -euo pipefail
          gate_cache="${RUNNER_TEMP}/pastafari-reference-gates.json"
          node implementations/tests/export_reference_gate_cache.mjs "$gate_cache"
          PASTAFARI_REFERENCE_GATE_CACHE="$gate_cache" python implementations/tests/generate_spec_binding_5778.py
          node implementations/tests/generate_spec_deep_year_chain.mjs
          PASTAFARI_REFERENCE_GATE_CACHE="$gate_cache" python implementations/tests/generate_spec_canonical.py
          python implementations/tests/verify_gate_checkpoints.py
          git diff --exit-code -- \
            implementations/tests/spec-derived-gate-checkpoints.json \
            implementations/tests/spec-derived-canonical-vectors.json \
            implementations/tests/conformance-vectors.json \
            implementations/tests/spec-derived-deep-year-chain.json \
            implementations/tests/spec-derived-binding-5778.json
      - run: npm run docs:check
      - run: npm run check:reverse-i18n
      - run: npm run check:i18n
      - run: npm run build:standalone
      - name: Record generated standalone hashes
        shell: bash
        run: |
          sha256sum \
            browser/standalone/pastafari-date.js \
            browser/standalone/pastafari-date.min.js \
            | tee generated-standalone-SHA256SUMS.txt
      - name: Upload generated standalone for Update 3 reconciliation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update3-generated-standalone-${{ github.sha }}
          path: |
            browser/standalone/pastafari-date.js
            browser/standalone/pastafari-date.min.js
            generated-standalone-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - run: git diff --exit-code -- browser/standalone/pastafari-date.js browser/standalone/pastafari-date.min.js
      - run: npm test
      - run: sha256sum -c SHA256SUMS.txt
      - run: node scripts/check-sha-manifest-completeness.mjs

  node-compatibility:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.node_compatibility == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - run: npm run test:compatibility

  node-deep:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.node_deep == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - run: npm run test:deep

  browser-smoke:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.browser_smoke == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium firefox
      - run: npm run test:i18n-support
      - run: npm run test:file-protocol

  accessibility:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.accessibility == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - name: Install Playwright Chromium with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Playwright install attempt ${attempt}/3"
            set +e
            ./node_modules/.bin/playwright install --with-deps chromium
            status=$?
            set -e

            if (( status == 0 )); then
              echo "Playwright install succeeded on attempt ${attempt}."
              exit 0
            fi

            if (( attempt == 3 )); then
              echo "Playwright install failed after ${attempt} attempts (status ${status})." >&2
              exit "${status}"
            fi

            echo "Playwright install attempt ${attempt} failed (status ${status}); retrying after the installer has exited."
            sleep $((attempt * 15))
          done
      - name: Run automated accessibility checks
        run: npm run test:accessibility
      - name: Upload accessibility failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-failure-artifacts
          path: artifacts/accessibility
          if-no-files-found: ignore

  checkpoint-test:
    name: checkpoint-test (${{ matrix.checkpoint }})
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkpoint: sides
            env_var: PASTAFARI_CHECKPOINT_SIDES
            test_name: optionally check representative checkpoints on both sides
          - checkpoint: exhaustive
            env_var: PASTAFARI_EXHAUSTIVE_CHECKPOINTS
            test_name: optionally check both sides of every checkpoint
          - checkpoint: rebuild
            env_var: PASTAFARI_REBUILD_CHECKPOINTS
            test_name: optionally reconstruct every checkpoint interval from gate distances
    steps:
      - name: Checkpoint suite not affected
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.checkpoint_test != 'true' }}
        run: echo "Checkpoint suite skipped by conservative changed-file classification."
      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.checkpoint_test == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.checkpoint_test == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.checkpoint_test == 'true' }}
        run: npm run security:supply-chain
      - if: ${{ needs.changes.result != 'success' || needs.changes.outputs.checkpoint_test == 'true' }}
        run: npm ci
      - name: Run checkpoint test (${{ matrix.checkpoint }})
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.checkpoint_test == 'true' }}
        shell: bash
        env:
          CHECKPOINT_LABEL: ${{ matrix.checkpoint }}
          CHECKPOINT_ENV_VAR: ${{ matrix.env_var }}
          CHECKPOINT_TEST_NAME: ${{ matrix.test_name }}
        run: |
          set -u

          log_file="checkpoint-${CHECKPOINT_LABEL}.log"
          start_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          start_epoch_ms="$(date +%s%3N)"
          echo "Checkpoint ${CHECKPOINT_LABEL} start: ${start_iso}"
          echo "Enabling only ${CHECKPOINT_ENV_VAR}=1"

          set +e
          env \
            -u PASTAFARI_CHECKPOINT_SIDES \
            -u PASTAFARI_EXHAUSTIVE_CHECKPOINTS \
            -u PASTAFARI_REBUILD_CHECKPOINTS \
            "${CHECKPOINT_ENV_VAR}=1" \
            node --test test/checkpoint-compatibility.test.js 2>&1 | tee "${log_file}"
          test_status=${PIPESTATUS[0]}
          set -e

          end_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          end_epoch_ms="$(date +%s%3N)"
          duration_ms=$((end_epoch_ms - start_epoch_ms))
          result_line="$(grep -F " - ${CHECKPOINT_TEST_NAME}" "${log_file}" | tail -n 1 || true)"
          node_test_count="$(awk '$1 == "#" && $2 == "tests" { value = $3 } END { print value }' "${log_file}")"

          checkpoint_status="PASS"
          if (( test_status != 0 )); then
            checkpoint_status="FAIL"
          elif [[ -z "${result_line}" || "${result_line}" == *"not ok "* || "${result_line}" == *"# SKIP"* || "${result_line}" != *"ok "* ]]; then
            checkpoint_status="FAIL"
          fi

          echo "Checkpoint ${CHECKPOINT_LABEL} end: ${end_iso}"
          echo "Checkpoint ${CHECKPOINT_LABEL} duration: ${duration_ms}ms"
          echo "Checkpoint ${CHECKPOINT_LABEL} result: ${checkpoint_status}"
          if [[ -n "${node_test_count}" ]]; then
            echo "Node test count: ${node_test_count}"
          fi
          echo "Relevant TAP line: ${result_line:-<missing>}"

          {
            echo "### Checkpoint ${CHECKPOINT_LABEL}"
            echo "- Start: ${start_iso}"
            echo "- End: ${end_iso}"
            echo "- Duration: ${duration_ms} ms"
            echo "- Result: ${checkpoint_status}"
            if [[ -n "${node_test_count}" ]]; then
              echo "- Node test count: ${node_test_count}"
            fi
            printf -- '- Relevant TAP line: `%s`\n' "${result_line:-<missing>}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( test_status != 0 )); then
            exit "${test_status}"
          fi
          if [[ "${checkpoint_status}" != "PASS" ]]; then
            echo "The requested checkpoint subtest did not complete as a non-skipped pass." >&2
            exit 1
          fi

  pwa-offline:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.pwa_offline == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run PWA offline smoke
        run: node scripts/run-pwa-offline-smoke.mjs
      - name: Run reverse UI smoke
        run: npm run test:reverse-ui

  day-boundary:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.day_boundary_job == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run astronomical day-boundary smoke
        run: npm run test:day-boundary

  node-minimum:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.node_minimum == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.0.0
      - name: Verify exact Node version
        run: node -e "if (process.versions.node !== '18.0.0') throw new Error('Expected Node 18.0.0, got ' + process.versions.node); console.log('Node runtime:', process.versions.node)"
      - name: Run minimum Node runtime smoke
        run: node scripts/test-minimum-node.mjs

  performance-regression:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.performance_regression == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Resolve performance baseline commit
        id: baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${base_sha}:browser/pastafari-calendar-fast.js"
          echo "sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "Performance baseline commit: ${base_sha}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Materialize baseline engine
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          baseline_dir="${RUNNER_TEMP}/pastafari-performance-baseline"
          rm -rf "${baseline_dir}"
          mkdir -p "${baseline_dir}"
          git show "${BASE_SHA}:browser/pastafari-calendar-fast.js" > "${baseline_dir}/pastafari-calendar-fast.mjs"
          if grep -Fq './pastafari-diagnostics.js' "${baseline_dir}/pastafari-calendar-fast.mjs"; then
            git cat-file -e "${BASE_SHA}:browser/pastafari-diagnostics.js"
            git show "${BASE_SHA}:browser/pastafari-diagnostics.js" > "${baseline_dir}/pastafari-diagnostics.js"
          fi
          printf '{"type":"module"}\n' > "${baseline_dir}/package.json"
      - name: Detect JavaScript performance regressions
        shell: bash
        run: |
          set -euo pipefail
          node --expose-gc scripts/run-performance-regression.mjs \
            --baseline "${RUNNER_TEMP}/pastafari-performance-baseline/pastafari-calendar-fast.mjs" \
            --candidate "browser/pastafari-calendar-fast.js" \
            --json "${RUNNER_TEMP}/performance-regression.json"
