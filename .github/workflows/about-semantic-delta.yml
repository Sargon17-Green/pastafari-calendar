name: About semantic delta rollout

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - artifacts/about-semantic-delta-trigger.json

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: about-semantic-delta-rollout
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/about-i18n-72-locales
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g @github/copilot@1.0.88
      - name: Apply requested semantic delta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p artifacts/about-semantic-delta-runs
          BATCH="$(node -e 'const t=require("./artifacts/about-semantic-delta-trigger.json"); if(!Array.isArray(t.locales)||!t.locales.length) throw new Error("trigger.locales must be a non-empty array"); process.stdout.write(t.locales.join(","));')"
          echo "Requested locales: $BATCH"
          IFS=',' read -ra LOCALES <<< "$BATCH"
          for LOCALE in "${LOCALES[@]}"; do
            echo "=== semantic delta: $LOCALE ==="
            git pull --rebase origin feature/about-i18n-72-locales
            TARGET="docs/about/content/$LOCALE.html"
            test -s "$TARGET"
            BEFORE_BLOB="$(git hash-object "$TARGET")"
            node --check test/about-page.test.js
            node --check scripts/apply-about-semantic-delta.mjs
            node --test test/about-page.test.js

            META="$(LOCALE="$LOCALE" node --input-type=module <<'NODE'
          import { LOCALES } from "./docs/i18n/registry.js";
          const item=LOCALES.find((entry)=>entry.code===process.env.LOCALE);
          if(!item) throw new Error("Unknown locale "+process.env.LOCALE);
          process.stdout.write(JSON.stringify({code:item.code,tag:item.intlLocale,name:item.displayName,dir:item.dir}));
          NODE
            )"
            TARGET_NAME="$(META="$META" node -p 'JSON.parse(process.env.META).name')"
            TARGET_TAG="$(META="$META" node -p 'JSON.parse(process.env.META).tag')"

            cat > "/tmp/$LOCALE.prompt.md" <<EOF
          אתה עורך לשוני־סמנטי של דף /about/ בלוח השנה הפסטפרי.

          שפת היעד היא $TARGET_NAME ($TARGET_TAG), וקובץ היעד היחיד הוא $TARGET.

          קרא לפני ההחלטה את כל הקבצים הבאים:
          - docs/about/content/he.html — המאסטר הסמנטי העברי הנוכחי;
          - artifacts/about-semantic-delta-2026-09-26-he.md — מפרט הדלתא;
          - artifacts/about-i18n-rollout-ledger.md — ובפרט Semantic invariant ledger וכללי התרגום;
          - $TARGET — הגרסה המקומית העדכנית;
          - artifacts/about-i18n-qa/$LOCALE.md אם היא קיימת — כדי לא להחזיר ניסוחים שכבר תוקנו ב-native QA.

          אין להשתמש באנגלית כשפת pivot. השווה ישירות בין המאסטר העברי לבין שפת היעד.
          זו אינה משימת תרגום מחדש. שמור כל ניסוח מקומי טוב וכל תיקון QA קיים.
          ב-Seer, אל תסמן התאמה אם המגילה והחישוב הקאנוני מוצגים כשתי סמכויות מקבילות. הנוסח המקומי חייב למסור שהמגילה קובעת את הכללים, שהחישוב הקאנוני מפיק לפיהם את התאריך, וש-Seer אמור להחזיר אותה תשובה; מחלוקת עם חישוב קאנוני תקין היא טעות של Seer.
          הצע רק החלפות נקודתיות שנדרשות כדי להחיל את הדלתא הסמנטית.
          בשלב זה מותר לבדוק ולשנות רק את 12 המקטעים ששונו במאסטר העברי: about-calendar, months-and-weaving, calculation, structural-atlas, appointments, travel-and-all-day, seer, foundation-and-tablets, site-story, reverse-conversion, far-time-structure, sauce-history.
          אל תציע שינוי בשום stable section אחר, גם אם אתה מבחין שם בשיפור סגנוני אפשרי; תיקונים כאלה שייכים ל-native-language QA המאוחר.
          אל תתקן כאן בעיות לשון אחרות שאינן נדרשות לדלתא.
          אל תשנה נוסחאות, stable IDs, hashes, מספרים או ליטרלים טכניים.
          אל תשנה קבצים בעצמך. החזר רק patch טקסטואלי בפורמט הבא.

          אם הקובץ כבר תואם במלואו, החזר שורה אחת בלבד:
          SEMANTIC_DELTA_RESULT: ALREADY_ALIGNED

          אחרת השורה הראשונה חייבת להיות:
          SEMANTIC_DELTA_RESULT: CHANGED

          ואחריה בלוק אחד או יותר, ללא Markdown וללא הסבר:
          <<<REPLACEMENT>>>
          <<<OLD>>>
          קטע מדויק שקיים פעם אחת בלבד בקובץ היעד
          <<<NEW>>>
          הקטע החלופי הטבעי בשפת היעד
          <<<END>>>

          OLD חייב להיות שורה פיזית שלמה אחת שהעתקת ישירות מן הקובץ הנוכחי, byte-for-byte, כולל ה-HTML וההזחה שבאותה שורה.
          אל תשחזר OLD מן הזיכרון ואל תתרגם אותו. אתר את השורה בקובץ והעתק אותה בדיוק.
          NEW חייב להיות גם הוא שורה פיזית אחת, באותו תפקיד HTML, בשפת היעד ובניסוח טבעי.
          לפני הפלט ודא שכל OLD אכן מופיע פעם אחת בדיוק בקובץ היעד.
          אין להוסיף עברית או שפה זרה שאינה ליטרל טכני מחייב. אל תחזיר שום טקסט מחוץ לפורמט.
          EOF

            FINAL_ALIGNED=0
            for PASS in 1 2 3 4 5; do
              if [ "$PASS" -eq 1 ]; then
                cp "/tmp/$LOCALE.prompt.md" "/tmp/$LOCALE.pass$PASS.prompt.md"
              else
                {
                  cat <<EOF
          זהו סבב אימות חוזר אחרי שכבר הוחלו שינויים על $TARGET.
          אל תניח שהסבבים הקודמים היו מלאים. קרא מחדש את הקובץ במצבו הנוכחי ובדוק אחד־אחד את כל סעיפי הדלתא מול המאסטר העברי.
          הגבל את הבדיקה וההחלפות ל-12 המקטעים המותרים בלבד; אל תציע תיקון ב-summary או בכל stable section אחר בשלב זה.
          חפש במיוחד: מסגור מטא־בדיוני; „נקרא כאן”; הצגת 2.9976% כהסתברות כללית; ניסוח פגישות שמרמז על רגע מדויק; ניסוח all-day לא טבעי; witnesses; „סימן” של מניין המרחק; שגיאת התאמה דקדוקית בזוגות; וניסוחי צוות כגון „התוצאה נסגרה”.
          ב-Seer בדוק בנפרד ובקפדנות את שרשרת הסמכות: המגילה קובעת את הכללים; החישוב הקאנוני מפיק את התאריך לפי הכללים האלה; Seer אמור להחזיר אותה תשובה; ואם Seer חולק על חישוב קאנוני תקין, Seer טועה.
          אל תקבל כנוסח שקול ניסוח שמציג את המגילה ואת החישוב הקאנוני כשתי סמכויות מקבילות, כגון “the Scroll and the canonical calculation determine the correct date”.
          אם נותר פער כלשהו, החזר CHANGED עם החלפות מדויקות נוספות. רק אם כל הדלתא כבר מיושמת במלואה החזר ALREADY_ALIGNED.
          EOF
                  cat "/tmp/$LOCALE.prompt.md"
                } > "/tmp/$LOCALE.pass$PASS.prompt.md"
              fi

              set +e
              copilot --no-custom-instructions --no-ask-user --no-color \
                --allow-tool='shell(cat:*),shell(grep:*),shell(find:*),shell(sed:*),shell(head:*),shell(tail:*),shell(wc:*),shell(ls:*),shell(pwd:*),shell(rg:*),shell(awk:*),shell(sort:*),shell(uniq:*),shell(git status:*),shell(git diff:*),shell(git show:*),shell(git rev-parse:*)' \
                -s < "/tmp/$LOCALE.pass$PASS.prompt.md" > "/tmp/$LOCALE.pass$PASS.response.txt"
              EXIT=$?
              set -e
              if [ "$EXIT" -ne 0 ]; then
                echo "Semantic-delta pass $PASS failed for $LOCALE with exit $EXIT" >&2
                exit "$EXIT"
              fi

              cp "/tmp/$LOCALE.pass$PASS.response.txt" "artifacts/about-semantic-delta-runs/$LOCALE.pass$PASS.proposal.txt"
              PASS_VERDICT="$(node scripts/apply-about-semantic-delta.mjs \
                --file "$TARGET" \
                --response "/tmp/$LOCALE.pass$PASS.response.txt" \
                --report "artifacts/about-semantic-delta-runs/$LOCALE.pass$PASS.json")"
              echo "$LOCALE pass $PASS => $PASS_VERDICT"
              if [ "$PASS_VERDICT" = "ALREADY_ALIGNED" ]; then
                FINAL_ALIGNED=1
                break
              fi
            done

            if [ "$FINAL_ALIGNED" -ne 1 ]; then
              echo "$LOCALE did not reach ALREADY_ALIGNED within five semantic-delta passes" >&2
              exit 1
            fi

            LOCALE="$LOCALE" node <<'NODE'
          const fs=require("node:fs");
          const dir="artifacts/about-semantic-delta-runs";
          const reports=[];
          for(let pass=1;pass<=5;pass++){
            const path=`${dir}/${process.env.LOCALE}.pass${pass}.json`;
            if(fs.existsSync(path)) reports.push(JSON.parse(fs.readFileSync(path,"utf8")));
          }
          if(!reports.length) throw new Error("No semantic-delta reports");
          if(reports.at(-1).verdict!=="ALREADY_ALIGNED") throw new Error("Final semantic-delta pass is not ALREADY_ALIGNED");
          const result={
            verdict:reports.some((report)=>report.verdict==="CHANGED")?"CHANGED":"ALREADY_ALIGNED",
            final_verified_aligned:true,
            replacement_count:reports.reduce((sum,report)=>sum+report.replacement_count,0),
            touched_sections:[...new Set(reports.flatMap((report)=>report.touched_sections))],
            passes:reports.map((report)=>report.verdict)
          };
          fs.writeFileSync(`${dir}/${process.env.LOCALE}.json`,JSON.stringify(result,null,2)+"\n");
          NODE

            node --test test/about-page.test.js
            git diff --check
            AFTER_BLOB="$(git hash-object "$TARGET")"
            RESULT="$(node -p "require('./artifacts/about-semantic-delta-runs/$LOCALE.json').verdict")"

            LOCALE="$LOCALE" TARGET_TAG="$TARGET_TAG" BEFORE_BLOB="$BEFORE_BLOB" AFTER_BLOB="$AFTER_BLOB" RESULT="$RESULT" node <<'NODE'
          const fs=require("node:fs");
          const path="artifacts/about-semantic-delta-status.json";
          const data=fs.existsSync(path)?JSON.parse(fs.readFileSync(path,"utf8")):{schema_version:1,source:"docs/about/content/he.html",locales:{}};
          const detail=JSON.parse(fs.readFileSync(`artifacts/about-semantic-delta-runs/${process.env.LOCALE}.json`,"utf8"));
          data.locales[process.env.LOCALE]={
            locale_tag:process.env.TARGET_TAG,
            result:process.env.RESULT,
            final_verified_aligned:detail.final_verified_aligned===true,
            before_blob:process.env.BEFORE_BLOB,
            after_blob:process.env.AFTER_BLOB,
            replacement_count:detail.replacement_count,
            touched_sections:detail.touched_sections,
            passes:detail.passes
          };
          fs.writeFileSync(path,JSON.stringify(data,null,2)+"\n");
          NODE

            git add "$TARGET" "artifacts/about-semantic-delta-runs/$LOCALE.json" artifacts/about-semantic-delta-status.json
            git commit -m "about($LOCALE): apply semantic delta [skip ci]"
            for TRY in 1 2 3; do
              git fetch origin feature/about-i18n-72-locales
              if git rebase origin/feature/about-i18n-72-locales && git push origin HEAD:feature/about-i18n-72-locales; then
                break
              fi
              git rebase --abort || true
              if [ "$TRY" -eq 3 ]; then exit 1; fi
              sleep 3
            done
          done

      - name: Upload semantic-delta evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: about-semantic-delta-${{ github.run_id }}
          path: artifacts/about-semantic-delta-runs/
          if-no-files-found: warn
          retention-days: 14
