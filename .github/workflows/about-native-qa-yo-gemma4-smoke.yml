# repair workflow trigger v1
name: Yoruba confirmed-residue repair

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-yo-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yo-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/yo-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/yo-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/yo-gemma/llama.tar.gz -C /tmp/yo-gemma/llama
      - name: Qualify Yoruba reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/yo-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' -c 16384 -t 4 --host 127.0.0.1 --port 8080 > /tmp/yo-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"A kò lè mọ ọjọ́ yẹn. Ṣàyẹ̀wò pé gbogbo ààyè ti kun àti pé ọjọ́ náà wà nínú kalẹ́ńdà tí o yan.","expected":"OK"},{"id":"g2","text":"Ọjọ́ ìṣiṣẹ́ ni ibi tí ìṣirò ti bẹ̀rẹ̀.","expected":"OK"},{"id":"g3","text":"Kotleti tó ṣáájú","expected":"OK"},{"id":"g4","text":"Báwo ni mo ṣe lo ojúlé yìí?","expected":"OK"},{"id":"b1","text":"Click here kí o sì tẹ̀síwájú.","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"Tafadhali chagua tarehe hii.","expected":"FIX"},{"id":"b4","text":"Bawo ni mo ṣe lo website yii?","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="Ìwọ jẹ́ olootu abinibi tó muna fún Yorùbá àgbàdéédé òde òní. Ṣàyẹ̀wò ọkọọkan àwọn apá mẹ́jọ tó tẹ̀ lé lọ́tọ̀ọ̀tọ̀. Wo bó ṣe jẹ́ adayeba, gírámà, àti àwọn àṣẹku Gẹ̀ẹ́sì, Kiswahili tàbí èdè míì tí kò yẹ, pẹ̀lú àdàlù èdè. Àwọn ọ̀rọ̀ «ọjọ́ ìṣiṣẹ́», «ọjọ́ tí a ń béèrè», «kotleti» àti àwọn oṣù tó ń hun pọ̀ jẹ́ ọ̀rọ̀ domain tí a mọ̀ọ́mọ̀ lò. Return only JSON; verdict must be exactly OK or FIX."+"\\n\\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"yo_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/yo-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/yo-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          repair_cases=[{"id":"r1","location":"docs/about/content/yo.html#day-boundary","text":"Ọjọ́ Pastafari agbègbè kò yí padà ní ọ̀gànjọ́. Ààlà rẹ̀ ni topocentric lower meridian transit ti àárín Venus kọjá meridian agbègbè ń pinnu.","markers":["topocentric lower meridian transit"]},{"id":"r2","location":"docs/about/content/yo.html#day-boundary","text":"Nítorí náà, èyí jẹ́ ìṣẹ̀lẹ̀ ìràwọ̀ agbègbè tó dá lórí ibi. Transit náà kò pọn dandan kí ó ṣẹlẹ̀ ní 00:00, aago agbègbè ìjọba kò pinnu rẹ̀, kò yí padà torí daylight saving time bẹ̀rẹ̀ tàbí parí nìkan, kò sì nílò kí a lè rí Venus pẹ̀lú ojú lasan.","markers":["daylight saving time"]},{"id":"r3","location":"docs/about/content/yo.html#anniversaries","text":"Fún (orúkọ kotleti, ọjọ́ nínú kotleti), median jẹ́ ọdún 3; 88.89% ni a rí nínú ọdún 10, ṣùgbọ́n pinpin náà ní heavy tail tó wuwo gan-an, iye tó pọ̀ jù tí a sì rí dé ọdún Pastafari 51,954.","markers":["heavy tail"]},{"id":"r4","location":"docs/about/content/yo.html#far-time-structure","text":"nígbà náà, fún c kan náà, shift H_c, ìyípadà ọdún p_c, àti ààlà tó jìn tó wà, tí lẹ́yìn rẹ̀","markers":["shift"]},{"id":"r5","location":"docs/about/content/yo.html#short-and-wide-choice","text":"Kalẹ́ńdà fúnra rẹ̀ ṣì jẹ́ deterministiki patapata. “Choice” jẹ́ orúkọ ìpele algorithm, kì í ṣe lotiri tí a ń ṣe nígbà lílo.","markers":["algorithm"]},{"id":"r6","location":"docs/about/content/yo.html#structural-atlas","text":"Àwọn nọ́mbà wọ̀nyí ṣàlàyé corpus yẹn, kì í ṣe òfin kánónìkì.","markers":["corpus"]},{"id":"r7","location":"docs/about/content/yo.html#anniversaries","text":"Àwọn wọ̀nyí jẹ́ abajade ìdánwò corpus tí a ṣàyẹ̀wò, kì í ṣe ẹ̀rí pé gbogbo ọjọ́ ìrántí tó ṣeé ṣe gbọ́dọ̀ tún ṣẹlẹ̀, bẹ́ẹ̀ sì ni kì í ṣe ìlérí àkókò ìdúró tó pọ̀ jù.","markers":["corpus"]}]
          repair_ids=[x["id"] for x in repair_cases]
          repair_prompt="Àwọn apá wọ̀nyí ní àṣẹku èdè àjèjì tí a ti jẹ́rìí sí nínú àkọsílẹ̀ Yorùbá. Tún ọkọọkan kọ sí Yorùbá àgbàdéédé òde òní tó dára, kí o sì pa gbogbo ìtumọ̀, àwọn nọ́mbà, àwọn ọ̀rọ̀ Pastafari, àmì ìṣirò àti àwọn literal gidi bí Choice, Wide Choice, Short Choice, all-day, API/HTTP/CLI/OpenAPI/SIMD/SLA mọ́. Yọ àwọn marker tí a ti jẹ́rìí sí, kí o sì tún gírámà ṣe bí ó ṣe yẹ kí gbogbo gbolohun jẹ́ adayeba. Má ṣe kuru un, má sì sọ ìsọfúnni nù. Dá JSON nìkan padà."+"\\n\\n"+json.dumps(repair_cases,ensure_ascii=False)
          repair_schema={"type":"object","properties":{"repairs":{"type":"array","minItems":7,"maxItems":7,"items":{"type":"object","properties":{"id":{"type":"string","enum":repair_ids},"replacement":{"type":"string","minLength":1,"maxLength":1800}},"required":["id","replacement"],"additionalProperties":False}}},"required":["repairs"],"additionalProperties":False}
          repair_payload={"messages":[{"role":"user","content":repair_prompt}],"temperature":0.15,"top_p":0.9,"max_tokens":4200,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"yo_confirmed_residue_repair","strict":True,"schema":repair_schema}}}
          repair_req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(repair_payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(repair_req,timeout=2400) as resp: repair_data=json.load(resp)
          repair_raw=repair_data["choices"][0]["message"]["content"].strip()
          Path("/tmp/yo-gemma/repair-raw.json").write_text(repair_raw+"\\n",encoding="utf-8")
          repairs=json.loads(repair_raw).get("repairs",[])
          by_id={r.get("id"):r for r in repairs}; output=[]; bad=[]
          for x in repair_cases:
            r=by_id.get(x["id"],{}); repl=str(r.get("replacement","")).strip()
            ok=bool(repl) and repl!=x["text"] and not any(m.casefold() in repl.casefold() for m in x["markers"])
            if "{index}" in x["text"] and "{index}" not in repl: ok=False
            output.append({**x,"replacement":repl,"passed":ok})
            if not ok: bad.append(x["id"])
          Path("/tmp/yo-gemma/repair.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          if len(repairs)!=len(repair_cases) or len(by_id)!=len(repair_cases) or bad: raise SystemExit("repair validation failed: "+",".join(bad))
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yo-confirmed-residue-repair
          path: |
            /tmp/yo-gemma/qualification.json
            /tmp/yo-gemma/qualification-raw.json
            /tmp/yo-gemma/repair.json
            /tmp/yo-gemma/repair-raw.json
            /tmp/yo-gemma/server.log
          retention-days: 30
