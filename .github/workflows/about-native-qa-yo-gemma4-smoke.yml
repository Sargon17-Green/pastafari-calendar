# repair workflow trigger v1
name: Yoruba phrase-only residue repair

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-yo-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yo-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/yo-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/yo-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/yo-gemma/llama.tar.gz -C /tmp/yo-gemma/llama
      - name: Qualify Yoruba reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/yo-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-3-12b-it-GGUF:Q4_K_M -c 32768 -t 4 --host 127.0.0.1 --port 8080 > /tmp/yo-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 900); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"A kò lè mọ ọjọ́ yẹn. Ṣàyẹ̀wò pé gbogbo ààyè ti kun àti pé ọjọ́ náà wà nínú kalẹ́ńdà tí o yan.","expected":"OK"},{"id":"g2","text":"Ọjọ́ ìṣiṣẹ́ ni ibi tí ìṣirò ti bẹ̀rẹ̀.","expected":"OK"},{"id":"g3","text":"Kotleti tó ṣáájú","expected":"OK"},{"id":"g4","text":"Báwo ni mo ṣe lo ojúlé yìí?","expected":"OK"},{"id":"b1","text":"Click here kí o sì tẹ̀síwájú.","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"Tafadhali chagua tarehe hii.","expected":"FIX"},{"id":"b4","text":"Bawo ni mo ṣe lo website yii?","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="Ìwọ jẹ́ olootu abinibi tó muna fún Yorùbá àgbàdéédé òde òní. Ṣàyẹ̀wò ọkọọkan àwọn apá mẹ́jọ tó tẹ̀ lé lọ́tọ̀ọ̀tọ̀. Wo bó ṣe jẹ́ adayeba, gírámà, àti àwọn àṣẹku Gẹ̀ẹ́sì, Kiswahili tàbí èdè míì tí kò yẹ, pẹ̀lú àdàlù èdè. Àwọn ọ̀rọ̀ «ọjọ́ ìṣiṣẹ́», «ọjọ́ tí a ń béèrè», «kotleti» àti àwọn oṣù tó ń hun pọ̀ jẹ́ ọ̀rọ̀ domain tí a mọ̀ọ́mọ̀ lò. Return only JSON; verdict must be exactly OK or FIX."+"\\n\\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"yo_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/yo-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/yo-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          phrase_cases=[{"id":"p1","source_phrase":"topocentric lower meridian transit","context":"Ààlà rẹ̀ ni topocentric lower meridian transit ti àárín Venus kọjá meridian agbègbè ń pinnu.","meaning":"astronomical term: the topocentric lower-meridian transit of the center of Venus across the local meridian","forbidden":["topocentric","lower meridian transit"]},{"id":"p2","source_phrase":"daylight saving time","context":"kò yí padà torí daylight saving time bẹ̀rẹ̀ tàbí parí nìkan","meaning":"daylight-saving time, the civil clock convention","forbidden":["daylight saving time"]},{"id":"p3","source_phrase":"heavy tail","context":"pinpin náà ní heavy tail tó wuwo gan-an","meaning":"statistical heavy tail of a probability/distribution","forbidden":["heavy tail"]},{"id":"p4","source_phrase":"shift","context":"fún c kan náà, shift H_c, ìyípadà ọdún p_c","meaning":"mathematical shift/offset size H_c, a noun naming a fixed displacement","forbidden":["shift"]},{"id":"p5","source_phrase":"algorithm","context":"“Choice” jẹ́ orúkọ ìpele algorithm","meaning":"algorithm; the phrase means 'stage of the algorithm'","forbidden":["algorithm"]},{"id":"p6","source_phrase":"corpus","context":"Àwọn nọ́mbà wọ̀nyí ṣàlàyé corpus yẹn","meaning":"the tested computational corpus/data set","forbidden":["corpus"]},{"id":"p7","source_phrase":"corpus","context":"abajade ìdánwò corpus tí a ṣàyẹ̀wò","meaning":"the corpus/data set that was tested","forbidden":["corpus"]}]
          phrase_ids=[x["id"] for x in phrase_cases]
          phrase_prompt="Ìwọ jẹ́ olootu abinibi Yorùbá àgbàdéédé òde òní. Ọ̀kọ̀ọ̀kan àwọn case yìí ní gbolohun Gẹ̀ẹ́sì kékeré kan tí ó kù nínú àkọsílẹ̀ Yorùbá. Dá padà KÌKÌ ọrọ̀ Yorùbá kékeré tí yóò rọ́pò source_phrase ní ibi náà, láì tún gbogbo gbolohun kọ. Pa ìtumọ̀ imọ̀ sáyẹ́ǹsì/mathematiki tí a ṣàlàyé mọ́. Má ṣe fi àlàyé, àkíyèsí, parentheses tàbí Gẹ̀ẹ́sì kun un. Awọn literal domain bí Choice, H_c, p_c, Venus àti Pastafari wà níta source_phrase tí a kò gbọdọ̀ yí."+"\\n\\n"+json.dumps(phrase_cases,ensure_ascii=False)
          phrase_schema={"type":"object","properties":{"repairs":{"type":"array","minItems":7,"maxItems":7,"items":{"type":"object","properties":{"id":{"type":"string","enum":phrase_ids},"replacement":{"type":"string","minLength":1,"maxLength":180}},"required":["id","replacement"],"additionalProperties":False}}},"required":["repairs"],"additionalProperties":False}
          phrase_payload={"messages":[{"role":"user","content":phrase_prompt}],"temperature":0.0,"max_tokens":1200,"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"yo_phrase_residue_repair","strict":True,"schema":phrase_schema}}}
          phrase_req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(phrase_payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(phrase_req,timeout=2400) as resp: phrase_data=json.load(resp)
          phrase_raw=phrase_data["choices"][0]["message"]["content"].strip()
          Path("/tmp/yo-gemma/repair-raw.json").write_text(phrase_raw+"\n",encoding="utf-8")
          repairs=json.loads(phrase_raw).get("repairs",[])
          by_id={r.get("id"):r for r in repairs}; output=[]; bad=[]
          for x in phrase_cases:
            r=by_id.get(x["id"],{}); repl=str(r.get("replacement","")).strip()
            ok=bool(repl) and repl.casefold()!=x["source_phrase"].casefold() and "\n" not in repl and len(repl)<=180
            if any(term.casefold() in repl.casefold() for term in x["forbidden"]): ok=False
            output.append({**x,"replacement":repl,"passed":ok})
            if not ok: bad.append(x["id"])
          Path("/tmp/yo-gemma/repair.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(repairs)!=len(phrase_cases) or len(by_id)!=len(phrase_cases) or bad: raise SystemExit("phrase repair validation failed: "+",".join(bad))
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yo-confirmed-residue-repair
          path: |
            /tmp/yo-gemma/qualification.json
            /tmp/yo-gemma/qualification-raw.json
            /tmp/yo-gemma/repair.json
            /tmp/yo-gemma/repair-raw.json
            /tmp/yo-gemma/server.log
          retention-days: 30
