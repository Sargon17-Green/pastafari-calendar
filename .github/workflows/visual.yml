name: visual

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      capture_baselines:
        description: Generate reviewed baseline candidates as an artifact; never commit automatically
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      visual_regression: ${{ steps.classify.outputs.visual_regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-classifier.mjs --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  visual-regression:
    needs: changes
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.capture_baselines != true) && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.visual_regression == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - name: Install pinned Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Verify visual-suite files
        run: sha256sum -c test/visual/SHA256SUMS.txt
      - name: Prove artificial visual regression is detected
        run: npm run test:visual:self-test
      - name: Run visual and responsive regression suite
        run: npm run test:visual
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14

  capture-baselines:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_baselines == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify visual-suite files
        run: sha256sum -c test/visual/SHA256SUMS.txt
      - name: Prove artificial visual regression is detected
        run: npm run test:visual:self-test
      - name: Capture stability-measured baseline candidates
        env:
          PASTAFARI_ALLOW_VISUAL_UPDATE: '1'
          PASTAFARI_VISUAL_CANONICAL: '1'
        run: npm run test:visual:update
      - name: Upload baseline candidates for human review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baseline-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test/visual/baselines/
            test/visual/baseline-metadata.json
            artifacts/visual/report.json
          if-no-files-found: error
          retention-days: 14
