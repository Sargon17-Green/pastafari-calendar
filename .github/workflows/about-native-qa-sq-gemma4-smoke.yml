# repair workflow trigger v1
name: Albanian phrase-only residue repair

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-sq-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sq-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/sq-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/sq-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sq-gemma/llama.tar.gz -C /tmp/sq-gemma/llama
      - name: Qualify Albanian reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/sq-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-3-12b-it-GGUF:Q4_K_M -c 32768 -t 4 --host 127.0.0.1 --port 8080 > /tmp/sq-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 900); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"Ajo datë nuk mund të njihej. Kontrolloni që çdo fushë të jetë plotësuar dhe që data të ekzistojë në kalendarin e zgjedhur.","expected":"OK"},{"id":"g2","text":"Dita e veprimit është pika e nisjes së llogaritjes.","expected":"OK"},{"id":"g3","text":"Kotleta e mëparshme","expected":"OK"},{"id":"g4","text":"Si përdoret kjo faqe?","expected":"OK"},{"id":"b1","text":"Click here dhe vazhdo.","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"Seleziona questa data.","expected":"FIX"},{"id":"b4","text":"Kako se koristi ova stranica?","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="Jeni redaktor i rreptë amtare i shqipes standarde bashkëkohore. Vlerësoni veçmas secilin nga tetë fragmentet e mëposhtme. Kontrolloni natyrshmërinë, gramatikën dhe mbetjet e paqëllimshme të anglishtes, italishtes, serbishtes ose gjuhës së përzier. Termat «dita e veprimit», «dita e pyetur», «kotleta» dhe muajt e ndërthurur janë terma të qëllimshëm të domenit. Return only JSON; verdict must be exactly OK or FIX."+"\\n\\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"sq_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/sq-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/sq-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          phrase_cases=[{"id":"p1","source_phrase":"versioni default","context":"... ndaj po shfaqet versioni default.","meaning":"the default/fallback version shown because the selected-language explanation is unavailable","forbidden":["default"]},{"id":"p2","source_phrase":"mechanism","context":"Salca duket si një mechanism shumë agresiv përzierjeje","meaning":"mechanism","forbidden":["mechanism"]},{"id":"p3","source_phrase":"short random","context":"“Choice” është emri i një faze algoritmike, jo një short random gjatë përdorimit.","meaning":"a random draw / lottery held at runtime; the sentence says Choice is an algorithm stage, not such a lottery","forbidden":["random"]},{"id":"p4","source_phrase":"location/day-boundary","context":"konteksti përkatës i location/day-boundary","meaning":"location/day-boundary context: the relevant location and local day-boundary context","forbidden":["location/day-boundary"]},{"id":"p5","source_phrase":"flag-u","context":"jo vetëm flag-u all-day","meaning":"flag/checkbox/indicator; return only the Albanian noun that can directly precede the unchanged literal all-day in this context","forbidden":["flag"]},{"id":"p6","source_phrase":"Transit","context":"Transit nuk ka pse të ndodhë në 00:00","meaning":"the astronomical transit/passage event defined in the previous sentence","forbidden":["transit"]}]
          phrase_ids=[x["id"] for x in phrase_cases]
          phrase_prompt="Jeni redaktor amtare i shqipes standarde moderne. Çdo rast jep vetëm një frazë të huaj që duhet zëvendësuar brenda kontekstit ekzistues shqip. Ktheni vetëm frazën e shkurtër zëvendësuese në shqip që përshtatet gramatikisht pikërisht aty dhe ruan kuptimin teknik të dhënë. Mos rishkruani fjalinë e plotë, mos shpjegoni dhe mos shtoni kllapa. Literali all-day duhet të mbetet i pandryshuar kur nuk është pjesë e source_phrase."+"\\n\\n"+json.dumps(phrase_cases,ensure_ascii=False)
          phrase_schema={"type":"object","properties":{"repairs":{"type":"array","minItems":6,"maxItems":6,"items":{"type":"object","properties":{"id":{"type":"string","enum":phrase_ids},"replacement":{"type":"string","minLength":1,"maxLength":160}},"required":["id","replacement"],"additionalProperties":False}}},"required":["repairs"],"additionalProperties":False}
          phrase_payload={"messages":[{"role":"user","content":phrase_prompt}],"temperature":0.0,"max_tokens":1200,"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"sq_phrase_residue_repair","strict":True,"schema":phrase_schema}}}
          phrase_req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(phrase_payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(phrase_req,timeout=2400) as resp: phrase_data=json.load(resp)
          phrase_raw=phrase_data["choices"][0]["message"]["content"].strip()
          Path("/tmp/sq-gemma/repair-raw.json").write_text(phrase_raw+"\n",encoding="utf-8")
          repairs=json.loads(phrase_raw).get("repairs",[])
          by_id={r.get("id"):r for r in repairs}; output=[]; bad=[]
          for x in phrase_cases:
            r=by_id.get(x["id"],{}); repl=str(r.get("replacement","")).strip()
            ok=bool(repl) and repl.casefold()!=x["source_phrase"].casefold() and "\n" not in repl and len(repl)<=160
            if any(term.casefold() in repl.casefold() for term in x["forbidden"]): ok=False
            output.append({**x,"replacement":repl,"passed":ok})
            if not ok: bad.append(x["id"])
          Path("/tmp/sq-gemma/repair.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(repairs)!=len(phrase_cases) or len(by_id)!=len(phrase_cases) or bad: raise SystemExit("phrase repair validation failed: "+",".join(bad))
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sq-confirmed-residue-repair
          path: |
            /tmp/sq-gemma/qualification.json
            /tmp/sq-gemma/qualification-raw.json
            /tmp/sq-gemma/repair.json
            /tmp/sq-gemma/repair-raw.json
            /tmp/sq-gemma/server.log
          retention-days: 30
