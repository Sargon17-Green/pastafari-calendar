name: Hindi strict native-language whole-site gate

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths:
      - .github/workflows/about-native-qa-hi-strict-gate.yml
      - docs/i18n/locales/hi.js
      - docs/about/content/hi.html
      - docs/manifest.webmanifest
      - docs/i18n/registry.js

permissions:
  contents: read

concurrency:
  group: hi-strict-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-hi:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 1}
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hi-strict/llama /tmp/hi-strict/evidence
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/hi-strict/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/hi-strict/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hi-strict/llama.tar.gz -C /tmp/hi-strict/llama
          git rev-parse HEAD > /tmp/hi-strict/evidence/reviewed-head.txt
      - name: Extract grounded Hindi website corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re
          items=[]
          locale=Path("docs/i18n/locales/hi.js").read_text(encoding="utf-8")
          for key,raw in re.findall(r'"([^"]+)"\s*:\s*("(?:\\.|[^"\\])*")',locale):
            try: value=json.loads(raw)
            except Exception: continue
            if isinstance(value,str) and value.strip() and key not in {"code","dir","intlLocale"}:
              items.append({"location":f"docs/i18n/locales/hi.js#{key}","text":value.strip()})
          class P(HTMLParser):
            wanted={"p","li","h1","h2","h3","h4","h5","h6","th","td","caption","blockquote"}; attrs={"aria-label","aria-description","title","alt"}
            def __init__(self): super().__init__(convert_charrefs=True); self.sections=[]; self.current=None; self.n=0
            def handle_starttag(self,tag,attrs):
              attrs=dict(attrs)
              if tag=="br" and self.current is not None: self.current["parts"].append(". ")
              if tag=="section": self.sections.append(attrs.get("id",""))
              sec=next((x for x in reversed(self.sections) if x),""); ident=attrs.get("id") or sec or tag
              for a in self.attrs:
                v=attrs.get(a)
                if v and v.strip(): items.append({"location":f"docs/about/content/hi.html#{ident}@{a}-{self.n}","text":v.strip()}); self.n+=1
              if tag in self.wanted: self.current={"tag":tag,"id":attrs.get("id",""),"section":sec,"parts":[]}
            def handle_endtag(self,tag):
              if self.current is not None and self.current["tag"]==tag:
                txt=re.sub(r"\s+"," ","".join(self.current["parts"])).strip()
                if txt:
                  ident=self.current["id"] or self.current["section"] or self.current["tag"]
                  items.append({"location":f"docs/about/content/hi.html#{ident}","text":txt})
                self.current=None
              if tag=="section" and self.sections: self.sections.pop()
            def handle_data(self,data):
              if self.current is not None: self.current["parts"].append(data)
          p=P(); p.feed(Path("docs/about/content/hi.html").read_text(encoding="utf-8"))
          manifest=json.loads(Path("docs/manifest.webmanifest").read_text(encoding="utf-8"))
          for field in ("name_localized","short_name_localized","description_localized"):
            v=manifest.get(field,{}).get("hi",{}).get("value")
            if isinstance(v,str) and v.strip(): items.append({"location":f"docs/manifest.webmanifest#{field}.hi.value","text":v.strip()})
          registry=Path("docs/i18n/registry.js").read_text(encoding="utf-8")
          m=re.search(r'defineLocale\("hi",\s*"([^"]+)"',registry)
          if m: items.append({"location":"docs/i18n/registry.js#locale-hi-display-name","text":m.group(1)})
          seen=set(); out=[]
          for item in items:
            pair=(item["location"],item["text"])
            if pair in seen: continue
            seen.add(pair); item["id"]=f"HI{len(out):04d}"; out.append(item)
          Path("/tmp/hi-strict/evidence/items.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          compact=json.dumps(out,ensure_ascii=False,separators=(",",":")); Path("/tmp/hi-strict/corpus.json").write_text(compact,encoding="utf-8")
          if len(compact)>100000: raise SystemExit("corpus exceeds review budget")
          PY
      - name: Start isolated Hindi Gemma 4 reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/hi-strict/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' -c 32768 -t 4 --host 127.0.0.1 --port 8080 > /tmp/hi-strict/evidence/server.log 2>&1 &
          echo "$!" > /tmp/hi-strict/server.pid
          for _ in $(seq 1 900); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health >/dev/null
      - name: Batched hidden Hindi reviewer qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"एक तारीख चुनें और फिर प्रयास करें।","expected":"स्वाभाविक"},{"id":"g2","text":"कार्य-दिन गणना का प्रारंभ-बिंदु है।","expected":"स्वाभाविक"},{"id":"g3","text":"पिछली कटलेट","expected":"स्वाभाविक"},{"id":"g4","text":"महीने पूरे वर्ष आपस में बुने हो सकते हैं।","expected":"स्वाभाविक"},{"id":"b1","text":"Click here करके आगे बढ़ें।","expected":"सुधारें"},{"id":"b2","text":"working day बदलें।","expected":"सुधारें"},{"id":"b3","text":"Cambiar el día de trabajo.","expected":"सुधारें"},{"id":"b4","text":"Как пользоваться इस साइटом?","expected":"सुधारें"}]
          ids=[x["id"] for x in cases]
          prompt="आप आधुनिक मानक हिन्दी के कठोर मातृभाषी संपादक हैं। स्वाभाविकता, व्याकरण और अंग्रेज़ी, स्पेनी, रूसी या मिश्रित भाषा के अनचाहे अंश जाँचें। ‘कार्य-दिन’, ‘पूछा गया दिन’, ‘कटलेट’ और परस्पर बुने महीने जानबूझकर प्रयुक्त क्षेत्र-शब्द हैं। केवल JSON लौटाएँ। प्रत्येक id के लिए verdict ठीक स्वाभाविक या सुधारें होना चाहिए।"+"\n\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["स्वाभाविक","सुधारें"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"hi_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ev=Path("/tmp/hi-strict/evidence"); ev.joinpath("qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          ds=json.loads(raw).get("decisions",[]); actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          ev.joinpath("qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          PY
      - name: Strict whole-site Hindi review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          ev=Path("/tmp/hi-strict/evidence"); items=json.loads(ev.joinpath("items.json").read_text(encoding="utf-8")); by={}
          for item in items: by.setdefault(item["location"],[]).append(item["text"])
          prompt="आप पास्ताफ़ारी कैलेंडर के हिन्दी संस्करण के लिए स्वतंत्र, कठोर और मातृभाषी भाषा-संपादक हैं। पूरे दृश्य और accessibility-facing पाठ को एक ही भाषिक अनुभव के रूप में जाँचें। अंग्रेज़ी, स्पेनी, रूसी या अन्य भाषा के अवशेष, अनुवाद-कल्क, अप्राकृतिक हिन्दी तथा व्याकरण, वर्तनी, विराम और पारिभाषिक समस्याएँ खोजें; metadata, manifest और accessibility पाठ भी शामिल हैं। हिन्दी गद्य में सामान्य अंग्रेज़ी तकनीकी शब्द findings हैं, जब तक वे वास्तविक technical literal या proper name न हों। ‘कार्य-दिन’, ‘पूछा गया दिन’, ‘कटलेट’ और परस्पर बुने महीने जानबूझकर प्रयुक्त क्षेत्र-शब्द हैं। सूत्र, API/endpoint नाम, code literals, hashes, HTTP, CLI, OpenAPI, SIMD, SLA, all-day, Short Choice और Wide Choice रह सकते हैं। हर finding में दिया गया सटीक location इस्तेमाल हो और current_text उसी स्थान की शब्दशः लगातार substring हो। correction current_text से अलग हो। manifest के मूल fallback और bootstrap data-i18n source values तब findings नहीं हैं जब localized/runtime value सही हो। केवल वास्तविक समस्याएँ बताएं। यदि कोई समस्या नहीं बचती तो खाली findings के साथ CLEAN लौटाएँ। केवल JSON लौटाएँ।"+"\n\nWEBSITE_TEXT_ITEMS_JSON:\n"+Path("/tmp/hi-strict/corpus.json").read_text(encoding="utf-8")
          schema={"type":"object","properties":{"result":{"type":"string","enum":["CLEAN","FINDINGS"]},"findings":{"type":"array","maxItems":14,"items":{"type":"object","properties":{"severity":{"type":"string","enum":["critical","high","medium","low"]},"location":{"type":"string"},"current_text":{"type":"string","minLength":1,"maxLength":280},"issue":{"type":"string","minLength":15,"maxLength":420},"correction":{"type":"string","minLength":2,"maxLength":420}},"required":["severity","location","current_text","issue","correction"],"additionalProperties":False}}},"required":["result","findings"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.05,"top_p":0.85,"max_tokens":1900,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"hi_whole_site_review","strict":True,"schema":schema}}}
          accepted=None
          for attempt in (1,2):
            payload["messages"]=[{"role":"user","content":prompt if attempt==1 else prompt}]
            req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
            with urllib.request.urlopen(req,timeout=3600) as resp: data=json.load(resp)
            raw=data["choices"][0]["message"]["content"].strip(); ev.joinpath(f"raw-review-attempt-{attempt}.json").write_text(raw+"\n",encoding="utf-8")
            try: p=json.loads(raw)
            except Exception: continue
            result=p.get("result"); findings=p.get("findings")
            if result not in {"CLEAN","FINDINGS"} or not isinstance(findings,list) or (result=="CLEAN" and findings) or (result=="FINDINGS" and not findings): continue
            seen=set(); good=True
            for f in findings:
              loc=str(f.get("location","")).strip(); cur=str(f.get("current_text","")).strip(); corr=str(f.get("correction","")).strip()
              if loc not in by or not cur or not any(cur in t for t in by[loc]) or cur==corr or (loc,cur) in seen: good=False; break
              seen.add((loc,cur))
            if good: accepted=p; break
          if accepted is None: raise SystemExit("review invalid")
          final_result="PASS" if accepted["result"]=="CLEAN" else "FAIL"
          final={"result":final_result,"reviewed_head":ev.joinpath("reviewed-head.txt").read_text().strip(),"findings":accepted["findings"]}
          ev.joinpath("final.json").write_text(json.dumps(final,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          lines=[f"NATIVE_QA_RESULT: {final_result}","","हिन्दी के पूरे साइट की कठोर भाषिक समीक्षा में ऐसा कोई पुष्ट समस्या नहीं मिली जिसे सुधार की आवश्यकता हो।" if final_result=="PASS" else "हिन्दी के पूरे साइट की कठोर भाषिक समीक्षा में सुधार की आवश्यकता वाली पुष्ट समस्याएँ मिलीं।",""]
          if final_result=="FAIL":
            for i,f in enumerate(accepted["findings"],1): lines += [f"### {i}. {f['severity']}","",f["location"],"",f"> {f['current_text']}","",f["issue"],"","Correction: "+f["correction"],""]
          ev.joinpath("review.md").write_text("\n".join(lines).rstrip()+"\n",encoding="utf-8")
          PY
      - name: Verify verdict
        shell: bash
        run: |
          set -euo pipefail
          head -n 1 /tmp/hi-strict/evidence/review.md | grep -Eq '^NATIVE_QA_RESULT: (PASS|FAIL)$'
      - name: Stop reviewer
        if: always()
        shell: bash
        run: |
          [ ! -f /tmp/hi-strict/server.pid ] || kill "$(cat /tmp/hi-strict/server.pid)" 2>/dev/null || true
      - name: Upload strict Hindi evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hi-strict-native-whole-site
          path: /tmp/hi-strict/evidence/
          if-no-files-found: warn
          retention-days: 90
