name: Greek strict native-language whole-site gate

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-el-strict-gate.yml
      - docs/i18n/locales/el.js
      - docs/about/content/el.html
      - docs/manifest.webmanifest
      - docs/i18n/registry.js

permissions:
  contents: read

concurrency:
  group: greek-strict-native-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-el:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/el-strict/llama /tmp/el-strict/evidence
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/el-strict/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/el-strict/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/el-strict/llama.tar.gz -C /tmp/el-strict/llama
          git rev-parse HEAD > /tmp/el-strict/evidence/reviewed-head.txt

      - name: Extract grounded Greek website corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re

          items=[]

          locale=Path("docs/i18n/locales/el.js").read_text(encoding="utf-8")
          for key, raw in re.findall(r'"([^"]+)"\s*:\s*("(?:\\.|[^"\\])*")', locale):
              try:
                  value=json.loads(raw)
              except Exception:
                  continue
              if not isinstance(value,str) or not value.strip():
                  continue
              if key in {"code","dir","intlLocale"}:
                  continue
              items.append({"location":f"docs/i18n/locales/el.js#{key}","text":value.strip()})

          class Parser(HTMLParser):
              wanted={"p","li","h1","h2","h3","h4","h5","h6","th","td","caption","blockquote"}
              attrs_wanted={"aria-label","aria-description","title","alt"}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.sections=[]
                  self.current=None
                  self.attr_counter=0
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=="br" and self.current is not None:
                      self.current["parts"].append(". ")
                  if tag=="section":
                      self.sections.append(attrs.get("id",""))
                  section=next((x for x in reversed(self.sections) if x),"")
                  ident=attrs.get("id") or section or tag
                  for name in self.attrs_wanted:
                      value=attrs.get(name)
                      if value and value.strip():
                          items.append({
                              "location":f"docs/about/content/el.html#{ident}@{name}-{self.attr_counter}",
                              "text":value.strip()
                          })
                          self.attr_counter+=1
                  if tag in self.wanted:
                      self.current={"tag":tag,"id":attrs.get("id",""),"section":section,"parts":[]}
              def handle_endtag(self,tag):
                  if self.current is not None and self.current["tag"]==tag:
                      text=re.sub(r"\s+"," ","".join(self.current["parts"])).strip()
                      if text:
                          ident=self.current["id"] or self.current["section"] or self.current["tag"]
                          items.append({"location":f"docs/about/content/el.html#{ident}","text":text})
                      self.current=None
                  if tag=="section" and self.sections:
                      self.sections.pop()
              def handle_data(self,data):
                  if self.current is not None:
                      self.current["parts"].append(data)

          parser=Parser()
          parser.feed(Path("docs/about/content/el.html").read_text(encoding="utf-8"))

          manifest=json.loads(Path("docs/manifest.webmanifest").read_text(encoding="utf-8"))
          for field in ("name_localized","short_name_localized","description_localized"):
              value=manifest.get(field,{}).get("el",{}).get("value")
              if isinstance(value,str) and value.strip():
                  items.append({"location":f"docs/manifest.webmanifest#{field}.el.value","text":value.strip()})

          registry=Path("docs/i18n/registry.js").read_text(encoding="utf-8")
          m=re.search(r'defineLocale\("el",\s*"([^"]+)"',registry)
          if m:
              items.append({"location":"docs/i18n/registry.js#locale-el-display-name","text":m.group(1)})

          seen=set(); out=[]
          for item in items:
              pair=(item["location"],item["text"])
              if pair in seen:
                  continue
              seen.add(pair)
              item["id"]=f"EL{len(out):04d}"
              out.append(item)

          Path("/tmp/el-strict/evidence/items.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          compact=json.dumps(out,ensure_ascii=False,separators=(",",":"))
          Path("/tmp/el-strict/corpus.json").write_text(compact,encoding="utf-8")
          print(f"items={len(out)} chars={len(compact)}")
          if len(compact)>100000:
              raise SystemExit("Greek corpus unexpectedly exceeds one-shot review budget")
          PY

      - name: Start isolated Greek Gemma 4 reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/el-strict/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 \
            --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' \
            -c 32768 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/el-strict/evidence/server.log 2>&1 &
          echo "$!" > /tmp/el-strict/server.pid
          for _ in $(seq 1 900); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

      - name: Batched hidden Greek reviewer qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request
          cases=[
            {"id":"g1","text":"Επιλέξτε μια ημερομηνία και δοκιμάστε ξανά.","expected":"ΦΥΣΙΚΟ"},
            {"id":"g2","text":"Η ημέρα πράξης είναι το σημείο εκκίνησης του υπολογισμού.","expected":"ΦΥΣΙΚΟ"},
            {"id":"g3","text":"Προηγούμενη κοτολέτα","expected":"ΦΥΣΙΚΟ"},
            {"id":"g4","text":"Οι μήνες μπορούν να πλέκονται μεταξύ τους μέσα στο έτος.","expected":"ΦΥΣΙΚΟ"},
            {"id":"b1","text":"Αλλάξτε την working day.","expected":"ΔΙΟΡΘΩΣΗ"},
            {"id":"b2","text":"Click here για να συνεχίσετε.","expected":"ΔΙΟΡΘΩΣΗ"},
            {"id":"b3","text":"В этом году υπάρχουν πολλοί μήνες.","expected":"ΔΙΟΡΘΩΣΗ"},
            {"id":"b4","text":"Πώς χρησιμοποιώ this website;","expected":"ΔΙΟΡΘΩΣΗ"}]
          ids=[c["id"] for c in cases]
          prompt="Είσαι αυστηρός επιμελητής σύγχρονων ελληνικών. Έλεγξε φυσικότητα, γραμματική και ακούσια ξένη ή μικτή γλώσσα. Οι όροι ημέρα πράξης, ζητούμενη ημέρα, κοτολέτα και πλεγμένοι μήνες είναι σκόπιμοι. Επέστρεψε μόνο JSON με verdict ΦΥΣΙΚΟ ή ΔΙΟΡΘΩΣΗ.\n\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["ΦΥΣΙΚΟ","ΔΙΟΡΘΩΣΗ"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"el_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ev=Path("/tmp/el-strict/evidence")
          ev.joinpath("qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          decisions=json.loads(raw).get("decisions",[]); actual={d["id"]:d["verdict"] for d in decisions}
          results=[]; failed=[]
          for c in cases:
            ok=actual.get(c["id"])==c["expected"]; results.append({**c,"actual":actual.get(c["id"]),"passed":ok})
            if not ok: failed.append(c["id"])
          ev.joinpath("qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if len(decisions)!=8 or failed: raise SystemExit("Greek qualification failed")
          PY

      - name: Strict whole-site Greek review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request
          ev=Path("/tmp/el-strict/evidence"); items=json.loads(ev.joinpath("items.json").read_text(encoding="utf-8"))
          by_location={}
          for item in items: by_location.setdefault(item["location"],[]).append(item["text"])
          prompt=("Είσαι ανεξάρτητος αυστηρός επιμελητής φυσικού ομιλητή για την ελληνική έκδοση. Έλεγξε όλο το ορατό και accessibility-facing κείμενο. "
                  "Αναζήτησε ξένες διαρροές, καλκ, αφύσικα ελληνικά, γραμματικά, συντακτικά, ορθογραφικά και ορολογικά προβλήματα, metadata, manifest και accessibility. "
                  "Συνηθισμένες αγγλικές λέξεις μέσα σε ελληνική πρόζα είναι finding εκτός αν είναι προστατευμένο τεχνικό literal/κύριο όνομα. "
                  "Οι όροι ημέρα πράξης, ζητούμενη ημέρα, κοτολέτα και πλεγμένοι μήνες είναι σκόπιμοι. Formulas, API/endpoint names, code literals, hashes, HTTP, CLI, OpenAPI, SIMD, SLA, all-day, Short Choice, Wide Choice επιτρέπονται. "
                  "current_text πρέπει να είναι ακριβές substring στο location, correction διαφορετική. Manifest base fallback και bootstrap data-i18n δεν είναι finding αν η localized/runtime τιμή είναι σωστή. "
                  "Αν δεν υπάρχει πραγματικό πρόβλημα, CLEAN με κενό findings. Μόνο JSON.\n\nWEBSITE_TEXT_ITEMS_JSON:\n"+Path("/tmp/el-strict/corpus.json").read_text(encoding="utf-8"))
          schema={"type":"object","properties":{"result":{"type":"string","enum":["CLEAN","FINDINGS"]},"findings":{"type":"array","maxItems":14,"items":{"type":"object","properties":{"severity":{"type":"string","enum":["critical","high","medium","low"]},"location":{"type":"string"},"current_text":{"type":"string","minLength":1,"maxLength":280},"issue":{"type":"string","minLength":15,"maxLength":420},"correction":{"type":"string","minLength":2,"maxLength":420}},"required":["severity","location","current_text","issue","correction"],"additionalProperties":False}}},"required":["result","findings"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.05,"top_p":0.85,"max_tokens":1900,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"el_whole_site_review","strict":True,"schema":schema}}}
          accepted=None; last_error=""
          for attempt in (1,2):
            payload["messages"]=[{"role":"user","content":prompt if attempt==1 else prompt+"\n\nΜΗΧΑΝΙΚΗ_ΕΠΑΝΑΛΗΨΗ=TRUE"}]
            req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
            with urllib.request.urlopen(req,timeout=3600) as resp: data=json.load(resp)
            raw=data["choices"][0]["message"]["content"].strip(); ev.joinpath(f"raw-review-attempt-{attempt}.json").write_text(raw+"\n",encoding="utf-8")
            try: parsed=json.loads(raw)
            except Exception: continue
            result=parsed.get("result"); findings=parsed.get("findings")
            if result not in {"CLEAN","FINDINGS"} or not isinstance(findings,list) or (result=="CLEAN" and findings) or (result=="FINDINGS" and not findings): continue
            seen=set(); good=True
            for f in findings:
              loc=str(f.get("location","")).strip(); cur=str(f.get("current_text","")).strip(); corr=str(f.get("correction","")).strip()
              if loc not in by_location or not cur or not any(cur in x for x in by_location[loc]) or cur==corr or (loc,cur) in seen: good=False; break
              seen.add((loc,cur))
            if good: accepted=parsed; break
          if accepted is None: raise SystemExit("Greek review invalid")
          final_result="PASS" if accepted["result"]=="CLEAN" else "FAIL"
          final={"result":final_result,"reviewed_head":ev.joinpath("reviewed-head.txt").read_text().strip(),"findings":accepted["findings"]}
          ev.joinpath("final.json").write_text(json.dumps(final,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          lines=[f"NATIVE_QA_RESULT: {final_result}",""]
          if final_result=="PASS": lines+=["Η αυστηρή ελληνική whole-site γλωσσική επιθεώρηση δεν βρήκε επιβεβαιωμένο πρόβλημα που χρειάζεται διόρθωση.",""]
          else:
            lines+=["Η αυστηρή ελληνική whole-site γλωσσική επιθεώρηση βρήκε επιβεβαιωμένα προβλήματα που χρειάζονται διόρθωση.",""]
            for i,f in enumerate(accepted["findings"],1): lines += [f"### {i}. {f['severity']}","",f["location"],"",f"> {f['current_text']}","",f["issue"],"","Προτεινόμενη διόρθωση: "+f["correction"],""]
          ev.joinpath("review.md").write_text("\n".join(lines).rstrip()+"\n",encoding="utf-8")
          PY

      - name: Verify verdict
        shell: bash
        run: |
          set -euo pipefail
          head -n 1 /tmp/el-strict/evidence/review.md | grep -Eq '^NATIVE_QA_RESULT: (PASS|FAIL)$'

      - name: Stop reviewer
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/el-strict/server.pid ]; then
            kill "$(cat /tmp/el-strict/server.pid)" 2>/dev/null || true
          fi

      - name: Upload strict Greek evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: greek-strict-native-whole-site
          path: /tmp/el-strict/evidence/
          if-no-files-found: warn
          retention-days: 90
