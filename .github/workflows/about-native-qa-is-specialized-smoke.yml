name: About i18n Icelandic reviewer smoke

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-is-specialized-smoke.yml

permissions:
  contents: read

jobs:
  icelandic-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned reviewer runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            'transformers==5.17.0' \
            'accelerate==1.15.0' \
            'huggingface_hub==1.33.0' \
            'safetensors==0.8.0' \
            'protobuf==7.36.2'

      - name: Run isolated Icelandic reviewer qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/is-reviewer-smoke
          python - <<'PY'
          from pathlib import Path
          import json
          import torch
          from huggingface_hub import HfApi
          from transformers import AutoModelForCausalLM, AutoTokenizer

          model_id = "arnastofnun/Qwen3-4B-wmt26-AMI-en-is"
          revision = HfApi().model_info(model_id).sha

          tokenizer = AutoTokenizer.from_pretrained(model_id, revision=revision)
          model = AutoModelForCausalLM.from_pretrained(
              model_id,
              revision=revision,
              torch_dtype=torch.bfloat16,
              low_cpu_mem_usage=True,
              device_map="cpu",
          )
          model.eval()

          system = (
              "Þú ert strangur íslenskur málfarsrýnir. "
              "Svaraðu eingöngu á eðlilegri nútímaíslensku. "
              "Þú færð aðeins eitt textabrot í einu. "
              "Ræddu EINGÖNGU það textabrot; nefndu ekki orð eða efni sem koma ekki fyrir í því. "
              "Ekki framkvæma almennt kóðarýni. "
              "Fyrsta línan á að vera nákvæmlega annaðhvort „DÓMUR: EÐLILEGT“ eða „DÓMUR: LAGFÆRA“."
          )

          cases = [
              {
                  "id": "good-search-heading",
                  "text": "Leitaðu í hvaða dagatali sem vefurinn styður",
                  "note": "known-good/current wording",
              },
              {
                  "id": "awkward-old-search-heading",
                  "text": "Leitaðu í hvaða studdu dagatali sem er",
                  "note": "known-awkward superseded wording",
              },
              {
                  "id": "clear-agreement-error",
                  "text": "Þessar dagsetningar er rétt og birtist hér.",
                  "note": "intentionally ungrammatical control",
              },
          ]

          def review_one(fragment):
              messages = [
                  {"role": "system", "content": system},
                  {
                      "role": "user",
                      "content": (
                          "Metið eingöngu eftirfarandi íslenska textabrot með tilliti til "
                          "náttúrulegs málfars, málfræði og setningagerðar. "
                          "Ef það þarf lagfæringu, útskýrðu stuttlega hvers vegna og gefðu eina betri tillögu.\n\n"
                          f"TEXTABROT: „{fragment}“"
                      ),
                  },
              ]
              rendered = tokenizer.apply_chat_template(
                  messages,
                  tokenize=False,
                  add_generation_prompt=True,
              )
              inputs = tokenizer(rendered, return_tensors="pt")
              with torch.inference_mode():
                  output = model.generate(
                      **inputs,
                      max_new_tokens=160,
                      do_sample=False,
                      eos_token_id=tokenizer.eos_token_id,
                  )
              new_tokens = output[0, inputs["input_ids"].shape[1]:]
              return tokenizer.decode(new_tokens, skip_special_tokens=True).strip()

          results = []
          for case in cases:
              answer = review_one(case["text"])
              results.append({**case, "answer": answer})
              print(f"--- {case['id']} ---")
              print(answer)
              print()

          out = Path("/tmp/is-reviewer-smoke")
          out.joinpath("model.json").write_text(
              json.dumps(
                  {
                      "model_id": model_id,
                      "revision": revision,
                      "torch_dtype": "bfloat16",
                      "transformers": "5.17.0",
                      "torch": "2.8.0",
                      "qualification_method": "three isolated one-fragment reviews",
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          out.joinpath("qualification.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          out.joinpath("answer.md").write_text(
              "\n\n".join(
                  f"## {r['id']}\n\nTexti: „{r['text']}“\n\n{r['answer']}"
                  for r in results
              ) + "\n",
              encoding="utf-8",
          )

          for r in results:
              if len(r["answer"]) < 40:
                  raise SystemExit(f"reviewer answer unexpectedly short: {r['id']}")
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icelandic-specialized-reviewer-smoke
          path: /tmp/is-reviewer-smoke/
          if-no-files-found: warn
