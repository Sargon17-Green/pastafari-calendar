name: About retranslation pipeline

on:
  push:
    branches:
      - feature/about-retranslation-71-locales
    paths:
      - artifacts/about-retranslation-2026-10-04/control.json

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      batch: ${{ steps.matrix.outputs.batch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path("artifacts/about-retranslation-2026-10-04/locales.json").read_text(encoding="utf-8"))
          control=json.loads(Path("artifacts/about-retranslation-2026-10-04/control.json").read_text(encoding="utf-8"))
          by={x["code"]:x for x in manifest["locales"]}
          requested=control.get("locales",[])
          if requested=="ALL":
              requested=[x["code"] for x in manifest["locales"]]
          if not isinstance(requested,list) or not requested:
              raise SystemExit("No locales requested")
          unknown=[x for x in requested if x not in by]
          if unknown:
              raise SystemExit(f"Unknown locales: {unknown}")
          matrix=[by[x] for x in requested]
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("matrix="+json.dumps(matrix,ensure_ascii=False,separators=(",",":"))+"\n")
              f.write("batch="+str(control.get("batch","unnamed")).replace(" ","_")+"\n")
          print("Locales:", ", ".join(requested))
          PY

  translate-and-review:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/about-retranslation-71-locales
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install pinned Copilot CLI
        run: |
          npm install -g @github/copilot@1.0.88
          copilot --version
      - name: Run from-scratch translation and dual QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODE: ${{ matrix.locale.code }}
          TAG: ${{ matrix.locale.tag }}
          DIRECTION: ${{ matrix.locale.dir }}
        shell: bash
        run: |
          set -euo pipefail
          STAGING="artifacts/about-retranslation-2026-10-04/staging/$CODE"
          if [ -s "$STAGING/about.html" ] && [ -s "$STAGING/monster.html" ] && [ -s "$STAGING/native-review-prompt.md" ]; then
            echo "Existing candidate found; continuing QA/repair cycles."
            python scripts/about-retranslation-resume.py \
              --locale "$CODE" \
              --tag "$TAG" \
              --dir "$DIRECTION" \
              --max-cycle 8
          else
            echo "No candidate found; creating a fresh translation directly from Hebrew."
            set +e
            python scripts/about-retranslation-worker.py \
              --locale "$CODE" \
              --tag "$TAG" \
              --dir "$DIRECTION" \
              --max-cycles 3
            INITIAL_RC=$?
            set -e
            if python - "$STAGING/status.json" <<'PY'
import json, pathlib, sys
p=pathlib.Path(sys.argv[1])
raise SystemExit(0 if p.exists() and json.loads(p.read_text(encoding="utf-8")).get("publishable") else 1)
PY
            then
              exit 0
            fi
            echo "Initial three-cycle pass did not converge (exit $INITIAL_RC); continuing from staged candidate."
            python scripts/about-retranslation-resume.py \
              --locale "$CODE" \
              --tag "$TAG" \
              --dir "$DIRECTION" \
              --max-cycle 8
          fi
      - name: Upload immutable locale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retranslation-${{ matrix.locale.code }}
          path: artifacts/about-retranslation-2026-10-04/staging/${{ matrix.locale.code }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: ${{ always() }}
    needs:
      - prepare
      - translate-and-review
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/about-retranslation-71-locales
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: retranslation-*
          path: /tmp/retranslation
          merge-multiple: false
      - name: Install evidence and summarize
        shell: bash
        env:
          BATCH: ${{ needs.prepare.outputs.batch }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/about-retranslation-2026-10-04/staging
          shopt -s nullglob
          found=0
          for dir in /tmp/retranslation/retranslation-*; do
            code="${dir##*/retranslation-}"
            dest="artifacts/about-retranslation-2026-10-04/staging/$code"
            rm -rf "$dest"
            mkdir -p "$dest"
            cp -a "$dir/." "$dest/"
            found=1
          done
          test "$found" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/about-retranslation-2026-10-04/staging")
          rows=[]
          for p in sorted(root.glob("*/status.json")):
              d=json.loads(p.read_text(encoding="utf-8"))
              rows.append(d)
          out=Path("artifacts/about-retranslation-2026-10-04/latest-status.json")
          out.write_text(json.dumps({"locales":rows},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Commit staging evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/about-retranslation-2026-10-04/
          if git diff --cached --quiet; then
            echo "No new evidence to commit."
            exit 0
          fi
          git commit -m "about(i18n): record retranslation batch ${{ needs.prepare.outputs.batch }}"
          git pull --rebase origin feature/about-retranslation-71-locales
          git push origin HEAD:feature/about-retranslation-71-locales
