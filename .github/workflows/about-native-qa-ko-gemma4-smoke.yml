name: Korean Gemma4 reviewer qualification

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-ko-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ko-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/ko-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/ko-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ko-gemma/llama.tar.gz -C /tmp/ko-gemma/llama
      - name: Qualify Korean reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/ko-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' -c 4096 -t 4 --host 127.0.0.1 --port 8080 > /tmp/ko-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"날짜를 선택하고 다시 시도하세요.","expected":"자연"},{"id":"g2","text":"작업일은 계산의 출발점입니다.","expected":"자연"},{"id":"g3","text":"이전 커틀릿","expected":"자연"},{"id":"g4","text":"달은 한 해 동안 서로 얽힐 수 있습니다.","expected":"자연"},{"id":"b1","text":"Click here 해서 계속하세요.","expected":"수정"},{"id":"b2","text":"working day를 변경하세요.","expected":"수정"},{"id":"b3","text":"Измените 작업일.","expected":"수정"},{"id":"b4","text":"Cambiar la fecha를 선택하세요.","expected":"수정"}]
          ids=[x["id"] for x in cases]
          prompt="당신은 현대 표준 한국어를 엄격하게 검토하는 원어민 편집자입니다. 여덟 문장을 각각 따로 평가하세요. 자연스러움과 문법, 그리고 영어·러시아어·스페인어 등 다른 언어가 의도치 않게 섞였는지 확인하세요. ‘작업일’, ‘조회일’, ‘커틀릿’, 서로 얽힌 달은 이 프로젝트에서 의도한 용어입니다. Return only JSON; verdict must be exactly 자연 or 수정."+"\n\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["자연","수정"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"ko_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/ko-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/ko-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ko-gemma4-reviewer-qualification
          path: |
            /tmp/ko-gemma/qualification.json
            /tmp/ko-gemma/qualification-raw.json
            /tmp/ko-gemma/server.log
          retention-days: 30
