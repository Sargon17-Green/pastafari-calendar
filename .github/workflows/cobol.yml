name: cobol

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cobol-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install COBOL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol libgmp-dev
      - name: Compile and run fixed COBOL vectors
        run: make -C cobol test
