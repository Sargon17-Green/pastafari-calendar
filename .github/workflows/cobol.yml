name: implementations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-canonical:
    name: Python 3 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run Python canonical conformance
        working-directory: implementations
        run: PYTHONPATH=python python3 -m unittest python.tests.test_conformance -v

  c-canonical:
    name: C17 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build and run C canonical conformance
        run: make -C implementations/c test-canonical

  cpp-canonical:
    name: C++20 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Build and run C++ canonical conformance
        run: make -C implementations/cpp test-canonical

  java-canonical:
    name: Java 17 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Java 17 source compatibility
        run: |
          mkdir -p implementations/java/build/ci
          javac --release 17 \
            -d implementations/java/build/ci \
            implementations/java/src/main/java/org/appointedtimes/PastafariCalendar.java
      - name: Run Java canonical conformance
        run: make -C implementations/java test-canonical

  ruby-canonical:
    name: Ruby canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Run Ruby canonical conformance
        run: make -C implementations/ruby test-canonical

  cobol-compatibility:
    name: COBOL compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install COBOL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol libgmp-dev
      - name: Compile and run fixed COBOL vectors
        run: make -C implementations/cobol test

  gate-checkpoints:
    name: Shared gate checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify shared gate checkpoints across native implementations
        working-directory: implementations
        run: python3 tests/verify_gate_checkpoints.py
