name: Azerbaijani Gemma3 12B reviewer qualification

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-az-gemma3-12b-smoke.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/az-gemma12/llama
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/az-gemma12/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/az-gemma12/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/az-gemma12/llama.tar.gz -C /tmp/az-gemma12/llama

      - name: Qualify Azerbaijani Gemma 3 12B reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/az-gemma12/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-3-12b-it-GGUF:Q4_K_M \
            -c 4096 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/az-gemma12/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 900); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases = [
              ("g1", "Təqvim seçin, tarix daxil edin və “Tarixi göstər” düyməsinə basın.", "TƏBİİ"),
              ("g2", "Əməl günü hesablamanın başlanğıc nöqtəsidir.", "TƏBİİ"),
              ("g3", "“Əvvəlki kotlet” düyməsi əvvəlki kotletə keçir.", "TƏBİİ"),
              ("g4", "Aylar il boyu bir-birinə hörülə bilər.", "TƏBİİ"),
              ("g5", "Soruşulan gün dəyişmir; yalnız göstərilən Pastafari tarixi əməl günündən asılıdır.", "TƏBİİ"),
              ("b1", "İşlem gününü değiştir.", "DÜZƏLT"),
              ("b2", "Bu site nasıl kullanılır?", "DÜZƏLT"),
              ("b3", "Tarix arama ve müqayisə özellikli bir təqvim.", "DÜZƏLT"),
              ("b4", "Bu tarix etibarlıdılar.", "DÜZƏLT"),
              ("b5", "Hesablama nəticələri gösterilir.", "DÜZƏLT"),
          ]

          prompt = (
              "Sən ciddi, ana dili Azərbaycan dili olan dil redaktorusan. Yalnız verilən fraqmenti qiymətləndir. "
              "Müasir təbii Azərbaycan dili, qrammatika, uzlaşma, sintaksis, idiomatiklik və dilin həqiqətən Azərbaycan dili "
              "olub-olmadığını yoxla; Türkiyə türkcəsini Azərbaycan dili kimi qəbul etmə. "
              "Bu layihədə 'əməl günü', 'soruşulan gün', 'kotlet' və 'bir-birinə hörülmüş aylar' kanonik domen terminləridir; 'kotlet' bu layihədə qəsdən istifadə olunan termin kimi qəbul edilməlidir. "
              "Onları sırf qeyri-adi olduğuna görə rədd etmə. "
              "Birinci sətir dəqiq olaraq ya 'QƏRAR: TƏBİİ', ya da 'QƏRAR: DÜZƏLT' olmalıdır. "
              "İkinci sətirdə Azərbaycan dilində bir qısa səbəb ver."
          )

          results=[]
          for case_id, fragment, expected in cases:
              payload={
                  "messages":[{"role":"user","content":prompt+"\n\nFRAQMENT: "+json.dumps(fragment,ensure_ascii=False)}],
                  "temperature":0.0,
                  "max_tokens":140,
                  "stream":False,
              }
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req,timeout=1200) as resp:
                  data=json.load(resp)
              answer=data["choices"][0]["message"]["content"].strip()
              first=answer.splitlines()[0].strip() if answer else ""
              actual="TƏBİİ" if first=="QƏRAR: TƏBİİ" else "DÜZƏLT" if first=="QƏRAR: DÜZƏLT" else "ETİBARSIZ"
              passed=actual==expected
              results.append({"id":case_id,"fragment":fragment,"expected":expected,"actual":actual,"passed":passed,"answer":answer})
              print(case_id,results[-1])

          Path("/tmp/az-gemma12/qualification.json").write_text(
              json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          failed=[r["id"] for r in results if not r["passed"]]
          if failed:
              raise SystemExit("Azerbaijani Gemma 3 12B qualification failed: "+", ".join(failed))
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azerbaijani-gemma3-12b-reviewer-qualification
          path: |
            /tmp/az-gemma12/qualification.json
            /tmp/az-gemma12/server.log
          if-no-files-found: warn
          retention-days: 30
