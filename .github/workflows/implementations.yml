name: implementations

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      impl_python_job: ${{ steps.classify.outputs.impl_python_job }}
      impl_c_job: ${{ steps.classify.outputs.impl_c_job }}
      impl_cpp_job: ${{ steps.classify.outputs.impl_cpp_job }}
      impl_java_job: ${{ steps.classify.outputs.impl_java_job }}
      impl_ruby_job: ${{ steps.classify.outputs.impl_ruby_job }}
      impl_cobol_job: ${{ steps.classify.outputs.impl_cobol_job }}
      impl_gate_job: ${{ steps.classify.outputs.impl_gate_job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-classifier.mjs --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  python-canonical:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.impl_python_job == 'true') }}
    name: Python 3 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Run Python canonical conformance
        working-directory: implementations
        run: PYTHONPATH=python python3 -m unittest python.tests.test_conformance -v

  c-canonical:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.impl_c_job == 'true') }}
    name: C17 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build and run C canonical conformance
        run: make -C implementations/c test-canonical

  cpp-canonical:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.impl_cpp_job == 'true') }}
    name: C++20 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Build and run C++ canonical conformance
        run: make -C implementations/cpp test-canonical

  java-canonical:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.impl_java_job == 'true') }}
    name: Java 17 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Java 17 source compatibility
        run: |
          mkdir -p implementations/java/build/ci
          javac --release 17 \
            -d implementations/java/build/ci \
            implementations/java/src/main/java/org/appointedtimes/PastafariCalendar.java
      - name: Run Java canonical conformance
        run: make -C implementations/java test-canonical

  ruby-canonical:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.impl_ruby_job == 'true') }}
    name: Ruby canonical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch head, 2026-07-22
        with:
          ruby-version: '3.3'
      - name: Run Ruby canonical conformance
        run: make -C implementations/ruby test-canonical

  cobol-compatibility:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.impl_cobol_job == 'true') }}
    name: COBOL compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install COBOL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol libgmp-dev
      - name: Compile and run fixed COBOL vectors
        run: make -C implementations/cobol test

  gate-checkpoints:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.impl_gate_job == 'true') }}
    name: Shared gate checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Verify shared gate checkpoints across native implementations
        working-directory: implementations
        run: python3 tests/verify_gate_checkpoints.py
