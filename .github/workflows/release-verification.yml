name: Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-verify:
    name: unpublished release candidate verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify release candidate without publishing
        run: npm run release:verify
      - name: Preserve machine-readable verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unpublished-release-candidate-report-${{ github.sha }}
          path: artifacts/release/report.json
          if-no-files-found: warn
          retention-days: 14

  standalone-cross-platform:
    name: standalone byte identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild twice and compare with checked-in standalone artifacts
        run: npm run build:standalone -- --verify
