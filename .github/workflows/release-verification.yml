name: Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-verify:
    name: unpublished release candidate verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - name: Exclude installed dependencies from release-tree cleanliness
        shell: bash
        run: printf 'node_modules/\n' >> .git/info/exclude
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Verify release candidate without publishing
        run: npm run release:verify
      - name: Preserve machine-readable verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpublished-release-candidate-report-${{ github.sha }}
          path: artifacts/release/report.json
          if-no-files-found: warn
          retention-days: 14

  standalone-cross-platform:
    name: standalone byte identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Configure canonical Windows checkout bytes
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify canonical Windows checkout bytes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $coreWorktree = git hash-object --no-filters browser/pastafari-calendar-core.js
          $coreHead = git rev-parse HEAD:browser/pastafari-calendar-core.js
          if ($coreWorktree -ne $coreHead) { throw "authoritative-core working tree differs from Git blob" }
          $builderWorktree = git hash-object --no-filters scripts/build-standalone.mjs
          $builderHead = git rev-parse HEAD:scripts/build-standalone.mjs
          if ($builderWorktree -ne $builderHead) { throw "standalone builder working tree differs from Git blob" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - name: Rebuild twice and compare with checked-in standalone artifacts
        run: npm run build:standalone -- --verify
