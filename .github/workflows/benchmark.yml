name: benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - name: Benchmark API smoke
        run: npm run benchmark:smoke

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:supply-chain
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run full benchmark suite
        run: npm run benchmark
      - name: Publish report in job summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/benchmarks/report.md ]]; then
            cat artifacts/benchmarks/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/benchmarks/
          if-no-files-found: warn
          retention-days: 30
