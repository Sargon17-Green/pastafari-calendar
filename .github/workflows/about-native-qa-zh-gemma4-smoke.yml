name: Chinese Gemma4 reviewer qualification

on:
  push:
    branches: [feature/about-i18n-72-locales]
    paths: [.github/workflows/about-native-qa-zh-gemma4-smoke.yml]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zh-gemma/llama
          curl -fL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz -o /tmp/zh-gemma/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/zh-gemma/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zh-gemma/llama.tar.gz -C /tmp/zh-gemma/llama
      - name: Qualify Chinese reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/zh-gemma/llama -type f -name llama-server | head -n 1)"
          "$SERVER" -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' -c 4096 -t 4 --host 127.0.0.1 --port 8080 > /tmp/zh-gemma/server.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 600); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          cases=[{"id":"g1","text":"无法识别该日期。请检查所有字段是否完整，并确认该日期在所选历法中确实存在。","expected":"OK"},{"id":"g2","text":"作业日是计算的出发点。","expected":"OK"},{"id":"g3","text":"上一个肉排","expected":"OK"},{"id":"g4","text":"如何使用本站？","expected":"OK"},{"id":"b1","text":"Click here，然后继续。","expected":"FIX"},{"id":"b2","text":"Change the working day.","expected":"FIX"},{"id":"b3","text":"この日付を選択してください。","expected":"FIX"},{"id":"b4","text":"이 사이트를 어떻게 사용하나요?","expected":"FIX"}]
          ids=[x["id"] for x in cases]
          prompt="你是一名严格的现代标准简体中文母语编辑。请分别评估下面八个片段，检查自然度、语法，以及意外残留的英语、日语、韩语或混合语言。‘作业日’、‘被查询日’、‘肉排’以及彼此交织的月份是本项目有意采用的领域术语。只返回 JSON / Return only JSON; verdict must be exactly OK or FIX."+"\n\n"+json.dumps(cases,ensure_ascii=False)
          schema={"type":"object","properties":{"decisions":{"type":"array","minItems":8,"maxItems":8,"items":{"type":"object","properties":{"id":{"type":"string","enum":ids},"verdict":{"type":"string","enum":["OK","FIX"]}},"required":["id","verdict"],"additionalProperties":False}}},"required":["decisions"],"additionalProperties":False}
          payload={"messages":[{"role":"user","content":prompt}],"temperature":0.0,"max_tokens":420,"reasoning_effort":"none","chat_template_kwargs":{"enable_thinking":False},"stream":False,"response_format":{"type":"json_schema","json_schema":{"name":"zh_qualification","strict":True,"schema":schema}}}
          req=urllib.request.Request("http://127.0.0.1:8080/v1/chat/completions",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp: data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip(); ds=json.loads(raw).get("decisions",[])
          actual={d["id"]:d["verdict"] for d in ds}; results=[]; failed=[]
          for x in cases:
            ok=actual.get(x["id"])==x["expected"]; results.append({**x,"actual":actual.get(x["id"]),"passed":ok})
            if not ok: failed.append(x["id"])
          Path("/tmp/zh-gemma/qualification.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/zh-gemma/qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          if len(ds)!=8 or failed: raise SystemExit("qualification failed")
          PY
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zh-gemma4-reviewer-qualification
          path: |
            /tmp/zh-gemma/qualification.json
            /tmp/zh-gemma/qualification-raw.json
            /tmp/zh-gemma/server.log
          retention-days: 30
