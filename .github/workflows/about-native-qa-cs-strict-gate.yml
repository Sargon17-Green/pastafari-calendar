name: Czech strict native-language whole-site gate

on:
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - .github/workflows/about-native-qa-cs-strict-gate.yml
      - docs/i18n/locales/cs.js
      - docs/about/content/cs.html
      - docs/manifest.webmanifest
      - docs/i18n/registry.js

permissions:
  contents: read

concurrency:
  group: czech-strict-native-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-cs:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cs-strict/llama /tmp/cs-strict/evidence
          curl -fL --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10982/llama-b10982-bin-ubuntu-x64.tar.gz \
            -o /tmp/cs-strict/llama.tar.gz
          echo "b6e27d8fb4c6d35084cba3c36accc059b4b4f468372956730295577f05066789  /tmp/cs-strict/llama.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cs-strict/llama.tar.gz -C /tmp/cs-strict/llama
          git rev-parse HEAD > /tmp/cs-strict/evidence/reviewed-head.txt

      - name: Extract grounded Czech website corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re

          items=[]

          locale=Path("docs/i18n/locales/cs.js").read_text(encoding="utf-8")
          for key, raw in re.findall(r'"([^"]+)"\s*:\s*("(?:\\.|[^"\\])*")', locale):
              try:
                  value=json.loads(raw)
              except Exception:
                  continue
              if not isinstance(value,str) or not value.strip():
                  continue
              if key in {"code","dir","intlLocale"}:
                  continue
              items.append({"location":f"docs/i18n/locales/cs.js#{key}","text":value.strip()})

          class Parser(HTMLParser):
              wanted={"p","li","h1","h2","h3","h4","h5","h6","th","td","caption","blockquote"}
              attrs_wanted={"aria-label","aria-description","title","alt"}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.sections=[]
                  self.current=None
                  self.attr_counter=0
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=="br" and self.current is not None:
                      self.current["parts"].append(". ")
                  if tag=="section":
                      self.sections.append(attrs.get("id",""))
                  section=next((x for x in reversed(self.sections) if x),"")
                  ident=attrs.get("id") or section or tag
                  for name in self.attrs_wanted:
                      value=attrs.get(name)
                      if value and value.strip():
                          items.append({
                              "location":f"docs/about/content/cs.html#{ident}@{name}-{self.attr_counter}",
                              "text":value.strip()
                          })
                          self.attr_counter+=1
                  if tag in self.wanted:
                      self.current={"tag":tag,"id":attrs.get("id",""),"section":section,"parts":[]}
              def handle_endtag(self,tag):
                  if self.current is not None and self.current["tag"]==tag:
                      text=re.sub(r"\s+"," ","".join(self.current["parts"])).strip()
                      if text:
                          ident=self.current["id"] or self.current["section"] or self.current["tag"]
                          items.append({"location":f"docs/about/content/cs.html#{ident}","text":text})
                      self.current=None
                  if tag=="section" and self.sections:
                      self.sections.pop()
              def handle_data(self,data):
                  if self.current is not None:
                      self.current["parts"].append(data)

          parser=Parser()
          parser.feed(Path("docs/about/content/cs.html").read_text(encoding="utf-8"))

          manifest=json.loads(Path("docs/manifest.webmanifest").read_text(encoding="utf-8"))
          for field in ("name_localized","short_name_localized","description_localized"):
              value=manifest.get(field,{}).get("cs",{}).get("value")
              if isinstance(value,str) and value.strip():
                  items.append({"location":f"docs/manifest.webmanifest#{field}.cs.value","text":value.strip()})

          registry=Path("docs/i18n/registry.js").read_text(encoding="utf-8")
          m=re.search(r'defineLocale\("cs",\s*"([^"]+)"',registry)
          if m:
              items.append({"location":"docs/i18n/registry.js#locale-cs-display-name","text":m.group(1)})

          seen=set(); out=[]
          for item in items:
              pair=(item["location"],item["text"])
              if pair in seen:
                  continue
              seen.add(pair)
              item["id"]=f"CS{len(out):04d}"
              out.append(item)

          Path("/tmp/cs-strict/evidence/items.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          compact=json.dumps(out,ensure_ascii=False,separators=(",",":"))
          Path("/tmp/cs-strict/corpus.json").write_text(compact,encoding="utf-8")
          print(f"items={len(out)} chars={len(compact)}")
          if len(compact)>100000:
              raise SystemExit("Czech corpus unexpectedly exceeds one-shot review budget")
          PY

      - name: Start isolated Czech Gemma 4 reviewer
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find /tmp/cs-strict/llama -type f -name llama-server | head -n 1)"
          test -x "$SERVER"
          "$SERVER" \
            -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 \
            --reasoning auto --chat-template-kwargs '{"enable_thinking":false}' \
            -c 32768 -t 4 --host 127.0.0.1 --port 8080 \
            > /tmp/cs-strict/evidence/server.log 2>&1 &
          echo "$!" > /tmp/cs-strict/server.pid
          for _ in $(seq 1 900); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health >/dev/null

      - name: Batched hidden Czech reviewer qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          cases=[
              {"id":"g1","text":"Vyberte datum a zkuste to znovu.","expected":"PŘIROZENÉ"},
              {"id":"g2","text":"Den činnosti je výchozím bodem výpočtu.","expected":"PŘIROZENÉ"},
              {"id":"g3","text":"Předchozí řízek","expected":"PŘIROZENÉ"},
              {"id":"g4","text":"Měsíce se mohou během roku vzájemně proplétat.","expected":"PŘIROZENÉ"},
              {"id":"b1","text":"Zmeňte deň činnosti.","expected":"OPRAVIT"},
              {"id":"b2","text":"Click here a pokračujte.","expected":"OPRAVIT"},
              {"id":"b3","text":"W tym roku jest kilka miesięcy.","expected":"OPRAVIT"},
              {"id":"b4","text":"Jak пользоваться tímto webem?","expected":"OPRAVIT"}
          ]
          ids=[c["id"] for c in cases]
          prompt=(
              "Jsi přísný jazykový editor současné standardní češtiny na úrovni rodilého mluvčího. "
              "Posuď všech osm fragmentů samostatně. Kontroluj přirozenost, gramatiku, shodu, syntaxi, pravopis "
              "a zda text není nechtěně slovensky, polsky, rusky, anglicky nebo jazykově smíšený. "
              "V tomto projektu jsou výrazy ‘den činnosti’, ‘dotazovaný den’, ‘řízek’ a myšlenka, že se měsíce mohou proplétat, "
              "záměrné kanonické doménové termíny/konstrukce; neodmítej je jen proto, že jsou neobvyklé. "
              "Vrať pouze JSON. Pro každý id smí být verdict jen PŘIROZENÉ nebo OPRAVIT.\n\n"
              + json.dumps(cases,ensure_ascii=False)
          )
          schema={
              "type":"object",
              "properties":{
                  "decisions":{
                      "type":"array","minItems":8,"maxItems":8,
                      "items":{
                          "type":"object",
                          "properties":{
                              "id":{"type":"string","enum":ids},
                              "verdict":{"type":"string","enum":["PŘIROZENÉ","OPRAVIT"]}
                          },
                          "required":["id","verdict"],"additionalProperties":False
                      }
                  }
              },
              "required":["decisions"],"additionalProperties":False
          }
          payload={
              "messages":[{"role":"user","content":prompt}],
              "temperature":0.0,"max_tokens":420,"reasoning_effort":"none",
              "chat_template_kwargs":{"enable_thinking":False},"stream":False,
              "response_format":{"type":"json_schema","json_schema":{"name":"cs_qualification","strict":True,"schema":schema}}
          }
          req=urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=2400) as resp:
              data=json.load(resp)
          raw=data["choices"][0]["message"]["content"].strip()
          ev=Path("/tmp/cs-strict/evidence")
          ev.joinpath("qualification-raw.json").write_text(raw+"\n",encoding="utf-8")
          parsed=json.loads(raw)
          decisions=parsed.get("decisions",[])
          if len(decisions)!=8 or len({d.get("id") for d in decisions})!=8:
              raise SystemExit("Czech qualification returned incomplete/duplicate decisions")
          actual={d["id"]:d["verdict"] for d in decisions}
          results=[]; failed=[]
          for c in cases:
              passed=actual.get(c["id"])==c["expected"]
              results.append({**c,"actual":actual.get(c["id"]),"passed":passed})
              if not passed:
                  failed.append(c["id"])
          ev.joinpath("qualification.json").write_text(
              json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps(results,ensure_ascii=False,indent=2))
          if failed:
              raise SystemExit("Czech reviewer qualification failed: "+", ".join(failed))
          PY

      - name: Strict whole-site Czech review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          ev=Path("/tmp/cs-strict/evidence")
          items=json.loads(ev.joinpath("items.json").read_text(encoding="utf-8"))
          by_location={}
          for item in items:
              by_location.setdefault(item["location"],[]).append(item["text"])

          prompt=(
              "Jsi nezávislý a přísný jazykový editor na úrovni rodilého mluvčího pro českou verzi Pastafariánského kalendáře. "
              "Prověř veškerý dodaný viditelný a accessibility-facing text jako jeden whole-site jazykový celek. "
              "Aktivně hledej nechtěné průsaky slovenštiny, polštiny, ruštiny, angličtiny nebo jiných jazyků, kalky, nepřirozenou současnou češtinu, "
              "gramatické, syntaktické, shodové, pravopisné, interpunkční a terminologické problémy včetně metadata, manifestu a accessibility textu. "
              "Obyčejná anglická technická slova uvnitř české prózy jsou finding, pokud nejde o skutečně chráněný technický literal nebo vlastní jméno. "
              "Doménové termíny ‘den činnosti’, ‘dotazovaný den’, ‘řízek’, ‘propletené měsíce’ a myšlenka, že se měsíce mohou proplétat, jsou záměrné. "
              "Vzorce, názvy API/endpointů, code literals, hashe, HTTP, CLI, OpenAPI, SIMD, SLA, all-day, Short Choice, Wide Choice a skutečná vlastní jména "
              "mohou zůstat jako technický text. Každý finding musí použít přesný location z dodaných položek a current_text musí být doslovný souvislý substring textu na daném location. "
              "Nehlaš kód ani pokyny recenzentovi jako text webu. Correction nesmí být totožná s current_text. "
              "Web App Manifest má localized mapy: základní fallback pole nejsou českou chybou, pokud je česká localized položka správná. "
              "Statické anglické bootstrap hodnoty v prvcích data-i18n/data-i18n-attr nejsou finding, pokud je runtime před zobrazením uživateli nahrazuje. "
              "Hlaš pouze skutečné problémy vyžadující opravu. Pokud žádné nejsou, vrať CLEAN a prázdný seznam findings. Vrať pouze JSON podle schématu.\n\n"
              "WEBSITE_TEXT_ITEMS_JSON:\n"
              + Path("/tmp/cs-strict/corpus.json").read_text(encoding="utf-8")
          )
          schema={
              "type":"object",
              "properties":{
                  "result":{"type":"string","enum":["CLEAN","FINDINGS"]},
                  "findings":{
                      "type":"array","maxItems":14,
                      "items":{
                          "type":"object",
                          "properties":{
                              "severity":{"type":"string","enum":["critical","high","medium","low"]},
                              "location":{"type":"string"},
                              "current_text":{"type":"string","minLength":1,"maxLength":280},
                              "issue":{"type":"string","minLength":15,"maxLength":420},
                              "correction":{"type":"string","minLength":2,"maxLength":420}
                          },
                          "required":["severity","location","current_text","issue","correction"],
                          "additionalProperties":False
                      }
                  }
              },
              "required":["result","findings"],"additionalProperties":False
          }
          payload={
              "messages":[{"role":"user","content":prompt}],
              "temperature":0.05,"top_p":0.85,"max_tokens":1900,"reasoning_effort":"none",
              "chat_template_kwargs":{"enable_thinking":False},"stream":False,
              "response_format":{"type":"json_schema","json_schema":{"name":"cs_whole_site_review","strict":True,"schema":schema}}
          }

          last_error=""
          accepted=None
          for attempt in (1,2):
              msg=prompt if attempt==1 else prompt+"\n\nMECHANICKÝ_OPAKOVANÝ_POKUS=TRUE\nDŮVOD="+last_error+"\nVRAŤ_ÚPLNÝ_JSON=TRUE"
              payload["messages"]=[{"role":"user","content":msg}]
              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=3600) as resp:
                  data=json.load(resp)
              raw=data["choices"][0]["message"]["content"].strip()
              ev.joinpath(f"raw-review-attempt-{attempt}.json").write_text(raw+"\n",encoding="utf-8")
              try:
                  parsed=json.loads(raw)
              except Exception:
                  last_error="NEPLATNÝ_JSON"; continue
              result=parsed.get("result"); findings=parsed.get("findings")
              if result not in {"CLEAN","FINDINGS"} or not isinstance(findings,list):
                  last_error="NEPLATNÁ_STRUKTURA"; continue
              if result=="CLEAN" and findings:
                  last_error="CLEAN_S_FINDINGS"; continue
              if result=="FINDINGS" and not findings:
                  last_error="PRÁZDNÉ_FINDINGS"; continue

              seen=set(); good=True
              for f in findings:
                  loc=str(f.get("location","")).strip()
                  cur=str(f.get("current_text","")).strip()
                  corr=str(f.get("correction","")).strip()
                  pair=(loc,cur)
                  if loc not in by_location:
                      last_error="NEZNÁMÝ_LOCATION"; good=False; break
                  if not cur or not any(cur in text for text in by_location[loc]):
                      last_error="CURRENT_TEXT_NENÍ_NA_LOCATION"; good=False; break
                  if cur==corr:
                      last_error="NO_OP_CORRECTION"; good=False; break
                  if pair in seen:
                      last_error="DUPLIKÁT"; good=False; break
                  seen.add(pair)
              if not good:
                  continue
              accepted=parsed
              break

          if accepted is None:
              raise SystemExit("Czech whole-site review invalid after retries: "+last_error)

          final_result="PASS" if accepted["result"]=="CLEAN" else "FAIL"
          final={
              "result":final_result,
              "reviewed_head":ev.joinpath("reviewed-head.txt").read_text().strip(),
              "findings":accepted["findings"]
          }
          ev.joinpath("final.json").write_text(
              json.dumps(final,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          lines=[f"NATIVE_QA_RESULT: {final_result}",""]
          if final_result=="PASS":
              lines+=["Přísná česká whole-site jazyková kontrola nenašla žádný potvrzený problém vyžadující opravu.",""]
          else:
              lines+=["Přísná česká whole-site jazyková kontrola našla potvrzené problémy vyžadující opravu.",""]
              for i,f in enumerate(accepted["findings"],1):
                  lines += [
                      f"### {i}. {f['severity']}","",f["location"],"",
                      f"> {f['current_text']}","",f["issue"],"",
                      "Navržená oprava: "+f["correction"],""
                  ]
          ev.joinpath("review.md").write_text("\n".join(lines).rstrip()+"\n",encoding="utf-8")
          print(final_result)
          PY

      - name: Verify verdict
        shell: bash
        run: |
          set -euo pipefail
          head -n 1 /tmp/cs-strict/evidence/review.md | grep -Eq '^NATIVE_QA_RESULT: (PASS|FAIL)$'

      - name: Stop reviewer
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cs-strict/server.pid ]; then
            kill "$(cat /tmp/cs-strict/server.pid)" 2>/dev/null || true
          fi

      - name: Upload strict Czech evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: czech-strict-native-whole-site
          path: /tmp/cs-strict/evidence/
          if-no-files-found: warn
          retention-days: 90
