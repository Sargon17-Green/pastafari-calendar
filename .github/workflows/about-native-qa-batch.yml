name: About i18n native-session QA batch

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      locales:
        description: "Comma-separated repository locale codes to review"
        required: true
        default: "is"
  push:
    branches:
      - feature/about-i18n-72-locales
    paths:
      - artifacts/about-i18n-native-qa-batch.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      locales: ${{ steps.matrix.outputs.locales }}
      batch: ${{ steps.matrix.outputs.batch }}
    steps:
      - name: Checkout review source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Build locale matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LOCALES: ${{ inputs.locales }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          let batch = "manual";
          let locales;
          if (process.env.EVENT_NAME === "workflow_dispatch") {
            locales = String(process.env.INPUT_LOCALES || "").split(",").map((value) => value.trim()).filter(Boolean);
          } else {
            const control = JSON.parse(fs.readFileSync("artifacts/about-i18n-native-qa-batch.json", "utf8"));
            batch = String(control.batch || "push");
            locales = control.locales;
          }
          if (!Array.isArray(locales) || locales.length === 0) throw new Error("No locales requested.");
          if (locales.length > 72) throw new Error("Locale batch is unexpectedly large.");
          const seen = new Set();
          for (const code of locales) {
            if (!/^[a-z]{2,3}$/.test(code)) throw new Error("Invalid repository locale code: " + code);
            if (seen.has(code)) throw new Error("Duplicate locale code: " + code);
            seen.add(code);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "locales=" + JSON.stringify(locales) + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "batch=" + batch.replace(/[^A-Za-z0-9_.-]/g, "_") + "\n");
          NODE

  review:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        code: ${{ fromJSON(needs.prepare.outputs.locales) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install pinned Copilot CLI
        run: |
          npm install -g @github/copilot@1.0.88
          copilot --version

      - name: Resolve locale metadata
        id: locale
        shell: bash
        env:
          CODE: ${{ matrix.code }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const code = process.env.CODE;
          const lines = fs.readFileSync("artifacts/about-i18n-rollout-ledger.md", "utf8").split(/\r?\n/);
          const rows = lines.filter((line) => line.startsWith("|")).map((line) => line.split("|").map((value) => value.trim()));
          const row = rows.find((parts) => parts[1] === code);
          if (!row) throw new Error("Locale " + code + " is missing from rollout ledger.");
          const tag = row[2];
          if (!tag) throw new Error("Locale " + code + " has no BCP47 tag.");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "tag=" + tag + "\n");
          NODE

      - name: Prepare evidence directory and translation request
        shell: bash
        env:
          CODE: ${{ matrix.code }}
          TAG: ${{ steps.locale.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          EVIDENCE_DIR="artifacts/about-i18n-native-sessions/$CODE/attempt-$RUN_ID"
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/reviewed-head.txt"
          printf '%s\n' "$CODE" > "$EVIDENCE_DIR/locale-code.txt"
          printf '%s\n' "$TAG" > "$EVIDENCE_DIR/locale-tag.txt"
          printf '%s\n' "$RUN_ID" > "$EVIDENCE_DIR/run-id.txt"
          EVIDENCE_DIR="$EVIDENCE_DIR" CODE="$CODE" TAG="$TAG" node <<'NODE'
          const fs = require("node:fs");
          const code = process.env.CODE;
          const tag = process.env.TAG;
          const source = fs.readFileSync("artifacts/about-i18n-qa/NATIVE_REVIEW_PROTOCOL_SOURCE.md", "utf8")
            .replaceAll("{{LOCALE_CODE}}", code)
            .replaceAll("{{LOCALE_TAG}}", tag);
          const request = [
            "Translate the reviewer protocol below into the natural language of BCP 47 locale " + tag + ".",
            "This translation will be the ONLY user prompt in a fresh reviewer session, so all ordinary instruction prose must be in the target language.",
            "Preserve repository paths, code tokens, placeholders, severity labels where technically needed, and the exact machine-readable lines NATIVE_QA_RESULT: PASS and NATIVE_QA_RESULT: FAIL.",
            "Do not add commentary, a preface, code fences, or translator notes. Output only the translated reviewer prompt.",
            "",
            source,
          ].join("\n");
          fs.writeFileSync("/tmp/native-review-translate.md", request);
          NODE

      - name: Translate reviewer prompt into target language
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODE: ${{ matrix.code }}
          RUN_ID: ${{ github.run_id }}
        run: |
          EVIDENCE_DIR="artifacts/about-i18n-native-sessions/$CODE/attempt-$RUN_ID"
          copilot \
            --no-custom-instructions \
            --no-ask-user \
            --no-color \
            --share="$EVIDENCE_DIR/translator-session.md" \
            -s < /tmp/native-review-translate.md \
            > "$EVIDENCE_DIR/prompt.md"
          test -s "$EVIDENCE_DIR/prompt.md"
          test -s "$EVIDENCE_DIR/translator-session.md"
          grep -q 'NATIVE_QA_RESULT: PASS' "$EVIDENCE_DIR/prompt.md"
          grep -q 'NATIVE_QA_RESULT: FAIL' "$EVIDENCE_DIR/prompt.md"

      - name: Run isolated native-language reviewer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODE: ${{ matrix.code }}
          RUN_ID: ${{ github.run_id }}
        run: |
          EVIDENCE_DIR="artifacts/about-i18n-native-sessions/$CODE/attempt-$RUN_ID"
          set +e
          copilot \
            --no-custom-instructions \
            --no-ask-user \
            --no-color \
            --allow-tool='shell(cat:*),shell(grep:*),shell(find:*),shell(sed:*),shell(head:*),shell(tail:*),shell(wc:*),shell(ls:*),shell(pwd:*),shell(rg:*),shell(awk:*),shell(sort:*),shell(uniq:*),shell(git status:*),shell(git diff:*),shell(git show:*)' \
            --share="$EVIDENCE_DIR/session.md" \
            -s < "$EVIDENCE_DIR/prompt.md" \
            > "$EVIDENCE_DIR/review.md" \
            2> "$EVIDENCE_DIR/reviewer-stderr.log"
          COPILOT_EXIT=$?
          set -e
          printf '%s\n' "$COPILOT_EXIT" > "$EVIDENCE_DIR/copilot-exit-code.txt"

          if [ ! -s "$EVIDENCE_DIR/review.md" ]; then
            echo "Reviewer produced no review.md; Copilot exit code: $COPILOT_EXIT"
            cat "$EVIDENCE_DIR/reviewer-stderr.log" || true
            exit 1
          fi
          if [ ! -s "$EVIDENCE_DIR/session.md" ]; then
            echo "Reviewer produced no session.md; Copilot exit code: $COPILOT_EXIT"
            cat "$EVIDENCE_DIR/reviewer-stderr.log" || true
            exit 1
          fi
          if ! head -n 1 "$EVIDENCE_DIR/review.md" | grep -Eq '^NATIVE_QA_RESULT: (PASS|FAIL)'; then
            echo "Reviewer output has no valid machine-readable verdict; Copilot exit code: $COPILOT_EXIT"
            head -n 20 "$EVIDENCE_DIR/review.md" || true
            cat "$EVIDENCE_DIR/reviewer-stderr.log" || true
            exit 1
          fi
          head -n 1 "$EVIDENCE_DIR/review.md" > "$EVIDENCE_DIR/verdict.txt"
          printf '%s\n' "--- reviewer exit: $COPILOT_EXIT ---"
          cat "$EVIDENCE_DIR/verdict.txt"

      - name: Upload immutable review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.code }}
          path: artifacts/about-i18n-native-sessions/${{ matrix.code }}/attempt-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: ${{ always() }}
    needs:
      - prepare
      - review
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/about-i18n-72-locales
          fetch-depth: 0

      - name: Download successful review evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: /tmp/native-qa
          merge-multiple: false

      - name: Install evidence by immutable attempt
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          shopt -s nullglob
          found=0
          for dir in /tmp/native-qa/native-*; do
            code="${dir##*/native-}"
            destination="artifacts/about-i18n-native-sessions/$code/attempt-$RUN_ID"
            mkdir -p "$destination"
            cp -a "$dir/." "$destination/"
            found=1
          done
          test "$found" -eq 1

      - name: Commit review evidence once
        shell: bash
        env:
          BATCH: ${{ needs.prepare.outputs.batch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/about-i18n-native-sessions/
          if git diff --cached --quiet; then
            echo "No new evidence to commit."
            exit 0
          fi
          git commit -m "qa(i18n): record native-language batch $BATCH"
          git pull --rebase origin feature/about-i18n-72-locales
          git push origin HEAD:feature/about-i18n-72-locales
